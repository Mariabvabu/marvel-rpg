рать, активировать способность на максимальную Продолжительность, или прекратить в любой момент. В любом случае, он должен потратить стоимость Фокуса за каждый раунд.","page":127},{"name":"Временной портал","en":"Time Portal","flavor":"Персонаж открывает портал сквозь время.","group":"Омнивселенские Путешествия","prereq":"Временное Перемещение Вместе, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж открывает светящийся портал в пространстве рядом, который передвигает всё, что проходит через это пространство, в другой портал, который открывается в другом месте. Другой портал должен быть на свободном пространстве в другом временном промежутке, примерно в этом же месте. Что угодно может проходить сквозь портал в любом направлении, пока портал не закроется, что персонаж может сделать по желанию.","page":127},{"name":"Временное Перемещение","en":"Time Travel","flavor":"Персонаж перемещается из одного времени в другое.","group":"Омнивселенские Путешествия","prereq":"Ранг 3","action":"Обычное или передвижение","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж мгновенно перемещается из его текущего времени в другое, например, из настоящего в 1962. Когда он движется в другое время, он может появиться в любом месте, в котором бывал ранее. В ином случае, он появляется в ближайшем доступном свободном пространстве другого времени.","page":128},{"name":"Временное Перемещение Другого","en":"Time Travel Other","flavor":"Персонаж отправляет кого-то из одного времени в другое.","group":"Омнивселенские Путешествия","prereq":"Временное Перемещение, Ранг 4","action":"Обычное, реакция или передвижение","trigger":"Цель схвачена.","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает проверку Эго против защиты Бдительности цели, которую он схватил. Если проверка успешна, персонаж может отправить цель в другое время. Цель может появиться в любом месте, в котором персонаж бывал ранее. В ином случае, она появляется в ближайшем доступном свободном пространстве другого времени.","page":128},{"name":"Временное Перемещение Вместе","en":"Time Travel Together","flavor":"Персонаж берёт с собой кого-то в другое время","group":"Омнивселенские Путешествия","prereq":"Временное Перемещение, Ранг 3","action":"Обычное, реакция или передвижение","trigger":"Цель схвачена.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж движется в другое время, и берёт с собой кого-то, с кем они соприкасаются. Если цель не хочет идти в другое время — персонаж должен перед этим её схватить. Когда они движутся в другое время, они могут появиться в любом месте, в котором персонаж бывал ранее. В ином случае, они появляются в ближайшем доступном свободном пространстве другого времени.","page":128},{"name":"Поразительный 1","en":"Uncanny","flavor":"У персонажа защита от ментальных посягательств.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Любой множитель урона на атаки против Фокуса персонажа уменьшен на 1. Если эта способность — часть боевого костюма, сила заключена в снимаемом шлеме. В ином случае, это часть персонажа. Если способность зависит от брони или чего-то ещё снимаемого, вроде шлема Магнето, персонаж должен применить к этой способности черту Опора на Технику.","page":128},{"name":"Поразительный 2","en":"","flavor":"Разум персонажа защищён словно сталью.","group":"Основные","prereq":"Поразительный 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Любой множитель урона на атаки против Фокуса персонажа уменьшен на 2.","page":128},{"name":"Поразительный 3","en":"","flavor":"Разум персонажа защищён словно танк.","group":"Основные","prereq":"Поразительный 2, Ранг 4","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Любой множитель урона на атаки против Фокуса персонажа уменьшен на 3.","page":128},{"name":"Поразительный 4","en":"","flavor":"Разум персонажа защищён словно боевой корабль.","group":"Основные","prereq":"Поразительный 3, Ранг 6","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Любой множитель урона на атаки против Фокуса персонажа уменьшен на 4.","page":128},{"name":"Невозмутимое Спокойствие","en":"Unflappable Poise","flavor":"Персонаж может увернуться от большинства атак ближнего боя.","group":"Боевые Искусства","prereq":"Оборонительная Стойка, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Любая атака силы против персонажа идёт с помехой. Пока персонаж в Оборонительной Стойке, у таких атак двойная помеха.","page":128},{"name":"Безжалостно Крушить","en":"Unrelenting Smash","flavor":"Персонаж крушит всё в досягаемости.","group":"Супер-Сила","prereq":"Сотрясающий Землю Топот, Мощь 2, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенное","range":"","cost":"15 Фокуса","effect":"Персонаж совершает проверку Силы против защиты Силы каждого врага в досягаемости. Каждый враг, по которому атака успешна, получает половину обычного урона. При Фантастическом Успехе, эти враги получают весь урон и падают. Персонаж может потратить ещё 15 фокуса, чтобы повторить действие — перед чем он может продвинуться на половину своей скорости от того, что осталось от обычного действия передвижения. Персонаж может продолжать это делать, пока у него не закончится передвижение или Фокус. На каждую цель эта способность этого персонажа может подействовать только раз за раунд.","page":128},{"name":"Неостановимое Наступление","en":"Unstoppable Assault","flavor":"Персонаж пробивает себе путь сквозь врагов.","group":"Оружие Ближнего Боя","prereq":"Яростные Атаки, Сфокусированный Гнев, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенное","range":"","cost":"15 Фокуса","effect":"Персонаж совершает проверку Силы против защиты Силы каждого врага в досягаемости. Каждый враг, по которому атака успешна, получает половину обычного урона. При Фантастическом Успехе, эти враги получают весь урон и специальный эффект оружия. Персонаж может потратить ещё 15 фокуса, чтобы повторить действие — перед чем он может продвинуться на половину своей скорости от того, что осталось от обычного действия передвижения. Персонаж может продолжать это делать, пока у него не закончится передвижение или Фокус. На каждую цель эта способность этого персонажа может подействовать только раз за раунд.","page":129},{"name":"Неприкасаемое Положение","en":"Untouchable Position","flavor":"Врагам персонажа сложно напасть на него группой.","group":"Боевые Искусства","prereq":"Техника Контратаки, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Если персонажа атаковали, все другие атаки Силы будут с помехой до начала следующего хода персонажа.","page":129},{"name":"Пары Валторра","en":"Vapors of Valtorr","flavor":"Персонаж призывает тёмный туман, который может атаковать тех, кто внутри.","group":"Магия","prereq":"Чародей, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж создаёт тёмный туман на 25 пространств за СПОСОБНОСТИ ранг вокруг себя, который ограничивает зону видимости до 5 пространств. В следующие ходы, персонаж может заставить туман атаковать одну цель за раз. Персонаж совершает проверку Эго против защиты Бдительности цели. При успехе, атака наносит обычный урон. При Фантастическом Успехе, цели наносится двойной урон и она ослепляется на ход.","page":129},{"name":"Ядовитое Жало","en":"Venom Blast","flavor":"Персонаж атакует биоэлектрическим разрядом.","group":"Паучьи Способности","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"5 пространств","cost":"","effect":"Персонаж совершает атаку ловкости. При успехе, наносит обычный урон. При Фантастическом Успехе, атака наносит двойной урон, и если цель действительно получает хотя бы 1 урон, она также оглушается на раунд.","page":129},{"name":"Жестокая Атака","en":"Vicious Attack","flavor":"Персонаж наносит рубящий удар.","group":"Оружие Ближнего Боя","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж совершает атаку Силы. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе, цель получает двойной урон и специальный эффект оружия.","page":129},{"name":"Ползание по Стенам","en":"Wallcrawling","flavor":"Персонаж может карабкаться как паук.","group":"Паучьи Способности","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может карабкаться со скоростью равной скорости Бега. При обычных условиях, он никогда не теряет хватку, независимо от угла поверхности.","page":129},{"name":"Оружие Пылает","en":"Weapons Blazing","flavor":"Персонаж стреляет в двух врагов одновременно.","group":"Оружие Дальнего Боя","prereq":"Быстрая Стрельба","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж разделяет атаку, чтобы сделать две атаки ловкости по разным целям (Или они могут единожды атаковать одну цель.). Сделайте одну проверку ловкости и сравните с защитами ловкости целей. При успехе, выбранные цели получают по половине этого урона. При успехе, выбранные цели получают половину урона. При Фантастическом Успехе, выбранные цели получают полный урон, и персонаж может совершить дополнительную атаку этой способностью против любой доступной цели, с таким же эффектом.","page":130},{"name":"Погода Прохладная","en":"Weather Chill","flavor":"Персонаж всё охлаждает.","group":"Контроль Погоды","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Температура в области примерно мили падает до -18 градусов Цельсия.","page":130},{"name":"Погода Тёплая","en":"Weather Warm","flavor":"Персонаж всё нагревает.","group":"Контроль Погоды","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Температура в области примерно мили повышается до 38 градусов Цельсия.","page":130},{"name":"Опутывание Паутиной","en":"Webcasting","flavor":"Персонаж может связать цель паутиной.","group":"Паучьи Способности","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств","cost":"","effect":"Персонаж совершает атаку Ловкости по цели. При успехе, паутина парализует врага. При Фантастическом Успехе, цель прижата. Чтобы вырваться из паутины, цель должна совершить проверку Силы, со сложностью 20.","page":130},{"name":"Планирование на Паутине","en":"Webgliding","flavor":"Персонаж может планировать по воздуху на своей паутине.","group":"Паучьи Способности","prereq":"Опутывание Паутиной, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает возможность Планировать в качестве действия движения, со скоростью равной двойной Скорости Бега.","page":130},{"name":"Захват Паутиной","en":"Webgrabbing","flavor":"Персонаж связывает врага паутиной.","group":"Паучьи Способности","prereq":"Опутывание Паутиной, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств","cost":"5 Фокуса","effect":"Персонаж совершает атаку Ловкости по врагу. При успехе, персонаж хватает врага паутиной. При Фантастическом Успехе, цель прижата. Чтобы вырваться из паутины, цель должна совершить проверку Силы, со сложностью 20.","page":130},{"name":"Полёт на Паутине","en":"Webslinging","flavor":"Персонаж может раскачиваться по городу на своей паутине.","group":"Паучьи Способности","prereq":"Опутывание Паутиной, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает возможность Раскачиваться в качестве действия движения, со скоростью равной тройной скорости бега. Досягаемость Раскачки равна Скорости Раскачки.","page":130},{"name":"Паутинная Ловушка","en":"Webtrapping","flavor":"Персонаж создаёт гигантскую сеть паутины, чтобы поймать тех, кто внутри.","group":"Паучьи Способности","prereq":"Опутывание Паутиной, Ранг 3","action":"Обычное","trigger":"","duration":"15 минут на ранг персонажа","range":"","cost":"10 Фокуса","effect":"Персонаж заполняет до пяти пространств липкой паутиной, и задействованные пространства считаются труднопроходимой местностью. Любое существо, что начинает ход в задействованной области, или в неё движется, должно совершить проверку Ловкости, со сложностью 20, или будет парализовано паутиной. Чтобы вырваться из паутины, цель должна совершить проверку Силы, со сложностью 20.","page":130},{"name":"Вихревое Безумие","en":"Whirling Frenzy","flavor":"Персонаж наступает на врага с торнадо вращающихся атак.","group":"Оружие Ближнего Боя","prereq":"Быстрые Атаки, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает проверку Силы и сравнивает с защитой Силы каждого врага в досягаемости. Каждый враг, по которому атака успешна, получает половину обычного урона. При Фантастическом Успехе, эти враги получают весь урон и специальный эффект оружия.","page":130},{"name":"Ветра Ватумбы","en":"Winds of Watoomb","flavor":"Персонаж призывает кружащиеся ветра для защиты.","group":"Магия","prereq":"Чародей, Ранг 2","action":"Обычное или Реакция","trigger":"Урон проходит сквозь Щит Серафима.","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж призывает вращающиеся ветра, которые контролирует. Всё движение врагов, на расстоянии 10 пространств за ранг персонажа, уменьшается вдвое. Персонаж также может использовать это заклинание, чтобы развеять дым или туман. Если источник подобного — способность, персонаж совершает проверку Эго с преимуществом против защиты Эго использовавшего эту способность. При успехе, способность использовавшего прекращается. При Фантастическом Успехе, использовавший падает. Дополнительно, Ветра Ватумбы можно использовать, чтобы зарядить Щит Серафима. Персонаж может перенаправить весь урон выше Щита Серафима на свой фокус, чтобы сохранить защиту.","page":130},{"name":"Мудрый","en":"Wisdom","flavor":"У персонажа есть не только мозги, но и понимание, когда ими пользоваться.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может использовать защиту Эго против атак Логики в том числе. СПОСОБНОСТИ","page":131},{"name":"Остряк","en":"Wisecracker","flavor":"Персонаж выводит врага своим остроумием.","group":"Основные","prereq":"Никаких","action":"Реакция","trigger":"Персонаж успешно совершает атаку по врагу в радиусе слышимости, или враг в радиусе слышимости проваливает атаку.","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж отпускает шутку о неудаче врага и совершает атаку Эго. При успехе, она наносит обычный урон Фокусу. При Фантастическом Успехе, урон удваивается, и цель оглушается на один раунд.","page":131}],"origins":[{"name":"Инопланетянин","en":"Alien","page":52,"desc":"Персонаж не человек и, вероятно, не с Земли, как минимум не с Земли 616. В Marvel Мультивселенной обитают самые разнообразные инопланетные расы. Самые распространённые — Кри, Скруллы, и так далее — имеют отдельное происхождение. Если персонаж под них не подпадает — применяется это.","examples":"Дьявольский Динозавр, Гамора, Грут, Енот Ракета","tags":"Инопланетное Наследие, Экстремальная Внешность (обычно)","traits":"","powers":"","suggestedOccupation":"Чужак","restriction":""},{"name":"Инопланетянин: Кри","en":"Kree","page":52,"desc":"Персонаж относится к Кри, гуманоидной расе с планеты Хала, что сформировали межзвёздную Империю Кри в области космоса, известной как Большое Магелланово Облако. Они похожи на людей, но сильнее и прочнее. У многих из них голубая кожа, но также достаточно представителей с розовой кожей. Воздух на Хала содержит намного больше азота, так что выращенным там Кри довольно тяжело дышать земным воздухом.","examples":"Адам Икс, Детбёрд, Маджестрикс Лиландра Нерамани.","tags":"Инопланетное Наследие, Экстремальная Внешность","traits":"Улучшенное Телосложение","powers":"","suggestedOccupation":"Чужак","restriction":""},{"name":"Инопланетянин: Скрулл","en":"Skrull","page":52,"desc":"Персонаж относится к Скруллам, рептильной гуманоидной расе, что умеют менять форму тела. Они сформировали межзОвёчзкдниу юпоИмкпаезриаютеСлкреулйл охва. рВаексттеестрвеинснтойикфо. рме, у них зелёная кожа, красные или зелёные глаза, заострённые уши и морщинистые подбородки. Они пришли с планеты Скруллос в галактике Андромеда. Первоначальные Скруллы не могли менять форму, но Целестиалы экспериментировали над ними, чтобы создать Вечных Скруллов и Девиантных Скруллов, примерно как с людьми на Земле. Девиантные Скруллы в итоге стали доминирующим видом, что привело к вымиранию первоначальных.","examples":"Халклинг (Наполовину Скрулл, наполовину Кри.), Лия, Супер-Скрулл (Кл'рт)","tags":"Инопланетное Наследие, Экстремальная Внешность (в своей естественной форме)","traits":"","powers":"Маскировка, Увеличенная Досягаемость, Гибкие Кости, Трансформация, Выскользнуть","suggestedOccupation":"Чужак","restriction":""},{"name":"Атлант","en":"Atlantean","page":53,"desc":"Персонаж относится к Homo Mermanus, подвид человеческой расы. Атланты дышат в воде с помощью жабр на шее, и дышать воздухом они могут не больше 10 минут. Если они живут в Атлантическом Океане, скорее всего, у них голубая кожа и они из Атлантиды. Если они пришли с Тихого Океана, скорее всего, у них зелёная кожа и они живут в Лемурии.","examples":"Аттума, Подводник (Нэмор), Нэмора, Крэнг.","tags":"Иначе Дышит, Улучшенное Телосложение","traits":"","powers":"Обострённые Чувства, Быстрое Плавание","suggestedOccupation":"Чужак","restriction":""},{"name":"Девиант","en":"Deviant","page":53,"desc":"Персонаж относится к Homo descendus, подвиду человеческой расы, созданной Целестиалами. Они разбрелись по Земле, но в основном живут в подземных городах под Тихим Океаном, рядом с Лемурией. Всего сотня Девиантов была создана первоначально, но за тысячелетия родилось куда больше. Силы, формы, размеры, цвет и кожа у них сильно варьируется. Каждый рождён с уникальной физической мутацией, и у них есть скрытый навык развивать способности, как мутанты. Вечные обязаны убивать Девиантов, из принципа \"Исправления Чрезмерных Отклонений\".","examples":"Брат Тод, Каркас, Кро","tags":"Экстремальная внешность, Разыскиваемый","traits":"","powers":"","suggestedOccupation":"Чужак","restriction":""},{"name":"Вечный","en":"Eternal","page":53,"desc":"Персонаж относится к Homo Immortalis, подвиду человеческой расы, созданной Целестиалами. Они разбрелись по Земле, но их база находится в городе Олимпия, высоко в горах Греции и вложена в эхо-измерение. Некоторые живут на Титане (луне Сатурна). Вечными движут 3 принципа: ► Защищать Целестиалов ► Защищать Машину (Разумный И.И., глубоко связанный с Землёй.) ► Исправление чрезмерных отклонений Всего сотня Вечных была создана, и только двое родились с тех пор: Танос и Эрос. Персонаж или один из менее известных среди сотни, или новый Вечный, что пришёл к жизни по необычным причинам. Несмотря на то, что ритуал, обычно, инициирует лидер Вечных, вечных можно назвать частью коллективного разума, известного как Уни-Ум.","examples":"Икарис, Серси, Спрайт, Танос, Тена","tags":"Вечно Бессмертный, Мад Ви'Ри","traits":"","powers":"","suggestedOccupation":"Чужак Очки показателей характеристик. ПРЕДЫСТОРИИ","restriction":""},{"name":"Высокие Технологии","en":"High Tech","page":53,"desc":"Способности персонажа берутся из высокотехнологичных устройств, что сильно опережают современную инженерию. Может проявляться в разных формах.","examples":"Доктор Осьминог (Отто Октавиус), Наруч (Джозеф Грин), Мистерио (Квентин Бек), Трапстер","tags":"","traits":"Опора на Технику","powers":"","suggestedOccupation":"","restriction":""},{"name":"Высокие Технологии: Андроид","en":"Android","page":53,"desc":"Персонаж создан искусственно. Его тело (Когда оно есть) сделано из пластика, металла и микросхем, нежели из плоти и крови. Способности исходят из технологий, встроенных в искусственное тело.","examples":"Человек-Факел (Джим Хэммонд), Джокаста, Человек-Машина, Вижн.","tags":"И.И., Экстремальная Внешность (обычно)","traits":"Опора на технику","powers":"","suggestedOccupation":"Чужак","restriction":""},{"name":"Высокие Технологии: Боевой Костюм","en":"Battle Suit","page":53,"desc":"Персонаж носит высокотехнологичный костюм, который даёт ему способности. Когда боевой костюм снят, персонаж не обладает способностями, которые он даёт. Без костюма, чаще всего, они совершенно обычные. Большинство персонажей с этим происхождением обладают тегом Экстремальная Внешность, когда они в боевом костюме.","examples":"Железный Человек (Тони Старк), Железное Сердце, Воитель.","tags":"Экстремальная Внешность (Обычно для боевого костюма.)","traits":"Опора на Технику","powers":"","suggestedOccupation":"","restriction":""},{"name":"Высокие Технологии: Кибернетика","en":"Cybernetics","page":53,"desc":"В персонажа хирургически вживлены высокотехнологичные импланты, которые дают ему способности. Их нельзя убрать без огромной осторожности или боли. Если импланты очевидны, у персонажа будет тег Экстремальная Внешность. В случае, если импланты персонажа скрыты внутри тела (Как скелет Росомахи с адамантием) и видны только при использовании (Когда Росомаха выпускает когти) — то тег будет применяться тогда.","examples":"Детлок (Все), Саблезубый, Зимний Солдат, Росомаха (Логан)","tags":"Экстремальная Внешность (Обычно).","traits":"Опора на Технику","powers":"","suggestedOccupation":"","restriction":""},{"name":"Высокие Технологии: Частицы Пима","en":"Pym Particles","page":53,"desc":"Персонаж использует частицы Пима (Названные в честь изобретателя, Генри Пима), чтобы сильно расти или сжиматься в размере. После долгого использования частиц Пима, многие начинают самостоятельно генерировать эти частицы, без необходимости в устройствах. Им всё ещё могут пригодиться лишние частицы Пима, чтобы достигать экстремально больших или маленьких размеров.","examples":"Человек-Муравей (Скотт Лэнг), Великан (Раз Малхотра), Оса (Джанет Ван Дайн)","tags":"","traits":"Опора на Технику (Поначалу)","powers":"Рост 1 и/или Сжатие 1 (как минимум).","suggestedOccupation":"","restriction":""},{"name":"Нелюдь","en":"Inhuman","page":54,"desc":"Персонаж относится к Homo Sapiens Inhumanus, подвиду человеческой расы, генетически спроектированным Кри. Тысячелетие они были изолированы от мира, но недавно объявились, под предводительством Чёрного Грома. Все Нелюди обладают скрытым геном, что активируется туманом Терригена. Взрыв Терригеновой бомбы распространил туман по всей планете, раскрыв, что у многих людей (Включая Камалу Хан) были гены Нелюдей. Позже, Чёрный Гром был вынужден убить Нелюдей, оставив в живых только немногих из королевской семьи. Персонаж, один из немногих Нелюдей, кто выжил.","examples":"Чёрный Гром, Кристал, Карнак, Локджо, Медуза, Мисс Марвел (Камала Хан)","tags":"Гены Нелюдей","traits":"","powers":"","suggestedOccupation":"","restriction":""},{"name":"Магия","en":"Magic","page":54,"desc":"Способности персонажа возникли сверхъестественно. Есть разные дисциплины магии, каждая со своим учением.","examples":"Клеа, Доктор Вуду (Джерико Драмм), Чаровница","tags":"Сверхъестественный","traits":"","powers":"","suggestedOccupation":"","restriction":""},{"name":"Магия: Хаотическая","en":"Chaos Magic","page":54,"desc":"Персонаж способен использовать магию Хаоса, что позволяет ему управлять реальностью по желанию. Она идёт от древнего бога Хтона.","examples":"Моргана Ле Фей, Алая Ведьма, Виккан","tags":"Хаотичный, Сверхъестественный","traits":"","powers":"","suggestedOccupation":"","restriction":""},{"name":"Магия: Демоническая","en":"Demonic","page":54,"desc":"Персонаж связан с (Или проклят ими) силами Ада. Они могут быть воплощением одного из Девяти Кругов Ада, или способности могут идти из Адского источника.","examples":"Беласко, Блэкхарт, Дэймон Хэллстром, Дормамму","tags":"Проклят, Сверхъестественный","traits":"","powers":"","suggestedOccupation":"","restriction":""},{"name":"Магия: Чародейская","en":"Sorcery","page":54,"desc":"Способности персонажа возникли из обучения и практик чародейства.","examples":"Агата Харкнесс, Древний (Яо), Доктор Стрэндж, Магика, Вонг","tags":"Чародей, Сверхъестественный","traits":"","powers":"","suggestedOccupation":"","restriction":""},{"name":"Монструозный","en":"Monstrous","page":54,"desc":"Персонаж — монстр какого-то вида. У него может быть человеческая форма — или человеком он когда-то был, но способности идут от его монструозности.","examples":"Каллен Бладстоун, Живая Мумия, Леший","tags":"","traits":"Монстр","powers":"","suggestedOccupation":"","restriction":""},{"name":"Монструозный: Вампир","en":"Vampire","page":54,"desc":"Персонаж был когда-то живым, но его обратил вампир, после чего персонаж восстал из мёртвых и тоже стал вампиром. Он может передать эту магическую болезнь жертвам, по желанию. Когда персонаж становится вампиром, он повышает ранг и получает указанные здесь теги, черты и способности. Он не получает дополнительные способности и черты от этого повышения ранга, но получает 5 очков характеристик и добавляет +1 к множителю урона. Если у него есть тег Героический, он также добавляет 1 к Карме.","examples":"Кровавый Барон, Дракула, Блэйд (Полувампир)","tags":"Альтернативная Форма: Летучая Мышь/Туман/Волк, Нежить, Не отражается","traits":"Непереносимость: Чеснок/Святые Символы (Включая Святую Воду)/Солнечный свет, Кровожадный, Монстр, Слабость: Серебро/Дерево","powers":"Общение с Животными: Летучие мыши/Грызуны, Команда, Исцеляющий Фактор, Кража Жизни, Мощь 1, Прочность 2, Телепатическая Связь","suggestedOccupation":"","restriction":"Если у персонажа нет другого происхождения, он не может выбрать другие способности"},{"name":"Монструозный: Оборотень","en":"Werewolf","page":54,"desc":"Персонаж заражён ликантропией, магической болезнью, что заставляет его принимать форму волка в течение трёх ночей полной луны. Он может передать эту магическую болезнь жертвам на выбор из тех, кто пережил его нападение. Когда персонаж становится оборотнем, он получает теги Лунное Превращение и Альтернативная Форма. Когда персонаж в форме оборотня, он повышает ранг и получает перечисленные теги, черты и способности. Он не получает дополнительные способности или черты от этого повышения ранга, но получает 5 очков характеристик и добавляет +1 к множителю урона. Если у него есть тег Героический, он также добавляет 1 к Карме. Когда персонаж возвращается в человеческую форму, он теряет все преимущества формы оборотня. Персонаж может добровольно менять формы — за исключением трёх ночей полной луны. В эти ночи, когда луна над горизонтом, персонаж должен превратиться в оборотня, и движет им его животная натура. Они вынуждены Очки показателей характеристик. охотиться и атаковать людей или существ, которых встретят, независимо от того, друзья это или враги.","examples":"Ночной Оборотень (Джек Рассел), Ночной Оборотень (Джейк Гомез)","tags":"Альтернативная Форма: Оборотень/Волк, Экстремальная Внешность (в форме оборотня), Лунное Превращение","traits":"Берсерк, Монстр, Слабость: Серебро","powers":"Уворотливость, Исцеляющий Фактор, Обострённые чувства, Мощь 1, Прочность 2","suggestedOccupation":"","restriction":"Если у персонажа нет другого происхождения, он не может выбрать другие способности"},{"name":"Мутант","en":"Mutant","page":54,"desc":"Способности персонажа идут из того, что они относятся к подвиду Homo Superior. У него скрытый Ген Икс, что даёт ему способности, часто он проявляется в подростковом возрасте.","examples":"Циклоп, Джин Грей, Шторм, Росомаха (Логан), Росомаха (Лора Кинни)","tags":"Преследуемый, Кракоанец, Ген Икс ПРЕДЫСТОРИИ","traits":"","powers":"","suggestedOccupation":"","restriction":""},{"name":"Мифический","en":"Mythic","page":56,"desc":"Персонаж — существо или личность из мифов и легенд. Даже если он может выглядеть, как человек — он нечто другое.","examples":"Анжела (Альдриф Одинсдоттир), Феи, Малекит","tags":"Сверхъестественный","traits":"","powers":"","suggestedOccupation":"Чужак","restriction":""},{"name":"Мифический: Асгардец","en":"Asgardian","page":56,"desc":"Персонаж относится к народу Асгардцев, воплощений нордических богов. Они зовут свой дом Асгардом. Персонаж может быть одним из богов, чьи имена увековечены в истории, или же кем-то менее известным из богов Асгарда. Также ему стоит выбрать, чего конкретно он бог.","examples":"Хела, Хеймдаль, Локи, Сиф, Тор (Одинсон)","tags":"Сверхъестественный, Почитаемый","traits":"Божественное наследие, Улучшенное Телосложение","powers":"","suggestedOccupation":"","restriction":""},{"name":"Мифический: Олимпиец","en":"Olympian","page":56,"desc":"Персонаж относится к народу Олимпийцев, воплощений богов Древней Греции и Рима. Они зовут свой дом Олимпом. Персонаж может быть одним из богов, чьи имена увековечены в истории, или же кем-то менее известным из богов Олимпа. Также ему стоит выбрать, чего конкретно он бог.","examples":"Арес, Афина, Геркулес, Зевс","tags":"Сверхъестественный, Почитаемый","traits":"Божественное наследие, Улучшенное Телосложение","powers":"","suggestedOccupation":"","restriction":""},{"name":"Специальная Подготовка","en":"Special Training","page":56,"desc":"Способности персонажа возникли из долгих часов практики. Его сосредоточенное обучение дало ему навыки, что изумляют большинство людей.","examples":"Соколиный Глаз (Клинт Бартон), Соколиный Глаз (Кейт Бишоп), Ник Фьюри Младший, Шан-Чи","tags":"","traits":"Решительный","powers":"","suggestedOccupation":"","restriction":"Если у персонажа нет другого происхождения, он не может выбрать способности, которые дают ему сверхчеловеческие навыки. Разрешённые группы — это Боевые Искусства, Оружие Ближнего Боя, Оружие Дальнего Боя, Щитоносец и Тактика. Он также может выбрать основные способности, которыми может обладать обычный человек. Посмотрите в Основных способностях, на странице 80."},{"name":"Дух Мщения","en":"Spirit of Vengeance","page":56,"desc":"Персонаж одержим Духом Мщения. Его цель — искать грешников и карать их. Когда персонаж становится одержим Духом Мщения, он получает тег Альтернативная Форма, которую может использовать добровольно в любой момент. Когда персонаж принимает форму Призрачного Гонщика, он получает указанные теги, черты и способности. Когда он возвращается в человеческую форму, он теряет все преимущества формы Призрачного Гонщика.","examples":"Призрачный Гонщик (Джонни Блейз), Призрачный Гонщик (Дэнни Кетч), Призрачный Гонщик (Робби Рейес)","tags":"Альтернативная Форма: Призрачный Гонщик, Проклят, Сверхъестественный","traits":"","powers":"Элементальная Защита 2, Защита от Внешней Среды, Исцеляющий Фактор, Цепи Адского Пламени, Мощь 2, Карающий взор, Овладение Транспортом и Чувство Греха. Персонажу стоит выбрать остальные способности из групп Магия: Демоническая и Контроль Элементов: Адское Пламя.","suggestedOccupation":"","restriction":"Персонаж должен быть минимум 4 ранга. Если у персонажа нет другого происхождения, он не может выбрать другие способности."},{"name":"Симбиот","en":"Symbiote","page":56,"desc":"Персонаж связан с одним из Клинтар, инопланетной расой симбиотов, созданной инопланетным богом Наллом. Большинство этих существ на Земле обладают способностями, похожими на паучьи. Когда персонаж связан с симбиотом, он повышает ранг и получает указанные здесь теги, черты и способности. Полученные способности часто берутся из группы Паучьи способности, но не обязательно. У многих симбиотов есть способность Маскировка. Если симбиот — Веном или один из его отпрысков, Человек-Паук (Питер Паркер) не получает преимуществ от способности Паучье Чутьё, против этого персонажа.","examples":"Карнаж, Веном (Эдди Брок), Визг","tags":"","traits":"Непереносимость: Экстремальный жар/ Экстремальный звук","powers":"Защита от Внешней Среды, Мощь 1","suggestedOccupation":"","restriction":""},{"name":"Неизвестно","en":"Unknown","page":56,"desc":"У персонажа развились способности, но он не совсем уверен, как. Может быть, что игрок или Рассказчик знают, но не сам персонаж, или, возможно, не знают и все остальные. Удивительные вещи творятся в Мультивселенной Marvel постоянно, и классифицировать их все невозможно. Источник этих способностей может раскрыться со временем. Может выясниться, что у персонажа довольно обычный вид происхождения, но также возможно, что он действительно уникальный.","examples":"Девочка-белочка, Таскмастер","tags":"Загадочный","traits":"","powers":"","suggestedOccupation":"","restriction":""},{"name":"Странная Наука","en":"Weird Science","page":56,"desc":"Способности персонажа возникли из научного эксперимента или происшествия, которое трудно — если не невозможно — повторить. Чаще всего, у него был скрытый генетический потенциал для развития способностей, и как-то что-то правильно на него повлияло — что большинство других людей могло и убить. Этот тип персонажей иногда называется Мутировавшими. Разница между Мутантом и Мутировавшим в том, что Очки показателей характеристик. способности мутантов возникли естественно, но для мутировавшего требуется определённое событие, которое могло бы никогда и не произойти. Из этой логики, Нелюди — как раз мутировавшие, но с геном, который определяет это событие: Влияние тумана Терригена.","examples":"Капитан Америка (Стив Роджерс), Сорвиголова (Мэтт Мёрдок), Невидимая Леди, Джессика Джонс, Люк Кейдж, Человек-Паук (Питер Паркер), Человек-Паук (Майлз Моралес)","tags":"","traits":"Странный","powers":"","suggestedOccupation":"","restriction":""},{"name":"Странная Наука: Гамма Мутация","en":"Gamma Mutate","page":56,"desc":"У персонажа случилась генная мутация, что дала ему способности, как только его облучило достаточным количеством гамма радиации, что физически его изменила. Часто это вызывает монструозную внешность и меняет цвет, чаще всего на зелёный, но некоторые становятся красными или даже голубыми. Также, зачастую, персонаж может возвращаться в первоначальную форму.","examples":"Док Самсон, Гарпия (Бетти Бэннер), Халк (Брюс Бэннер), Красный Халк (Таддеус Громовержец Росс)","tags":"Экстремальная Внешность (Обычно в форме гамма мутировавшего), Зелёная Дверь, Иммунитет: Гамма Радиация, Радиоактивный","traits":"Странный","powers":"","suggestedOccupation":"","restriction":""}],"occupations":[{"name":"Искатель Приключений","en":"Adventurer","page":57,"desc":"Персонаж живёт ради приключений и исследований, часто путешествуя по миру, космосу или другим измерениям. Он зарабатывает на жизнь, выполняя опасные задания, находя реликвии или полагаясь на удачу и смекалку.","examples":"Капитан Марвел (Кэрол Дэнверс), Тор, Чёрная Пантера, Стражи Галактики","tags":"—","traits":"Боевая Готовность, Связи: Супергерои (или Чужаки), Бесстрашный"},{"name":"Убийца","en":"Assassin","page":57,"desc":"Персонаж — наёмный убийца. Он может убеждать себя, что это для высшего блага. Он может быть избирателен в клиентах и целях, но суть рода деятельности — в том, чтобы отнимать жизни.","examples":"Аркада, Меченый, Электра, Каратель","tags":"Знаток улиц, Злодейский (обычно)","traits":"Связи: Преступность, Коронная Атака"},{"name":"Преступник","en":"Criminal","page":57,"desc":"Персонаж сделал что-то, что привело к нахождению по другую сторону закона. Может, он провёл какое-то время в тюрьме, может, ушёл безнаказанным. Сам факт, что он нарушил закон, не значит, что он плохой человек, но полицию это редко волнует. Если в данный момент персонажа разыскивает полиция, ему также стоит взять тег Разыскиваемый. Если его ловили, стоит также взять тег Осуждённый.","examples":"Человек-Муравей (Скотт Лэнг), Чёрная Кошка, Гамбит","tags":"Доступ к Чёрному Рынку, Знаток Улиц","traits":"Связи: Преступность ПРЕДЫСТОРИИ."},{"name":"Учитель","en":"Educator","page":57,"desc":"Персонаж учит других. Он может быть школьным учителем, преподавателем колледжа или инструктором по чему-то. Он всеми силами старается доносить до других знания.","examples":"Агата Харкенсс, Синее Чудо, Профессор Икс","tags":"","traits":"Связи: Общественность, Кладезь Знаний, Умеющий Привлечь Внимание"},{"name":"Инженер","en":"Engineer","page":58,"desc":"Персонаж проектирует и создаёт вещи для решения проблем. Иногда он изобретает нечто принципиально новое, но чаще он проводит научные исследования и применяет их в решении реальных задач.","examples":"Призрачный Гонщик (Робби Рейес), Железный Человек (Тони Старк), Хлыст","tags":"Доступ к Лаборатории","traits":"Техник, Изобретатель"},{"name":"Артист","en":"Entertainer","page":58,"desc":"Персонаж развлекает других в качестве работы. Он может быть певцом, танцором, актёром, музыкантом, писателем, режиссёром, спикером или кем-то в этом духе. Он не скромен, как минимум, на работе, и усердно трудится, чтобы получить аудиторию и не потерять.","examples":"Ослепительная, Эхо, Мистерио, Чудо-Человек","tags":"","traits":"Знаменитый, Умеющий Привлечь Внимание, Оратор"},{"name":"Медицинский Работник","en":"Health Care Worker","page":58,"desc":"Персонаж — врач, медперсонал, терапевт или кто-то ещё, чья цель — лечить других. Вероятно, у него есть доступ к офису, где он практикует своё ремесло.","examples":"Док Самсон, Доктор Стрэндж, Ночная Медсестра (Линда Картер), Тор (Джейн Фостер)","tags":"","traits":"Врач, Первая Помощь"},{"name":"Детектив","en":"Investigator","page":58,"desc":"Персонаж обучен разгадывать тайны. Это может быть частный детектив, или он работник официальной законной организации, что может быть полицией Нью-Йорка, ФБР, Щ.И.Т. или даже Корпусом Нова.","examples":"Джессика Джонс, Мисти Найт","tags":"","traits":"Связи: Полиция, Дознаватель, Следователь"},{"name":"Журналист","en":"Journalist","page":58,"desc":"Персонаж работает репортёром или редактором в новостной организации. Может быть как Дэйли Бьюгл, так и TNM (Угрозы и Бедствия). Включает в себя любой тип репортажа, будь то по ТВ, радио, газетам или онлайн.","examples":"Шёлк, Человек-Паук (Питер Паркер), Веном (Эдди Брок)","tags":"","traits":"Аудитория, Связи: Источники, Обозреватель"},{"name":"Законник","en":"Law Enforcer","page":58,"desc":"Персонаж работает в органах правопорядка. Может быть как городским полицейским, так и агентом Щ.И.Т. У него большие полномочия в пределах своей юрисдикции, и он, зачастую, пользуется уважением и за её пределами.","examples":"Ник Фьюри Младший, Человек Факел (Джим Очки показателей характеристик. Хэммонд), Мария Хилл, Фотон (Моника Рамбо)","tags":"Авторитет, Подмога","traits":"Дознаватель, Следователь"},{"name":"Юрист","en":"Lawyer","page":58,"desc":"У персонажа есть юридическое образование, и умение им пользоваться. Он может работать в гигантской и влиятельной юридической компании, или может предлагать услуги самостоятельно.","examples":"Сорвиголова (Мэтт Мёрдок), Фогги Нельсон, Женщина Халк","tags":"","traits":"Делец, Знаток Законов, Оратор"},{"name":"Лидер","en":"Leader","page":58,"desc":"Персонаж управляет городом, регионом, штатом или государством. Он может быть избранным мэром Нью Йорка, или наследовать корону государства.","examples":"Чёрный Гром, Чёрная Пантера (Т'Чалла), Доктор Дум, Подводник (Нэмор), Тор (Одинсон)","tags":"Авторитет, Могущественный","traits":"Умеющий Привлечь Внимание"},{"name":"Военный","en":"Military","page":59,"desc":"Персонаж работает (или работал ранее) в военной организации, и полагается на ту подготовку. Иногда, он может вызвать союзных солдат на помощь. Он мог работать на благо государства, или быть частью наёмной организации. Если он работает там в данный момент, зачастую, свободно временем персонаж распоряжаться не может, и ему следует взять тег Обязанность: Долг Службы.","examples":"Капитан Америка (Стив Роджерс), Капитан Марвел (Кэрол Дэнверс), Воитель, Росомаха (Логан)","tags":"","traits":"Боевая Готовность, Связи: Военные, Бдительный"},{"name":"Чужак","en":"Outsider","page":59,"desc":"Персонаж прибыл с другой планеты, измерения или времени, и не знаком с обычаями этой Земли. У него мог быть другой Род Деятельности в месте, откуда он прибыл, но здесь он неприменим.","examples":"Грут, Енот Ракета, Тор (Одинсон)","tags":"","traits":"Связи: Чужаки, Свежий взгляд, Не-местный"},{"name":"Учёный","en":"Scientist","page":59,"desc":"Персонаж решает проблемы с помощью научных исследований. Часто эти персонажи считаются умнейшими людьми в мире, и другие герои обращаются к ним за помощью.","examples":"Доктор Осьминог (Отто Октавиус), Халк (Брюс Бэннер), Мистер Фантастик, Лунная Девочка","tags":"Доступ к Лаборатории","traits":"Изобретатель, Научная экспертиза"},{"name":"Шпион","en":"Spy","page":59,"desc":"Персонаж — эксперт в области шпионажа. Он работал шпионом на государство или корпорацию, и умеет доставать информацию о людях или организациях.","examples":"Чёрная Вдова (Наташа Романова), Пегги Картер, Зимний Солдат","tags":"Доступ к Чёрному Рынку","traits":"Связи: Шпионаж, Наседающий"},{"name":"Ученик","en":"Student","page":59,"desc":"Персонаж обучается в школе или колледже большую часть времени. Чему он обучается или на чём фокусируется — решение за ним и его местом обучения. Большинство людей начинают с этого Рода Деятельности, но когда они заканчивают обучение, они меняют его на нечто новое. Если это произошло с вашим персонажем, вы можете выбрать новый Род Деятельности, на замену этому.","examples":"Лунная Девочка, Мисс Марвел (Камала Хан), Человек-Паук (Майлз Моралес)","tags":"Наставник, Обязанность: Школа","traits":"Быстро учится"},{"name":"Магнат","en":"Tycoon","page":59,"desc":"Персонаж невероятно обеспеченный и известный. Ни в чём не нуждается, и в любом месте производит фурор. Его приглашают на лучшие вечеринки и пропускают во все VIP зоны.","examples":"Железный Человек (Тони Старк), Железный Торговец (Обадайя Стейн), Мандарин, Санспот, Оса (Джанет Ван Дайн)","tags":"Богатый","traits":"Связи: Знаменитости, Знаменитый Очки показателей характеристик. ПРЕДЫСТОРИИ"}],"traits":[{"name":"Жёсткий","en":"Abrasive","page":59,"desc":"Персонаж умеет убеждать неправильным способом. Это даёт ему помеху при проверках Эго, для убеждения, в просьбах помочь. Это даёт ему преимущество при проверках Эго, в попытках кого-то запугать.","restriction":""},{"name":"Непереносимость","en":"Anathema","page":59,"desc":"Персонаж напрямую страдает при определённых условиях. Он не может добровольно войти в пространство с ними. Если персонаж этого коснётся, он мгновенно получит урон 3 ранга с автоматическим успехом (к6x3). Это будет продолжаться каждый ход, пока он не отделится, не умрёт или не уничтожится. Урон, нанесённый Непереносимостью игнорирует все уменьшения множителей урона и не может быть восполнен Исцеляющим Фактором.","restriction":""},{"name":"Аудитория","en":"Audience","page":59,"desc":"Многие следят за работой персонажа и относятся с уважением, которое он заслуживает. Проверкой Эго, персонаж может убедить аудиторию помочь им с информацией или ресурсами. Рассказчик определяет Сложность проверки Эго, основываясь на просьбе.","restriction":""},{"name":"Боевая Готовность","en":"Battle Ready","page":59,"desc":"Персонаж всегда морально готов к проблемам. Добавьте 30 Фокуса.","restriction":""},{"name":"Привлекательный","en":"Beguiling","page":59,"desc":"У персонажа преимущество при проверках Эго для убеждения кого-то, кому он может нравиться.","restriction":""},{"name":"Берсерк","en":"Berserker","page":59,"desc":"Персонаж часто теряет контроль над гневом. Каждый раз, когда он получает физический урон, персонаж должен совершить проверку Эго со Сложностью, равной нанесённому урону. При провале, он становится берсерком и должен на полной скорости влететь в битву с врагом, который его ранил. Берсерк получает преимущество ко всем атакам Силы и добавляет +2 к защитам Силы, Выносливости и Эго. Однако, у него -2 от защиты Ловкости и он не может использовать оружие дальнего боя. Если персонаж побеждает врага, который его ранил, он должен устремиться атаковать следующего ближайшего врага. В конце хода персонажа, он теряет 5 Фокуса. Когда Фокус уменьшен настолько, что персонаж не может его терять добровольно — или когда в зоне видимости нет врагов — состояние берсерка автоматически заканчивается.","restriction":""},{"name":"Большой","en":"Big","page":60,"desc":"Размер персонажа большой, что отнимает -1 от защит Силы и Ловкости, добавляет +1 к Скорости Бега, и увеличивает Досягаемость до 2. Персонаж всё ещё занимает одно пространство.","restriction":""},{"name":"Кровожадный","en":"Bloodthirsty","page":60,"desc":"Персонажу нравится ранить людей — и даже их убивать. Когда он доводит кого-то до бессознательного состояния, он должен совершить Среднюю (10+ранг) проверку Эго, чтобы не продолжить избивать цель до смерти. Персонаж с этой чертой не может взять тег Героический.","restriction":""},{"name":"Иначе Дышит","en":"Breathe Different","page":60,"desc":"Персонаж не может долго дышать Земным воздухом. Он теряет 1 очко Здоровья за каждую минуту, пока не получат какой-то вид помощи, чтобы дышать правильно.","restriction":""},{"name":"Врач","en":"Clinician","page":60,"desc":"У персонажа преимущество в проверках Логики, для того, чтобы определить, что не так с кем-то, с медицинской точки зрения.","restriction":""},{"name":"Невнимательный","en":"Clueless","page":60,"desc":"Персонажу сложно фокусироваться на одной вещи. У него помеха на любой проверке Бдительности, с целью заметить спрятанные или невидимые вещи. У врагов будет преимущество на проверках Ловкости, при попытках прокрасться мимо него.","restriction":""},{"name":"Боевой Эксперт","en":"Combat Expert","page":60,"desc":"Персонаж умеет держаться лучше многих. У него преимущество на атаках Силы против врагов 1 ранга.","restriction":""},{"name":"Боевые Рефлексы","en":"Combat Reflexes","page":60,"desc":"Персонаж быстро реагирует в бою. Это даёт ему одно дополнительное действие Реакции каждый раунд.","restriction":""},{"name":"Связи","en":"Connections","page":60,"desc":"Персонаж знает кого-то с доступом в определённые области, или знаниями о них. Связью может выступать репортёр, полицейский, политик, гангстер и так далее. Проверкой Эго, персонаж может позвонить и попросить помощи в уликах, информации или ресурсах. Рассказчик определяет Сложность проверки Эго, в зависимости от просьбы. Эту черту можно выбрать несколько раз, используя разные варианты. Например: Знаменитости, Общественность, Преступность, Шпионаж, Военные, Изгои, Полиция, Профессионалы, Супергерои и так далее.","restriction":""},{"name":"Делец","en":"Dealmaker","page":60,"desc":"Персонаж хорош в искусстве переговоров. У него Преимущество на проверках действия, которые связаны с заключением сделок.","restriction":""},{"name":"Решительный","en":"Determination","page":60,"desc":"Персонаж никогда не сдаётся, даже когда ему очень плохо. Когда он деморализован, у него нет помех на действиях, однако, персонаж всё ещё не может держать концентрацию или тратить фокус.","restriction":""},{"name":"Фотографическая Память","en":"Eidetic Memory","page":60,"desc":"Персонаж редко что-то забывает. Если игрок что-то забыл, он может попросить Рассказчика ему напомнить.","restriction":""},{"name":"Выносливый","en":"Enduring Constitution","page":60,"desc":"Персонаж может функционировать до двух суток без сна, и у него преимущество на проверках Выносливости, чтобы побороть усталость или сонливость.","restriction":""},{"name":"Улучшенное Телосложение","en":"Enhanced Physique","page":60,"desc":"Персонаж сильнее обычных людей. Считайте, что он на размер больше в вопросах поднимания, перетаскивания, размахивания и бросков вещей. (С другими факторами не складывается.). Также у него Преимущество на небоевых проверках Силы.","restriction":""},{"name":"Дополнительный Род Деятельности","en":"Extra Occupation","page":60,"desc":"У персонажа весьма богатая жизнь, и попробовать себя в ней успел по-разному. Он может взять ещё один род деятельности.","restriction":""},{"name":"Экстраординарное Происхождение","en":"Extraordinary Origin","page":60,"desc":"У персонажа дополнительное происхождение. Эту черту можно выбрать несколько раз, но каждый нужно обсудить с Рассказчиком. Убедитесь, что происхождения имеют смысл в сочетании.","restriction":""},{"name":"Знаменитый","en":"Famous","page":60,"desc":"Персонаж широко известен — по крайней мере, среди определённых групп или населения. Он может быть любим многими, или ненавидим, но в любом случае, он знаменит. У персонажа преимущество в проверках Эго при убеждении кого-Оточ, кктио потоноксаизтсаяткенлемеуйх охраошроа. кИтпеомреихаств ипрко.верках Эго при убеждении кого-то, кто относится к нему плохо. Если у персонажа есть Тайна Личности, эта черта работает только с одним его воплощением. Впрочем, черту можно взять несколько раз для разных личностей.","restriction":""},{"name":"Бесстрашный","en":"Fearless","page":60,"desc":"Персонаж невероятно храбрый. У него преимущество в любой проверке, на преодоление страха.","restriction":""},{"name":"Первая Помощь","en":"First Aid","page":60,"desc":"Персонаж умеет оказывать первую помощь. У него преимущество в проверках Логики при попытках остановить кровотечение.","restriction":""},{"name":"Кладезь Знаний","en":"Font of Information","page":60,"desc":"У персонажа преимущество в проверках Логики, связанных со знаниями.","restriction":""},{"name":"Акробат","en":"Free Running","page":60,"desc":"У персонажа преимущество в проверках Ловкости на акробатические трюки в действие движения. (Fresh Eyes) У персонажа свой способ разбираться с делами. Зачастую, он кажется странным окружающим, но также это может принести новую перспективу в решении проблем. У него преимущество в проверках Логики, когда он сталкивается с чем-то впервые.","restriction":""},{"name":"Техник","en":"Gearhead","page":61,"desc":"Персонаж умеет обращаться с механизмами. У него преимущество в проверках Логики, чтобы понять принцип работы машины.","restriction":""},{"name":"Болтливый","en":"Glibness","page":61,"desc":"Персонаж может завязать диалог с любым в любое время, и даже часто убеждает его помочь. У персонажа преимущество в проверках Эго на убеждение кого-то, с кем он разговаривает впервые. Божественное","restriction":""},{"name":"Наследие","en":"God Heritage","page":61,"desc":"Персонаж, или по крайней мере один из его предков — бог. Выберите, бог чего конкретно. Ему не обязательно быть богом чего-то известного. Вообще, он может быть богом чего-то совершенно нового. Однако, он не может быть богом чего-то, что уже занято кем-то из его пантеона. Другие боги часто ревнивы в вопросах своей области и не любят подобное соперничество. У персонажа Преимущество, когда он разбирается с чем-то, чего он бог.","restriction":"Эту черту может выбрать только персонаж с Мифическим происхождением, который является частью конкретного пантеона, вроде Асгардского или Олимпийского."},{"name":"Доверчивый","en":"Gullible","page":61,"desc":"Персонажа легко одурачить. У обманывающих его персонажей преимущество в проверках Эго для убеждения в чём-то.","restriction":""},{"name":"Честный","en":"Honest","page":61,"desc":"Персонаж — отвратительный лжец. У него помеха каждый раз, когда он совершает проверку Эго, включающую в себя ложь. Однако, у него преимущество в любой дружеской проверке Эго (убеждение), когда говорит правду.","restriction":""},{"name":"Дознаватель","en":"Interrogation","page":62,"desc":"Персонаж знает, как правильно задавать правильные вопросы. У него преимущество в проверках Эго или Логики, когда он допрашивает.","restriction":""},{"name":"Изобретатель","en":"Inventor","page":62,"desc":"Персонаж хорошо находит решения налету. У него преимущество в проверках Логики при создании или починке вещей.","restriction":""},{"name":"Следователь","en":"Investigation","page":62,"desc":"Персонаж — превосходный следователь. У него преимущество в проверках Бдительности, чтобы искать улики, и в Логике, чтобы их правильно понимать. Если в этот момент у него есть доступ к криминалистической лаборатории, у него будет второе преимущество.","restriction":""},{"name":"Железная Воля","en":"Iron Will","page":62,"desc":"У врагов помеха на попытках контролировать разум персонажа, или повлиять на его поведение. Также, у персонажа преимущество в проверках при попытках вырваться из контроля разума или другого влияния.","restriction":""},{"name":"Знаток Законов","en":"Legal Eagle","page":62,"desc":"Персонаж знает законы родины и может просвещать других. У персонажа преимущество в проверках Логики, когда он разбирается с законами.","restriction":""},{"name":"Наседающий","en":"Leverage","page":62,"desc":"Персонаж хорошо узнаёт, чего кто-то хочет, и использует это против него. У персонажа преимущество в проверках Логики, при изучении чьих-то дел, и преимущество в проверках Эго, на убеждение тех, кого изучил.","restriction":""},{"name":"Одиночка","en":"Loner","page":62,"desc":"Персонаж не ладит с другими. Он не может получить преимущество от помощи кого-то вне команды.","restriction":""},{"name":"Монстр","en":"Monster","page":62,"desc":"Персонаж — монстр, зачастую, из легенд. У него преимущество при запугивании.","restriction":""},{"name":"Не в Форме","en":"Out of Shape","page":62,"desc":"Персонаж в слабой физической форме. Он считается на размер меньше при попытках перенести, размахивать или бросать вещи.","restriction":""},{"name":"Пилот","en":"Piloting","page":62,"desc":"Персонаж умеет управлять транспортом любого вида. У него преимущество на проверках Ловкости при управлении транспортом во время действия движения. Это относится к машинам, лодкам, самолётам и так далее.","restriction":""},{"name":"Умеющий Привлечь Внимание","en":"Presence","page":62,"desc":"Персонаж знает, как призвать к вниманию, или его потребовать. У него преимущество в проверках Эго, что подразумевают обращение внимания на персонажа, или добровольную помощь персонажу.","restriction":""},{"name":"Оратор","en":"Public Speaking","page":62,"desc":"Персонаж умеет получать внимание толпы, будь то политические сборы, перед судьёй или в классе. У него преимущество на проверках Эго при попытках убедить группу.","restriction":""},{"name":"Обозреватель","en":"Pundit","page":62,"desc":"Персонаж умеет создавать новости и преподносить в таком контексте, чтобы развивать из них историю. У него преимущество на бросках Эго или Логики, когда он высказывает своё мнение в медиа.","restriction":""},{"name":"Быстро Учится","en":"Quick Learner","page":62,"desc":"Если персонаж проваливает проверку действия, у него будет преимущество на проверке в следующий ход, если он попробует совершить это же действие.","restriction":""},{"name":"Научная Экспертиза","en":"Scientific Expertise","page":62,"desc":"У персонажа продвинутая научная подготовка. При научных исследованиях, на проверках Логики у него будет преимущество. Если в этот момент у него есть доступ к подходящей лаборатории, у него будет второе преимущество.","restriction":""},{"name":"Коронная Атака","en":"Signature Attack","page":62,"desc":"Персонаж известен тем, что предпочитает конкретный вид оружия или атакующую способность. При таких атаках, у него преимущество. Эту черту можно взять больше раза, но каждый раз она должна применяться к разному типу оружия или атакующей способности.","restriction":""},{"name":"Бдительный","en":"Situational Awareness","page":62,"desc":"Персонаж обучен держать ухо востро. У него преимущество при проверках инициативы.","restriction":""},{"name":"Скептик","en":"Skeptical","page":62,"desc":"Персонажа сложно обмануть. У людей, которые им врут — помеха на проверках Эго в попытках убедить персонажа в чём-то.","restriction":""},{"name":"Небольшой","en":"Small","page":62,"desc":"Размер персонажа небольшой, что прибавляет +1 к защитам Силы и Ловкости и отнимает -1 от Скорости Бега.","restriction":""},{"name":"Пронырливый","en":"Sneaky","page":62,"desc":"У пеОрсчокнаиж апопкреаизмаущтееслтвеойв хапрроавекрткеахриЛсовткиоскт.и, при попытках прокрасться. У врагов помеха в проверках Бдительности, при попытках найти персонажа, когда он прячется или невидим.","restriction":""},{"name":"Не-местный","en":"Stranger","page":62,"desc":"Персонаж не понимает местные обычаи. У него помеха на проверках, при попытках их понять, или при попытках выдать себя за местного.","restriction":""},{"name":"Неожиданная Способность","en":"Surprising Power","page":62,"desc":"Персонаж может выбрать способность, которой, в обычных обстоятельствах, он обладать не должен. Персонаж всё ещё должен соответствовать требованиям способности, но он может игнорировать требования ранга и происхождения. Эту черту можно выбрать несколько раз.","restriction":""},{"name":"Опора на Технику","en":"Tech Reliance","page":62,"desc":"Персонаж в способностях опирается на технологии. Когда он получает урон, что приводит его к бессознательному состоянию, он может вместо этого лишиться своих завязанных на технологиях способностей, и остаться в сознании с 1 очком Здоровья. Если у персонажа есть доступ к запчастям и инструментам для починки, потерянные способности он может вернуть после битвы.","restriction":""},{"name":"Слабость","en":"Weakness","page":63,"desc":"Персонаж уязвим к определённому типу урона или материалу. Любая атака такого типа или с таким материалом — игнорирует все уменьшения множителей урона и урон не может быть восполнен Исцеляющим Фактором.","restriction":""},{"name":"Странный","en":"Weird","page":63,"desc":"В персонаже есть нечто странное (или даже чудесное.). Изза этого, люди реагируют на персонажа ярче, что положительно, что отрицательно. У персонажа преимущество на всех проверках Эго при убеждении того, кому они нравится, и помеха на всех проверках Эго, против людей, которым он не нравится.","restriction":""}],"tags":[{"name":"Амфибия","en":"Amphibious","page":63,"desc":"Персонаж отлично дышит, видит и слышит под водой.","restriction":""},{"name":"Нехватка Слуха","en":"Auditory Issues","page":63,"desc":"Персонаж плохо слышит, что может варьироваться от частичной, до полной глухоты.","restriction":""},{"name":"Авторитет","en":"Authority","page":63,"desc":"У персонажа есть заслуженное признание. Он может быть военным, моряком, охотником за головами, врачом, торговцем оружием, юристом, фармацевтом, полицейским, частным сыщиком, мэром, губернатором и так далее. Тег можно выбрать несколько раз, если уместно.","restriction":""},{"name":"Подмога","en":"Backup","page":63,"desc":"Персонаж — часть организации, вроде полиции, и может вызвать подкрепление в любой момент.","restriction":""},{"name":"Доступ к Чёрному Рынку","en":"Black Market Access","page":63,"desc":"Персонаж знает, как и где можно продать или купить редкие и потенциально незаконные вещи.","restriction":""},{"name":"Хаотический","en":"Chaotic","page":63,"desc":"На персонажа повлиял лорд хаоса Хтон.","restriction":""},{"name":"Осуждённый","en":"Convict","page":64,"desc":"Персонаж был осуждён за преступление, что отражено в его личном деле.","restriction":""},{"name":"Проклят","en":"Cursed","page":64,"desc":"Хочет он того или нет, персонаж связан с Адом. Это может вовлечь его в самые разные коварные замыслы и планы.","restriction":""},{"name":"Нежить","en":"Deceased","page":64,"desc":"Технически, персонаж мёртв. Впрочем, он всё ещё как-то может взаимодействовать с миром. Он может быть вампиром, призраком, зомби, или даже мозгом в банке.","restriction":""},{"name":"Нуждающиеся","en":"Dependents","page":64,"desc":"У персонажа есть дети, престарелые родственники, или другие, кто на него полагается. Бросить этих людей персонаж не может, и должен следить за ними и заботиться на регулярной основе.","restriction":""},{"name":"Враг","en":"Enemy","page":64,"desc":"Есть кто-то, кто поклялся победить персонажа. Враг должен быть минимум ранга персонажа, и одержим победой над ним. Тег можно брать несколько раз, но он должен быть посвящен действительно одержимым врагам.","restriction":""},{"name":"Вечно Бессмертный","en":"Eternally Immortal","page":64,"desc":"Персонаж не стареет, и, в теории, может жить вечно. Если персонаж убит, его можно вернуть к жизни в Камере Активации, находящейся в Исключении — базе Вечных, под Южным Полюсом. Для этого, Камера Активации жертвует жизнь случайного человека на Земле.","restriction":"Только для Вечных."},{"name":"Экстремальная Внешность","en":"Extreme Appearance","page":64,"desc":"Персонаж сильно отличается от обычного жителя (где бы не находился), и не может просто скрыть свою личность. Когда этот тег появляется в происхождении в этой главе, она может дать другую полезную информацию, например, когда Экстремальная Внешность считается обычной.","restriction":""},{"name":"Зелёная Дверь","en":"Green Door","page":64,"desc":"После смерти, персонаж может вернуться к жизни, пройдя через Зелёную Дверь. Портал, который соединяет часть загробной жизни с Землёй. Это делает персонажа практически бессмертным.","restriction":"Только для гамма мутировавших."},{"name":"Убежище","en":"Headquarters","page":64,"desc":"У персонажа есть база, пещера или бункер, где он может восстановиться от ран, починить или приобрести экипировку, работать над изобретениями, и так далее. Место может быть известным или секретным, может быть скромным, как склад, или огромным, как подземный комплекс или небоскрёб в Манхеттене.","restriction":""},{"name":"Героический","en":"Heroic","page":64,"desc":"Персонаж действует героически. Помогают людям в нужде и сильно стараются не убивать — даже тех, кто этого может заслуживать.","restriction":"Персонаж не может быть Злодейским."},{"name":"Преследуемый","en":"Hounded","page":64,"desc":"Персонаж относится к группе, которые подвергаются преследованиям и гонениям просто за то, кто они есть.","restriction":""},{"name":"Разыскиваемый","en":"Hunted","page":64,"desc":"Персонажа разыскивает полиция за преступления, в которых его ошибочно (Или не ошибочно) обвиняют. Если его поймает полиция, его могут арестовать, судить за преступления и, возможно, отправить в тюрьму.","restriction":""},{"name":"Не Отражается","en":"Imageless","page":64,"desc":"Персонаж не отражается в зеркалах и невидим для камер.","restriction":""},{"name":"Иммунитет","en":"Immunity","page":64,"desc":"У персонажа иммунитет к обычным эффектам чего-то. Это можно выбрать несколько раз.","restriction":""},{"name":"Гены Нелюдей","en":"Inhuman Genes","page":64,"desc":"У персонажа есть скрытые гены Нелюдей, что позволяют им развить суперспособности, при влиянии тумана Терригена.","restriction":"Только для Нелюдей."},{"name":"Кракоанец","en":"Krakoan","page":64,"desc":"Как мутант, персонаж автоматически гражданин государства-острова Кракоа, и может свободно в него путешествовать. Более того, если персонажа убили, и Пятёрка — группа могущественных мутантов — могут работать вместе, они могут возродить персонажа в Очки показателей характеристик. идентичном новом теле, с большей частью его воспоминаний. Если его убили в Потустороннем мире, персонажа всё ещё можно воскресить, но он изменится непредсказуемым образом. Как это может повлиять на персонажа — решает Рассказчик.","restriction":"Только для мутантов."},{"name":"Доступ к Лаборатории","en":"Lab Access","page":64,"desc":"У персонажа есть Доступ к Лаборатории, наполненной техническим оборудованием, припасами и инструментами, которые нужны ему для работы. Лаборатория может быть какой угодно, от хорошо оборудованной классной комнаты старшей школы, до криминалистической лаборатории или промышленной площадки.","restriction":""},{"name":"Лингвист","en":"Linguist","page":65,"desc":"Персонаж уверенно владеет языком, помимо родного. Этот тег можно выбирать несколько раз, по одному на каждый язык.","restriction":""},{"name":"Лунное Превращение","en":"Lunar Transformation","page":65,"desc":"В течение трёх ночей, когда луна полная и видна над горизонтом, персонаж должен превратиться в оборотня, и движет им его животная натура. Они вынуждены охотиться и атаковать людей или существ, которых встретят, независимо от того, друзья это или враги.","restriction":"Только для Вечных."},{"name":"Наставник","en":"Mentor","page":65,"desc":"Персонажа знает старшего, к которому можно обратиться за советом, даже если речь идёт о суперспособностях. Этот тег можно выбрать несколько раз.","restriction":""},{"name":"Немой","en":"Mute","page":65,"desc":"Персонаж не может говорить. Если не указано иное, он может использовать другие методы общения.","restriction":""},{"name":"Загадочный","en":"Mysterious","page":65,"desc":"Персонаж до конца не понимает, каким образом и почему он обрёл свои способности. Это может вызывать у него беспокойство и даже может представлять опасность — либо же он просто привыкнет к этому факту.","restriction":""},{"name":"Обязанность","en":"Obligation","page":65,"desc":"Персонаж ответственен за определённых людей, места или организации, которые на него рассчитывают. Этот тег можно выбрать несколько раз, используя разные категории. Например, семью, школу, общество, работу и так далее.","restriction":""},{"name":"Бедный","en":"Poor","page":65,"desc":"У персонажа мало денег и ему тяжело сводить концы с концами. Это может доставлять самые разные неприятности.","restriction":""},{"name":"Могущественный","en":"Powerful","page":65,"desc":"У персонажа есть доступ к богатствам всего своего общества. В большинстве случаев, ему следует быть осторожным в использовании этих ресурсов, чтобы не потерять этот доступ.","restriction":""},{"name":"Публичная Личность","en":"Public Identity","page":65,"desc":"Настоящая личность персонажа известна общественности. Это может упростить для персонажа просьбы семьи, друзей, или даже незнакомцев, о помощи. К сожалению, также становится легче его врагам найти персонажа или даже угрожать его друзьям и семье. Очки показателей характеристик. ПРЕДЫСТОРИИ","restriction":""},{"name":"Радиоактивный","en":"Radioactive","page":65,"desc":"Персонаж постоянно излучает небольшую дозу радиации. Её можно обнаружить счётчиком Гейгера.","restriction":""},{"name":"Богатый","en":"Rich","page":65,"desc":"Персонаж обладает большими деньгами. Если он хочет что-то обычное и легальное, доступное для простых людей — он может просто это купить.","restriction":""},{"name":"Тайна Личности","en":"Secret Identity","page":65,"desc":"Настоящая личность персонажа скрывается от общественности, и персонаж старается это сохранить. Это может помочь уберечь близких от его врагов, но также может вредить отношениям с ними.","restriction":""},{"name":"Коронное Оружие","en":"Signature Weapon","page":65,"desc":"Персонажа известен владением и использованием конкретного типа оружий, вроде лука Соколиного глаза, или сай Электры. Этот тег можно брать больше раза, но каждый раз он должен относиться к другому оружию.","restriction":""},{"name":"Чародей","en":"Sorcerous","page":65,"desc":"Персонаж, посвятивший себя изучению традиционной магии, также известен как Чародей.","restriction":""},{"name":"Знаток Улиц","en":"Streetwise","page":65,"desc":"Персонаж знает, как решаются дела на улице, кто главный в определённых преступных кругах, и как избежать с ними конфликта.","restriction":""},{"name":"Сверхъестественный","en":"Supernatural","page":65,"desc":"Персонаж обладает магическими силами, или основанными на чём-то магическом.","restriction":""},{"name":"Злодейский","en":"Villainous","page":65,"desc":"Персонаж — злодей, не заботится о правах других, включая чужое право на жизнь.","restriction":"Персонаж не может быть героическим."},{"name":"Нехватка Зрения","en":"Vision Issues","page":65,"desc":"Персонаж плохо видит, что может варьироваться от частичной, до полной слепоты. Также может включать в себя дальтонизм, астигматизм, близорукость или дальнозоркость.","restriction":""},{"name":"Почитаемый","en":"Worshipped","page":65,"desc":"Персонаж почитаем другими как бог.","restriction":""},{"name":"Ген Икс","en":"X-Gene","page":65,"desc":"У персонажа есть гены мутанта, которые привели к получению способностей.","restriction":"Только для мутантов."},{"name":"Юный","en":"Young","page":65,"desc":"Персонаж несовершеннолетний. Если у него есть возможность, он должен отчитываться перед родителями или опекунами на постоянной основе.","restriction":""}],"conditions":[{"name":"Горит","en":"Ablaze","page":37,"severity":"damage","summary":"−5 Здоровья в конце каждого хода; тушится действием (Ловкость Сл 10).","desc":"Горящий персонаж теряет 5 единиц Здоровья в конце каждого хода, пока не умрёт или пока состояние не закончится. Можно потушить водой, огнетушителем или перекатыванием по земле (действие и успешная проверка Ловкости против Сл 10)."},{"name":"Кровоточит","en":"Bleeding","page":37,"severity":"damage","summary":"−5 Здоровья в конце хода; останавливается (Логика Сл 10) или любым исцелением.","desc":"Кровоточащий персонаж теряет 5 единиц Здоровья в конце своего хода, пока не умрёт или состояние не закончится. Останавливается действием с успешной проверкой Логики против Сл 10 либо мгновенно при восстановлении хотя бы 1 единицы Здоровья."},{"name":"Ослеплён","en":"Blinded","page":37,"severity":"control","summary":"Скорость ÷2; помеха на проверки со зрением; враги получают преимущество.","desc":"Любая способность с концентрацией, требующая зоны видимости, мгновенно прекращается. Скорость уменьшена вдвое для всех типов передвижения. Помеха на всех проверках действий, требующих зрения; враги получают преимущество на проверках против персонажа, если для защиты нужно зрение."},{"name":"Глухой","en":"Deafened","page":37,"severity":"debuff","summary":"Помеха на проверки, требующие слуха; прерывает звуковую концентрацию.","desc":"Любая способность с концентрацией, требующая слышимости, мгновенно прекращается. Персонаж получает помеху на всех проверках действий, которые требуют слуха."},{"name":"Деморализован","en":"Demoralized","page":37,"severity":"debuff","summary":"Концентрация прерывается; помеха на все действия (наступает при Фокусе ≤ 0).","desc":"Любая способность, на которой сконцентрирован персонаж, мгновенно прекращается. Все действия персонажа проходят с помехой. Автоматически наступает, когда Фокус падает до 0."},{"name":"Схвачен","en":"Grabbed","page":37,"severity":"control","summary":"Нельзя двигаться; атаки против схватившего и схваченного с помехой.","desc":"Ни схвативший, ни схваченный не могут двигаться (если один не может нести другого). Схвативший может отпустить цель в любой момент, схваченный должен вырваться. Атаки против обоих идут с помехой; промах может попасть по второму участнику захвата."},{"name":"Парализован","en":"Paralyzed","page":37,"severity":"critical","summary":"Нельзя двигаться и действовать (Сила/Ловкость); Защита Силы = 10; атаки Силы автопопадают.","desc":"Персонаж не может двигаться и совершать действия, требующие проверок Силы или Ловкости. Защита Силы уменьшается до 10 против атак Ловкости, а атаки Силы автоматически попадают по нему."},{"name":"Прижат","en":"Pinned","page":38,"severity":"control","summary":"Как Схвачен, плюс помеха на Силу/Ловкость и запрет на передвижение.","desc":"Работает как захват (Схвачен), за исключением того, что у прижатого персонажа помехи на проверках Силы и Ловкости, и он не может использовать действие передвижения."},{"name":"Лежит","en":"Prone","page":38,"severity":"debuff","summary":"Помеха на атаки Силы; ближние атаки по цели с преимуществом, дальние с помехой.","desc":"Персонаж лежит на земле. У него помехи на всех атаках Силы. У атакующих его Силой — преимущество, у дальних атак против лежащего — помеха. Чтобы встать, нужно потратить 1 пространство передвижения."},{"name":"Сломлен","en":"Shattered","page":38,"severity":"critical","summary":"Постоянно Оглушён; не может действовать (наступает при Фокусе ≤ −Макс. Фокус).","desc":"Персонаж морально разрушен, постоянно Оглушён и не может совершать никаких действий. Говорить может только простыми короткими предложениями. Требует продолжительного лечения."},{"name":"Оглушён","en":"Stunned","page":38,"severity":"critical","summary":"Концентрация прерывается; нельзя действовать; все атаки по цели с преимуществом.","desc":"Любая способность с концентрацией мгновенно п function safeGet(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function safeSet(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}

function esc(s) {
  return String(s == null ? '' : s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window._toastTimer);
  window._toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

function copyText(text, label) {
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => showToast(label || 'Скопировано в буфер')).catch(() => fallbackCopy(text, label));
  } else {
    fallbackCopy(text, label);
  }
}
function fallbackCopy(text, label) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); showToast(label || 'Скопировано'); } catch (e) { showToast('Не удалось скопировать'); }
  document.body.removeChild(ta);
}

const NAV_HISTORY = [];
function updateBackBtn() {
  const btn = document.getElementById('backNavBtn');
  if (btn) btn.classList.toggle('visible', NAV_HISTORY.length > 0);
}
function pushNavSnapshot() {
  NAV_HISTORY.push({
    route: STATE.route,
    selectedIdx: STATE.selectedIdx,
    mobileDetailOpen: STATE.mobileDetailOpen,
    builderStep: STATE.builder ? STATE.builder.step : 'start',
    sheetTab: STATE.builder ? STATE.builder.sheetTab : 'actions'
  });
  if (NAV_HISTORY.length > 30) NAV_HISTORY.shift();
  updateBackBtn();
}
function goBackNav() {
  if (!NAV_HISTORY.length) return;
  const prev = NAV_HISTORY.pop();
  STATE.route = prev.route;
  STATE.selectedIdx = prev.selectedIdx;
  STATE.mobileDetailOpen = prev.mobileDetailOpen;
  if (STATE.builder && prev.route === 'builder') {
    STATE.builder.step = prev.builderStep || 'sheet';
    STATE.builder.sheetTab = prev.sheetTab || 'actions';
  }
  closeQuickPreview();
  if (typeof closeQuickPreview === 'function') closeQuickPreview();
  if (typeof closeBookmarks === 'function') closeBookmarks();
  closeMobileSidebar();
  updateBackBtn();
  renderSidebar();
  renderContent();
}

function navigate(route, itemIndex, skipHistory) {
  if (!skipHistory && (STATE.route !== route || (typeof itemIndex === 'number' && STATE.selectedIdx !== itemIndex))) {
    pushNavSnapshot();
  }
  STATE.route = route;
  if (typeof itemIndex === 'number') {
    STATE.selectedIdx = itemIndex;
    STATE.mobileDetailOpen = true;
  } else {
    STATE.selectedIdx = 0;
    STATE.mobileDetailOpen = false;
  }
  closeMobileSidebar();
  updateBackBtn();
  renderSidebar();
  renderContent();
}

function jumpToEntity(route, nameQuery) {
  const arr = DB[route];
  if (!arr) return;
  const q = nameQuery.toLowerCase().replace(/\s*\([^)]*\)/g, '').trim();
  let idx = arr.findIndex(x => (x.name || x.term || '').toLowerCase() === q);
  if (idx < 0) idx = arr.findIndex(x => (x.name || x.term || '').toLowerCase().includes(q) || q.includes((x.name || x.term || '').toLowerCase()));
  if (idx >= 0) {
    if (STATE.filters[route]) STATE.filters[route].q = '';
    if (route === 'characters') { STATE.filters.characters.rank = 'all'; STATE.filters.characters.origin = ''; }
    if (route === 'powers') { STATE.filters.powers.group = 'all'; STATE.filters.powers.action = 'all'; }
    navigate(route, idx);
  } else {
    showToast('Запись «' + nameQuery + '» не найдена в каталоге');
  }
}

function isBookmarked(route, idx) {
  return STATE.bookmarks.some(b => b.route === route && b.idx === idx);
}
function toggleBookmark(route, idx, title, sub, ev) {
  if (ev) ev.stopPropagation();
  const pos = STATE.bookmarks.findIndex(b => b.route === route && b.idx === idx);
  if (pos >= 0) {
    STATE.bookmarks.splice(pos, 1);
    showToast('Удалено из закладок');
  } else {
    STATE.bookmarks.unshift({ route, idx, title, sub });
    showToast('Добавлено в закладки');
  }
  safeSet('mmrpg_bookmarks_v2', STATE.bookmarks);
  updateBookmarkUI();
  renderContent();
}
function updateBookmarkUI() {
  document.getElementById('bmCount').textContent = STATE.bookmarks.length;
  const list = document.getElementById('bmList');
  if (!STATE.bookmarks.length) {
    list.innerHTML = '<div class="prose" style="color:#667585;text-align:center;padding:30px 10px;">Пока нет закладок. Нажмите ★ на любом персонаже, способности, черте или теге.</div>';
    return;
  }
  const catNames = { custom_hero:'★ Мой герой', characters:'Персонаж', powers:'Способность', origins:'Происхождение', occupations:'Род деят.', traits:'Черта', tags:'Тег', conditions:'Состояние', glossary:'Глоссарий' };
  list.innerHTML = STATE.bookmarks.map((b, i) => {
    const clickAction = b.route === 'custom_hero'
      ? `closeBookmarks();openCustomHeroFromBookmark('${esc(b.heroId)}')`
      : `closeBookmarks();navigate('${b.route}', ${b.idx})`;
    const delAction = b.route === 'custom_hero'
      ? `toggleCustomHeroBookmark('${esc(b.heroId)}', event)`
      : `toggleBookmark('${b.route}', ${b.idx}, '', '', event)`;
    return `
    <div class="list-row" style="border:1px solid var(--border-light);border-radius:8px;margin-bottom:8px;" onclick="${clickAction}">
      <div class="list-row-main">
        <div class="list-row-title">${esc(b.title)}</div>
        <div class="list-row-sub">${catNames[b.route] || b.route}${b.sub ? ' • ' + esc(b.sub) : ''}</div>
      </div>
      <button class="star-btn saved" onclick="${delAction}" title="Удалить">✕</button>
    </div>`;
  }).join('');
}
function openBookmarks() {
  updateBookmarkUI();

function closeBookmarks() {
  document.getElementById('bmDrawer').classList.remove('open');

function closeMobileSidebar() {

const GLOBAL_INDEX = buildGlobalIndex();

function handleGlobalSearch(q) {
  const dd = document.getElementById('globalSearchDropdown');
  const clr = document.getElementById('globalSearchClear');
  q = (q || '').trim().toLowerCase();
  clr.style.display = q ? 'block' : 'none';
  if (q.length < 2) { dd.classList.remove('open'); return; }
  const matches = GLOBAL_INDEX.filter(it => it.hay.includes(q)).slice(0, 18);
  if (!matches.length) {
    dd.innerHTML = '<div class="gs-item"><span class="gs-item-sub">Ничего не найдено по запросу «' + esc(q) + '»</span></div>';
  } else {
    dd.innerHTML = matches.map(m => `
      <div class="gs-item" onclick="selectGlobalMatch('${m.route}', ${m.idx})">
        <div>
          <div class="gs-item-title">${esc(m.title)}</div>
          <div class="gs-item-sub">${esc(m.sub)}</div>
        </div>
        <span class="gs-cat">${m.cat}</span>
      </div>
    `).join('');
  }
  dd.classList.add('open');
}
function selectGlobalMatch(route, idx) {
  document.getElementById('globalSearchDropdown').classList.remove('open');
  if (STATE.filters[route]) STATE.filters[route].q = '';
  navigate(route, idx);
}
