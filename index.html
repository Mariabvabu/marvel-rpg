},{"name":"Групповой полёт","en":"Group Flight","flavor":"Персонаж может взять других с собой в небеса.","group":"Основные","prereq":"Полёт 1, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"За каждое очко Эго персонажа, он может взять с собой союзника в воздух. Скорость полёта группы — половина скорости полёта персонажа, и все задействованные союзники должны оставаться в пяти пространствах на ранг персонажа. Персонаж контролирует скорость и позицию каждого союзника во время своего хода, но отпустить их может в любой момент.","page":101},{"name":"Групповая Невидимость","en":"Group Invisibility","flavor":"Персонаж может сделать невидимым что-то ещё.","group":"Иллюзия","prereq":"Передача Невидимости, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"На каждое очко защиты эго персонажа, он может сделать кого-то или что-то невидимым, включая себя. Цели могут быть больше персонажа на размер за ранг.","page":102},{"name":"Групповая Левитация","en":"Group Levitation","flavor":"Персонаж может поднять и других в воздух тоже.","group":"Телекинез","prereq":"Левитация, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж может поднять в воздух по человеку за ранг в любом направлении на Скорость Бега персонажа. Цель/цели в полёте должны оставаться на расстоянии 5 пространств за ранг. Если цель не хочет, чтобы её так двигали, она должна быть предварительно телекинетически захвачена.","page":102},{"name":"Рост 1","en":"Grow","flavor":"Персонаж увеличивается!","group":"Смена Размера","prereq":"Никаких","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Постоянная.","range":"","cost":"","effect":"Персонаж может вырасти до огромного размера. Также он может вернуться к обычному размеру по желанию.","page":102},{"name":"Рост 2","en":"","flavor":"Персонаж становится ещё больше!","group":"Смена Размера","prereq":"Рост 1","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может вырасти до гигантского размера. Также он может вернуться к обычному размеру по желанию.","page":102},{"name":"Рост 3","en":"","flavor":"Персонаж может быть размером с дом!","group":"Смена Размера","prereq":"Рост 2","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может вырасти до титанического размера. Также он может вернуться к обычному размеру по желанию.","page":102},{"name":"Рост 4","en":"","flavor":"Персонаж может поднять Годзиллу!","group":"Смена Размера","prereq":"Рост 3","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может вырасти до громадного размера. Также он может вернуться к обычному размеру по желанию.","page":102},{"name":"Атака из Роста","en":"Growing Attack","flavor":"Персонаж атакует во время увеличения.","group":"Смена Размера","prereq":"Рост 1, Ранг 2","action":"Реакция.","trigger":"Персонаж растёт.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Силы с преимуществом. Если атака успешна, он наносит обычный урон для размера, на который растёт. При Фантастическом Успехе, урон удваивается и цель оглушается.","page":102},{"name":"Выстрел в Голову","en":"Headshot","flavor":"Ай!","group":"Оружие Дальнего Боя","prereq":"Останавливающая Сила, Ранг 3","action":"Постоянная","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает атаку Ловкости с помехой против врага в зоне поражения оружия. При успехе, врагу наносится двойной урон. При Фантастическом Успехе — врагу наносится тройной урон. В любом случае, если враг получил урон — он оглушается на раунд.","page":102},{"name":"Исцеляющий Фактор","en":"Healing Factor","flavor":"Персонаж удивительно быстро исцеляется. Очки показателей характеристик.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"В конце хода персонажа, он восстанавливает здоровье равное Выносливости. (Вне боя это тоже работает, быстро восполняя ему полное здоровье)","page":102},{"name":"Обострённые Чувства 1","en":"","flavor":"(Heightened Senses) У персонажа превосходные чувства.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж чувствует вещи в два раза дальше обычного человека. Также у него преимущество на проверках Бдительности, чтобы ощущать что-либо, а у врагов помеха на проверках, когда они пытаются прокрасться мимо.","page":102},{"name":"Обострённые Чувства 2","en":"","flavor":"Чувства персонажа точны как радар.","group":"Основные","prereq":"Обострённые Чувства 1","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж чувствует вещи в четыре раза дальше обычного человека. Его чувства такие острые, что он может их использовать, чтобы компенсировать потерю других (скажем, слуха или зрения.). Персонаж даже может слышать сердцебиение человека, с которым находится в комнате, чтобы определить, лжёт ли он — впрочем, с такой же надёжностью, как у обычного детектора лжи: Далеко не идеальная и в суде не применяется. Также у него двойное преимущество на проверках Бдительности, чтобы ощущать что-либо, а у врагов двойная помеха на проверках, когда они пытаются прокрасться мимо.","page":103},{"name":"Цепи Адского Пламени","en":"Hellfire Chains","flavor":"Персонаж призывает цепи, покрытые адским огнём.","group":"Магия","prereq":"Проклят, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж призывает цепи в адском пламени и может использовать их, чтобы связать или ударить цели. Он может атаковать любую цель в пределах 10 пространствах на ранг и в зоне видимости. Совершает атаку Эго. При успехе, цель получает обычный урон здоровью. При Фантастическом Успехе, цель схвачена и парализована. Если цель схвачена Цепями адского пламени, каждый последующий раунд, персонаж может сделать проверку Эго против защиты Выносливости цели, чтобы нанести обычный урон здоровью цели и обычный урон фокусу. Чтобы вырваться из цепей адского пламени, цель должна пройти проверку Силы со сложностью 20.","page":103},{"name":"Снаряд Сглаза","en":"Hex Bolt","flavor":"Персонаж швыряет во врага снаряд сглаза.","group":"Магия","prereq":"Хаотический, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"","page":103},{"name":"Стоимость: 5 Фокуса Эффект: Персонаж запускает снаряд сглаза во врага.","en":"","flavor":"Персонаж делает проверку Эго против защиты Ловкости цели. При успехе, атака наносит обычный урон. При Фантастическом Успехе, урон удваивается и действия противника будут проходить с помехой на один раунд. Ударил-Отошёл (Hit & Run) Персонаж бьёт и продолжает бежать!","group":"Оружие Ближнего Боя","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж проводит атаку Силы с преимуществом против врага. Если атака успешна, врагу наносится обычный урон, и персонаж может совершить дополнительное движение до половины своей Скорости Бега без затрат. При Фантастическом Успехе, врагу наносится двойной урон и специальный эффект оружия.","page":103},{"name":"Ложись!","en":"Hit the Dirt","flavor":"Персонаж приказывает союзникам укрыться.","group":"Тактика","prereq":"Продолжаем, Ранг 2","action":"Реакция","trigger":"Враг в зоне видимости совершает атаку по союзнику в зоне слышимости.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Все союзники в зоне слышимости могут упасть, если хотят и если могут. Если лёжа союзник недостижимая цель для атаки — атака автоматически проваливается.","page":103},{"name":"Метательный Удар Щитом","en":"Hurled Shield Bash","flavor":"Персонаж метает свой могучий щит во врага.","group":"Щитоносец","prereq":"Удар Щитом, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств на ранг персонажа","cost":"5 Фокуса","effect":"Персонаж совершает атаку Ловкости по врагу. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе, врагу наносится двойной урон и он падает. Затем щит возвращается к персонажу.","page":104},{"name":"Метательный Блок Щитом","en":"Hurled Shield Block","flavor":"Персонаж метает свой могучий щит, чтобы защитить союзника от атаки.","group":"Щитоносец","prereq":"Щит 1, Ранг 2","action":"Реакция","trigger":"Враг совершает атаку против Защиты Ловкости союзника.","duration":"Мгновенная","range":"5 пространств на ранг персонажа","cost":"5 Фокуса","effect":"Против этой атаки союзник получает Уменьшение Множителя Урона По Здоровью равное способности Щит персонажа. Затем щит возвращается к персонажу.","page":104},{"name":"Метательное Отражение Щитом","en":"Hurled Shield Deflection","flavor":"Персонаж метает свой могучий щит, чтобы спасти союзника от атаки.","group":"Щитоносец","prereq":"Никаких","action":"Реакция","trigger":"Враг совершает атаку против Защиты Ловкости союзника.","duration":"Постоянная","range":"5 пространств на ранг персонажа","cost":"5 Фокуса","effect":"Персонаж известен владением и использованием уникального и могущественного оружия, вроде Мьёльнира (молота Тора) или щита Капитана Америки. Рассказчик должен разрешить действие этого оружия. Эту способность можно взять больше одного раза, но каждый раз это должно быть другим оружием. (Модификаторы множителя урона не складываются и в этом случае.)","page":104},{"name":"Ледяные Щупальца Икталона","en":"Icy Tendrils of Ikthalon","flavor":"Персонаж высвобождает ледяные щупальца на врага.","group":"Магия","prereq":"Чародей, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств","cost":"5 Фокуса.","effect":"Персонаж совершает проверку Эго против защиты Ловкости цели в зоне видимости. Если атака успешна, она наносит обычный урон. При Фантастическом Успехе, цель получает двойной урон и парализована льдом.","page":104},{"name":"Освещение","en":"Illumination","flavor":"Персонаж создаёт яркий свет.","group":"Иллюзия","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж освещает один объект или точку в зоне видимости, на расстоянии до 50 пространств, ярким светом. Персонаж может поддерживать концентрацию на эффекте, даже если выйдет за дистанцию или зоны видимости.","page":105},{"name":"Образы Иконна","en":"Images of Ikonn","flavor":"Персонаж создаёт иллюзорные копии кого-то.","group":"Магия","prereq":"Чародей, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж создаёт звуковую и визуальную иллюзорную копию на ранг кого-то, кого они встречали (включая себя.). Копия выглядит и звучит в точности как оригинал и под полным контролем Персонажа. Копии начинаются из того же месте, где персонаж, и мгновенно перемещаются в любую открытую область вокруг, до двух пространств, за это время персонаж может поменяться местами с любой копией. Если персонаж копирует себя, игрок персонажа должен втайне записать, какая копия — настоящий персонаж. Копия может двигаться до 10 пространств от персонажа и могут притвориться, что атакуют (мимо.) оппонента. Любая атака, которая попадает по копии — мгновенно её уничтожает. Если персонаж успешно атакует кого-то или делает что-то ещё, что раскрывает правду — иллюзия прекращается. Это заклинание также можно использовать, чтобы видеть сквозь чужую иллюзию. Когда способность используется так, она даёт персонажу двойное преимущество на проверке Эго.","page":105},{"name":"Недвижим","en":"Immovable","flavor":"Никто не может персонажа столкнуть.","group":"Щитоносец, Супер-Сила","prereq":"Никаких","action":"Реакция","trigger":"Персонаж отброшен или лежит.","duration":"Мгновенная","range":"","cost":"","effect":"За каждое очко защиты Силы у персонажа, он может уменьшить отбрасывание на 1.","page":105},{"name":"Загрузить информацию","en":"Information Upload","flavor":"Персонаж может отправить информацию прямо в чужой разум.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса СПОСОБНОСТИ","effect":"Персонаж переносит переносит свои знания (черта или тег) цели, с которой у него есть телепатическая связь — хочет того цель или нет. Знание держится, пока цель не поспит. Также персонаж может передавать любую информацию цели. Процесс почти мгновенный.","page":105},{"name":"Воодушевление","en":"Inspiration","flavor":"Слова персонажа вдохновляют союзников.","group":"Основные","prereq":"Никаких","action":"Обычное","trigger":"","duration":"1 раунд","range":"","cost":"","effect":"Персонаж воодушевляет союзника в зоне слышимости. Союзник получает преимущество на все проверки действия до начала следующего хода.","page":105},{"name":"Повторный Показ","en":"Instant Replay","flavor":"Персонаж отматывает время.","group":"Омнивселенские Путешествия","prereq":"Ранг 3","action":"Реакция","trigger":"Персонаж проваливает проверку.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Раз за бой, персонаж может сделать вторую попытку в проверке, которую провалил, стирая и заменяя прошлую полностью.","page":105},{"name":"Прямолинейность","en":"Integrity","flavor":"Персонаж может придумать выход.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может использовать защиту Логики против атак Эго в том числе.","page":105},{"name":"Невидимость","en":"Invisibility","flavor":"Персонаж становится прозрачным, как стекло.","group":"Иллюзия","prereq":"Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж становится невидимым. У него преимущество на проверки Ловкости, чтобы красться мимо людей, а у врагов проверка Бдительности на проверках, чтобы его обнаружить. Намного сложнее обнаружить то, что не видно, но ещё и неподвижно. Персонажи должны активно пытаться это сделать, чтобы делать проверку Бдительности.","page":105},{"name":"Неудача","en":"Jinx","flavor":"Персонаж накладывает на врага неудачу.","group":"Магия","prereq":"Хаотический, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж совершает проверку Эго против защиты Эго цели. При успехе, у цели все действия будут происходить с помехой. При Фантастическом Успехе, цель также теряет возможность совершить следующее обычное действие.","page":105},{"name":"Прыжок 1","en":"Jump","flavor":"Персонаж скачет, как лягушка.","group":"Паучьи Способности, Супер-Сила","prereq":"Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Скорость прыжка персонажа равна скорости бега. На эту дистанцию персонаж может прыгать в любом направлении, как вертикально, так и горизонтально.","page":106},{"name":"Прыжок 2","en":"","flavor":"Персонаж скачет с ослепляющей скоростью.","group":"Паучьи Способности, Супер-Сила","prereq":"Прыжок 1, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Скорость прыжка персонажа равна рангу, умноженному на скорость бега. Вне боя персонаж передвигается в 3 раза быстрее.","page":106},{"name":"Прыжок 3","en":"","flavor":"Прыжок может резко прыгнуть в небо.","group":"Паучьи Способности, Супер-Сила","prereq":"Прыжок 2, Ранг 4","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Вне боя, персонаж может прыгать в 50 раз быстрее скорости прыжка..","page":106},{"name":"Продолжаем","en":"Keep Moving","flavor":"Персонаж призывает союзников к движению под огнём.","group":"Тактика","prereq":"Никаких","action":"Реакция","trigger":"Союзник в зоне видимости и слышимости деморализован или оглушён.","duration":"Мгновенная","range":"","cost":"","effect":"Деморализованное или оглушённое состояние заканчивается.","page":106},{"name":"Убийственная зона","en":"Kill Zone","flavor":"Персонаж стреляет в каждую цель, что движется сквозь его убийственную зону.","group":"Оружие Дальнего Боя","prereq":"Огневое Прикрытие, Выстрел в Голову, Ранг 4","action":"Реакция","trigger":"Враг в зоне зрения персонажа начинает двигаться.","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает атаку Ловкости по врагу. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе, врагу наносится двойной урон. В любом случае, персонаж восполняет реакцию. Каждая цель может быть жертвой этой атаки от этого персонажа только раз за раунд.","page":106},{"name":"Замок Ноги в Прыжке","en":"Leaping Leglock","flavor":"Персонаж прыгает в воздух и обхватывает врага ногами.","group":"Боевые Искусства","prereq":"Двойной Удар Ногой в Прыжке, Разрушительная Хватка, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает атаку силы против врага. При успехе, враг схвачен и получает обычный урон. При Фантастическом Успехе, враг получает двойной урон, схвачен и оглушён на раунд. В любом случае, персонаж и враг лежат.","page":106},{"name":"Кража жизни","en":"Leech Life","flavor":"Персонаж поглощает жизненную силу другого.","group":"Магия","prereq":"Ранг 2","action":"Реакция","trigger":"Цель в захвате.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Эго против защиты Выносливости цели. При успехе, цель получает обычный урон здоровью, и персонаж восполняет здоровье на половину от этого урона. При Фантастическом Успехе, персонаж восполняет здоровье на весь урон.","page":106},{"name":"Подсечка","en":"Leg Sweep","flavor":"Персонаж сбивает противника с ног.","group":"Боевые Искусства","prereq":"Быстрые Удары, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку силы. При успехе, враг получает обычный урон и падает. При Фантастическом Успехе, враг также оглушён на один раунд.","page":106},{"name":"Левитация","en":"Levitation","flavor":"Очки показателей характеристик. Персонаж поднимается в воздух и двигается.","group":"Телекинез","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может двигаться в воздухе в любом направлении со Скоростью Бега.","page":106},{"name":"Молниеносные Действия","en":"Lightning Actions","flavor":"Персонаж быстрый, как молния.","group":"Супер-Скорость","prereq":"Ранг 4","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Раз за раунд, персонаж может использовать обычное действие в качестве реакции, или реакцию в качестве обычного действия. Дополнительно, персонаж может поменять свою кость Marvel на Фантастический Успех во время броска инициативы.","page":106},{"name":"Машинная Телепатия","en":"Machine Telepathy","flavor":"Персонаж может общаться с машинами своим разумом.","group":"Телепатия","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж может телепатически общаться с одной машиной за раз, и они должны были встретить или видеть машину до этого. Коммуникация может быть вербальная, визуальная или даже более комплексная, вроде обмена информацией о местонахождении. Нет лимита дистанции на такую коммуникацию, до тех пор, пока персонаж и машина находятся в одном измерении. Обычные машины мало что могут предложить в диалоге, но, обычно, легко выполняют просьбы. Сложные машины, вроде компьютеров, смартфонов и прочей электроники, обычно доброжелательны, но если они защищены каким-то образом, обычно, машины отказываются разговаривать с незнакомцами. Проверка логики может дать персонажу обойти защиту, Рассказчику стоит поставить сложность в зависимости от уровня защиты.","page":107},{"name":"Макроизмеренческое Перемещение","en":"Macrodimensional Travel","flavor":"Персонаж перерос вселенную!","group":"Смена Размера","prereq":"Рост 4, Ранг 4","action":"Обычное СПОСОБНОСТИ","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж может вырасти достаточно, чтобы войти в Макровселенную, в Надпространство или другое измерение неизмеримо гигантских масштабов. Персонаж может вернуться к обычному размеру по желанию. Заметим, что это персонажи очень редко хотят делать, так как оно убирает персонажа полностью из его обычной вселенной и помещает в место, где законы времени и пространства работают иначе. Час в Макровселенной, например, примерно равен месяцу в обычной. Путешествие в Надпространство тоже слишком захватывающее, чтобы с этим мог справиться обычный разум.","page":107},{"name":"Провал в Памяти","en":"Memory Blip","flavor":"Персонаж стирает немного чужой памяти.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж заставляет цель, с которым у него есть Телепатическая Связь, забыть что-то, что произошло за последний час. Этот провал может быть до часа в длину. Персонаж совершает проверку Логики против защиты Логики цели. При успехе — воспоминания забыты. При Фантастическом Успехе, у цели будет помеха на проверках восполнить эти воспоминания в будущем. Каждый раз, когда у цели есть хорошая причина усомниться в своих воспоминаниях, она может сделать проверку Логики, чтобы восполнить свои воспоминания. При успехе, цель всё вспоминает. При Фантастическом Успехе — она точно знает, кто редактировал их воспоминания.","page":107},{"name":"Ментальный Удар","en":"Mental Punch","flavor":"Персонаж может атаковать разум врага вблизи.","group":"Телепатия","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж совершает атаку Силы против цели. Если атака успешна, цель получает обычный урон по Фокусу (вместо урона по здоровью.). При Фантастическом успехе, цели наносится двойной урон и она Оглушается на раунд.","page":108},{"name":"Ментальное Укрытие","en":"Mental Shelter","flavor":"Персонаж может создать укрытие для своего разума.","group":"Телепатия","prereq":"Поразительный 1, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж распространяет свою ментальную защиту, чтобы защитить выбранных людей на расстоянии до пяти пространств за ранг. Защищённые цели получают Уменьшение Множителя Урона по Фокусу равное способности Поразительный персонажа. Микроизмеренческое","page":108},{"name":"Перемещение","en":"Microdimensional Travel","flavor":"Персонаж сжимается из вселенной!","group":"Смена Размера","prereq":"Сжатие 4, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж может сжаться достаточно, чтобы попасть в субатомное измерение. Он может вернуться к обычному размеру по желанию. Заметим, что это персонажи очень редко хотят делать, так как оно убирает персонажа полностью из его обычной вселенной и помещает в место, где законы времени и пространства работают иначе. Подпространство, например, отличное место, чтобы спрятаться, но интересного там ничего нет.","page":108},{"name":"Мощь 1","en":"Mighty","flavor":"Персонаж нечеловечески силён.","group":"Основные","prereq":"Ранг 1","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Относитесь к персонажу как на 1 размеров больше в вопросах поднимания, переноса, бросания вещей и их размахиванием. Персонаж также добавляет +1 к множителю урона Силы и +1 к небоевым проверкам Силы. Очки показателей характеристик.","page":108},{"name":"Мощь 2","en":"","flavor":"Персонаж может поднять автобус.","group":"Основные","prereq":"Мощь 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Относитесь к персонажу как на 2 размеров больше в вопросах поднимания, переноса, бросания вещей и их размахиванием. Персонаж также добавляет +2 к множителю урона Силы и +2 к небоевым проверкам Силы.","page":109},{"name":"Мощь 3","en":"","flavor":"Персонаж может поднять дом.","group":"Основные","prereq":"Мощь 2, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Относитесь к персонажу как на 3 размеров больше в вопросах поднимания, переноса, бросания вещей и их размахиванием. Персонаж также добавляет +3 к множителю урона Силы и +3 к небоевым проверкам Силы.","page":109},{"name":"Мощь 4","en":"","flavor":"Персонаж один из сильнейших.","group":"Основные","prereq":"Мощь 3, Ранг 4","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Относитесь к персонажу как на 4 размера больше в вопросах поднимания, переноса, бросания вещей и их размахиванием. Персонаж также добавляет +4 к множителю урона Силы и +4 к небоевым проверкам Силы.","page":109},{"name":"Вторжение в Разум","en":"Mind Interrogation","flavor":"Персонаж может прокопаться в разум цели.","group":"Телепатия","prereq":"Чтение Мыслей, Ранг 2.","action":"Обычное","trigger":"","duration":"1 раунд","range":"","cost":"5 Фокуса","effect":"Персонаж может проникнуть в разум цели, с которой у него установлена Телепатическая связь. Это требует проверки Логики против защиты Логики цели. При успехе, персонаж может задать простой вопрос и получить ответ из разума цели. При Фантастическом Успехе, персонаж может получить более комплексную информацию.","page":109},{"name":"Чтение Мыслей","en":"Mind Reading","flavor":"Персонаж может читать мысли.","group":"Телепатия","prereq":"Телепатическая Связь","action":"Обычное","trigger":"","duration":"1 раунд","range":"","cost":"","effect":"Персонаж может читать мысли цели, с которой у него установлена Телепатическая Связь. Это требует проверки Логики против защиты Логики цели. При успехе, персонаж может прочесть мысли на поверхности. При Фантастическом Успехе, персонаж может задать простой вопрос и получить ответ из разума цели. СПОСОБНОСТИ","page":109},{"name":"Мираж","en":"Mirage","flavor":"Персонаж заставляет появиться что-то в разуме другого.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж создаёт полностью ощущаемый образ, который действует на цель, с которой у персонажа Телепатическая Связь. Образ может быть каким персонаж пожелает, и может свободно двигаться.","page":109},{"name":"Зеркальные Образы","en":"Mirror Images","flavor":"Персонаж создаёт иллюзорную копию себя.","group":"Иллюзия","prereq":"Двигающаяся Иллюзия, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж создаёт одну звуковую и визуальную иллюзорную копию себя на ранг. Копия выглядит и звучит в точности как оригинал и под полным контролем Персонажа. Копии начинаются из того же места, где персонаж, и мгновенно перемещаются в любую открытую область вокруг, до двух пространств, за это время персонаж может поменяться местами с любой копией. Игрок персонажа должен втайне записать, какая копия — настоящий персонаж. Копия может двигаться до 10 пространств от персонажа и могут притвориться, что атакуют (мимо.) оппонента. Любая атака, которая попадает по копии — мгновенно её уничтожает. Если персонаж успешно атакует кого-то или делает что-то ещё, что раскрывает правду — иллюзия прекращается.","page":109},{"name":"Туманы Морфея","en":"Mists of Morpheus","flavor":"Персонаж усыпляет врага.","group":"Магия","prereq":"Чародей, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж совершает проверку Эго против защиты Бдительности цели. При успехе, цель оглушается и остаётся оглушённой, пока Персонаж держит концентрацию. При Фантастическом Успехе, цель засыпает.","page":109},{"name":"Туманы Муннопора","en":"Mists of Munnopor","flavor":"Персонаж призывает густой туман.","group":"Магия","prereq":"Чародей, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж создаёт густой туман на 100 пространств за ранг вокруг себя, который блокирует всю зону видимости до 10 пространств и не даёт людям или существам внутри летать, планировать или раскачиваться на паутине.","page":109},{"name":"Молекулярная Дестабилизация","en":"Molecular Destabilization","flavor":"Персонаж заставляет что-то вибрировать так быстро, что оно взрывается.","group":"Супер-Скорость","prereq":"Скоростное Прохождение 2, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает атаку Силы против объекта их размера или меньше. При успехе, объект взрывается. Все цели на расстоянии двух пространств от объекта, помимо самого Персонажа — получают обычный урон. При Фантастическом Успехе, удвойте урон и игнорируйте всё Уменьшение Множителя Урона Здоровья.","page":110},{"name":"Мультивселенский Портал","en":"Multiversal Portal","flavor":"Персонаж открывает портал в другую вселенную.","group":"Омнивселенские Путешествия","prereq":"Мультивселенское Перемещение Вместе, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж открывает светящийся портал в пространстве рядом, который передвигает всё, что проходит через эту пространство, в другой портал, который открывается в другом месте. Другой портал должен быть на свободном пространстве в другой вселенной, в которой персонаж был. Что угодно может проходить сквозь портал в любом направлении, пока портал не закроется, что персонаж может сделать по желанию.","page":110},{"name":"Мультивселенское Перемещение","en":"Multiversal Travel","flavor":"Персонаж перемещается из одной вселенной в другую.","group":"Омнивселенские Путешествия","prereq":"Ранг 3","action":"Обычное или движение","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж мгновенно движется из нынешней вселенной в другую. Например: Из Земли 616 в Землю 65. Когда персонаж движется в другую вселенную, он может появиться в любом месте, где уже бывал. В ином случае, он появляется в ближайшем доступном свободном пространстве другой вселенной. Мультивселенское Перемещение","page":110},{"name":"Встать","en":"On Your Feet","flavor":"Персонаж поднимает друзей на ноги.","group":"Тактика","prereq":"Продолжаем, Ранг 2","action":"Реакция","trigger":"Союзник в зоне видимости и слышимости лежит.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Все лежащие союзники в зоне слышимости, которые на это способны, немедленно встают, не тратя на это движение. Союзники, которые в данный момент не могут подняться на ноги, по какой-либо причине, не задействуются.","page":111},{"name":"Командный Центр","en":"Operations Center","flavor":"Персонаж ведёт союзников в бой.","group":"Тактика","prereq":"Боевая Поддержка, Сфокусировать Огонь, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж воодушевляет одного или более союзников на выбор в радиусе слышимости, по количеству защиты Бдительности. Задействованные союзники получают преимущество на все проверки действия, до начала следующего хода Персонажа. Персонаж теряет концентрацию на этой способности, если использует действие передвижения.","page":111},{"name":"Оркестр Множественных Убийств","en":"Orchestra of Overkill","flavor":"Персонаж дирижирует симфонией стрельбы.","group":"Оружие Дальнего Боя","prereq":"Танец Смерти, Быстрые Руки, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает проверку Ловкости и сравнивает с защитой Ловкости каждого врага в 10 пространствах и зоне видимости. Каждый успех наносит половину обычного урона. При Фантастическом Успехе, каждая цель получает полный урон и кровотечение.","page":111},{"name":"Приказы","en":"Orders","flavor":"Персонаж заставляет кого-то следовать комплексному ряду приказов.","group":"Телепатия","prereq":"Команда, Ранг 4","action":"Обычное","trigger":"","duration":"Постоянная","range":"","cost":"15 Фокуса","effect":"Персонаж отдаёт приказ цели, с которой у него есть Телепатическая Связь и у которой не осталось Фокуса. Персонаж совершает проверку Логики против защиты Логики цели. При успехе, цель подчиняется приказам. При Фантастическом Успехе, персонаж получает преимущество каждый раз, когда применяет эту способность против этой же цели. Приказ должен быть чем-то, что можно выполнить за час или менее. Если приказы подразумевают вред кому-то, у Персонажа будет помеха на проверке. Если приказ подразумевает вред себе, у Персонажа будет двойная помеха на проверке. СПОСОБНОСТИ","page":111},{"name":"Фазирование Частичное","en":"Partial Phase","flavor":"Персонаж может сделать часть себя осязаемой или неосязаемой.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"У персонажа превосходный контроль над своей способностью Фазирования. Он может сделать любую часть своего тела и прилегающей одежды неосязаемой, как сам персонаж.","page":111},{"name":"Карающий Взор","en":"Penance Stare","flavor":"Персонаж может наказать осквернённых их прегрешениями.","group":"Магия","prereq":"Проклят, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж совершает проверку Эго против цели на расстоянии 3 пространства за ранг. При успехе, цель получает урон Фокусу. При Фантастическом Успехе, урон Фокусу удваивается и цель парализуется на раунд. Персонажи с тегом Героический получают половину этого урона в любом случае. Если цель Сломлена из-за этой силы, она может восстановиться, но одним из двух способов. Или цель освобождается от грехов и готова начать новую жизнь с чистого листа, или их эмоции высушены навсегда. Как это работает, в любом случае, решает Рассказчик.","page":111},{"name":"Фазирование Объекта","en":"Phase Object","flavor":"Персонаж может сделать что-то, чего касается —неосязаемым.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж может сделать любой объект, которого касается — неосязаемым. Объект (и вещи с ним соприкасающиеся или находящиеся внутри) могут быть больше размером на количество рангов. Например, если персонаж 5-го Ранга — объект может быть в 5 раз больше персонажа. Для обычного человека это будет Громадный размер.","page":111},{"name":"Фазирование Другого","en":"Phase Other","flavor":"Персонаж может фазировать кого-то, кого касается.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 3","action":"Обычное или реакция","trigger":"Цель в захвате.","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж может сделать любого человека (и его одежду.) которого он касается — неосязаемым. Персонаж может также фазировать любого, которого цель касается или держит в захвате. Люди, которые фазированы — остаются друг для друга осязаемыми. Если цель не хочет быть фазированной, персонаж должен предварительно её схватить. Когда контакт обрывается, фазирование для тех, кто больше не касается Персонажа (даже не напрямую) закачивается. Если цель внутри чего-то, когда фазирование заканчивается, она автоматически выталкивается, но получает урон от разрушения равный стандартной проверке действия. Множитель урона 1 на каждое пространство, которую цель должна пройти, чтобы достичь свободной зоны. Если это убивает цель — её тело останется в материале, в который её фазировали.","page":111},{"name":"Фазирование Себя","en":"Phase Self","flavor":"Персонаж становится неосязаемым, как призрак.","group":"Фазирование","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж (и его одежда) становится неосязаемым и может двигаться сквозь всё, как если бы ничего не было. Ничто физически не может на него воздействовать, как и персонаж не может ни на что повлиять, что не фазировано вместе с ним.","page":112},{"name":"Фазированная Ходьба","en":"Phase Walk","flavor":"Персонаж может ходить по воздуху.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 2","action":"Постоянная","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса.","effect":"Когда фазирован, персонаж может свободно двигаться в любом направлении, сквозь что угодно. Не только воздух, но и воду, дома и так далее, со своей скоростью Бега. Персонаж может взять с собой что и кого угодно.","page":112},{"name":"Парирование в Упор","en":"Point-Blank Parry","flavor":"Когда враг вступает, персонаж даёт волю эмоциям. Очки показателей характеристик.","group":"Оружие Дальнего Боя","prereq":"Ранг 2","action":"Реакция","trigger":"Враг на расстоянии до двух пространств промахивается атакой по персонажу.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Ловкости по врагу, что промахнулся. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе, врагу наносится двойной урон и кровотечение.","page":112},{"name":"Овладение Транспортом","en":"Possess Vehicle","flavor":"Персонаж берёт машину под контроль.","group":"Магия","prereq":"Проклят, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж берёт машину, с которой соприкасается или в которой находится, под магический контроль. Адское пламя пылает снаружи транспорта, но урон оно не наносит. Впрочем, любой, кто взаимодействует с транспортом, получает обычный урон с множителем, равным рангу Персонажа. При Фантастическом Успехе, урон наносится и Здоровью, и Фокусу. Персонаж мысленно контролирует транспорт до тех пор, пока он на расстоянии 20 пространств за ранг персонажа. Персонаж использует Эго на все проверки контроля и получает на них преимущество. Скорость транспорта удваивается, он может передвигаться по стенам и прыгать с такой же скоростью.","page":112},{"name":"Овладение","en":"Possession","flavor":"Персонаж захватывает чьё-то тело.","group":"Магия","prereq":"Проклят, Ранг 5","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"20 Фокуса","effect":"Персонаж совершает проверку Эго с помехой против защиты Эго персонажа, у которого не осталось Фокуса. При успехе, персонаж полностью захватывает тело цели. Защита Эго персонажа — сложность для любой проверки, чтобы прекратить овладение. Если персонаж собирается ранить кого-то одержимым телом — цель может сделать проверку Эго, чтобы прекратить овладение. Если у цели есть тег Героический, у неё будет преимущество на проверке. Если персонаж собирается ранить одержимое тело, цель получает преимущество на проверку. Если у цели есть тег Героический, у неё будет двойное преимущество.","page":113},{"name":"Могущественный Сглаз","en":"Powerful Hex","flavor":"Персонаж симулирует чужие способности своей магией.","group":"Магия","prereq":"Хаотический, Ранг 2","action":"Обычное","trigger":"","duration":"Варьируется","range":"","cost":"5 или более Фокуса","effect":"Персонаж накладывает заклятие, что позволяет ему использовать любую другую способность, на которую ему хватает ранга, даже если персонаж не соответствует требованиям другой способности. Персонаж должен потратить стоимость на 5 больше Фокуса этой способности. Если продолжительность этой способности Постоянная — для персонажа она будет требовать концентрации. Если способность с числом, вроде Мощь 3 — стоимость Фокуса будет составлять 5 за число. (Мощь 3 будет стоить 15 Фокуса.)","page":113},{"name":"Манипулирование Полем Вероятности","en":"Probability-Manipulation Hex","flavor":"Персонаж заставляет маловероятные вещи произойти.","group":"Магия","prereq":"Хаотический, Ранг 3","action":"Обычное или реакция","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Когда союзник на расстоянии 5 пространств за ранг Персонажа совершает проверку, на которую у него есть помеха, этот сглаз убирает все помехи и даёт вместо них преимущество. СПОСОБНОСТИ","page":113},{"name":"Защитный сглаз","en":"Protection Hex","flavor":"Персонаж накладывает заклятие для своей защиты.","group":"Магия","prereq":"Хаотический, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж призывает сглаз, чтобы помочь себе защититься, совершает проверку Эго. Результат — это теперь защита Персонажа от любой атаки. Если результат оказывается не так высок, как хотел бы персонаж, он может закончить сглаз и повторить позже. При Фантастическом Успехе, сглаз также даёт Уменьшение Множителя Урона Здоровья 1 на всё время действия.","page":113},{"name":"Быстрое Фазирование","en":"Quick Phase","flavor":"Персонаж становится неосязаемым, как призрак.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 2","action":"Реакция","trigger":"Персонаж атакован.","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж и его одежда могут мгновенно стать неосязаемыми.","page":113},{"name":"Быстрый Бросок","en":"Quick Toss","flavor":"Персонаж швыряет человека как игрушку.","group":"Супер-Сила","prereq":"Разрушительная Хватка, Мощь 1","action":"Реакция","trigger":"Кто-то схвачен, кого персонаж может поднять.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж швыряет захваченную цель в другую. Дистанция определяется уровнем Мощи персонажа и размером схваченной цели. Персонаж совершает атаку Ловкости против цели. Провал наносит обычный урон брошенному, он лежит на расстоянии 1 от цели. При успехе, цели также наносится обычный урон. При Фантастическом Успехе, цель также лежит. .","page":113},{"name":"Сплотиться","en":"Rally on Me","flavor":"Пер "duration":"Постоянная","range":"","cost":"10 Фокуса","effect":"Персонаж может изменить рост любого (и их одежды.), кого касается. Персонаж может изменить размер цели настолько, насколько позволяет его способность Рост или Сжатие. Если цель не хочет менять размер, персонаж должен предварительно её схватить.","page":114},{"name":"Ответный Огонь","en":"Return Fire","flavor":"Персонаж отвечает на наступление градом выстрелов.","group":"Оружие Дальнего Боя","prereq":"Огонь на Подавление, Ранг 2","action":"Реакция","trigger":"Враг объявляет атаку по персонажу.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Ловкости против защиты Бдительности цели. Если атака успешна, применяется Уменьшение Множителя Урона, как обычно. Любой наносимый урон вместо этого наносится Фокусу цели. При Фантастическом Успехе, урон удваивается, и если цель получает какой-либо урон по Фокусу, она оглушается на 1 раунд. Очки показателей характеристик. СПОСОБНОСТИ","page":114},{"name":"Обратный удар","en":"Reverse Punch","flavor":"Персонаж может растянуться за врага и ударить со спины.","group":"Пластичность","prereq":"Гибкие Кости 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку силы с преимуществом против врага. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе, врагу наносится двойной урон и он оглушается на раунд.","page":115},{"name":"Бросок с Обратным Импульсом","en":"Reverse-Momentum Throw","flavor":"Персонаж использует импульс атакующего, чтобы швырнуть его на землю.","group":"Боевые Искусства","prereq":"Оборонительная Стойка, Ранг 2","action":"Реакция","trigger":"Пока активна Оборонительная Стойка, атака Силы по персонажу промахивается.","duration":"Мгновенная","range":"","cost":"Никакой","effect":"Атакующий падает и получает половину урона, который мог бы нанести при успехе.","page":115},{"name":"Рико-Щит","en":"Rico-Shield","flavor":"Щит П г 3","action":"Реакция","trigger":"Враг в зоне видимости объявляет атаку по союзнику в зоне слышимости.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Все союзники в радиусе слышимости могут быть задействованы, количество равно рангу Персонажа. Каждый задействованный союзник может двинуться от Персонажа на половину скорости Бега и упасть. Если это делает союзника недопустимой для атаки целью, она автоматически проваливается.","page":116},{"name":"Чувство Греха","en":"Sense Sins","flavor":"Персонаж может взглянуть в чужую душу.","group":"Магия","prereq":"Проклят","action":"Обычное","trigger":"","duration":"Мгновенное","range":"","cost":"","effect":"Персонаж смотрит в глаза цели и совершает проверку Эго против защиты Эго цели. При успехе, персонаж может почувствовать, какого рода ужасные вещи совершала цель. При Фантастическом Успехе, персонаж может ощутить, какого рода ужасные вещи цель собирается совершить в ближайшем будущем.","page":116},{"name":"Чувство Сверхъестественного","en":"Sense Supernatural","flavor":"Персонаж может ощущать сверхъестественное.","group":"Магия","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж может ощутить своим разумом присутствие сверхъестественных существ и их общее состояние. Если цель или цели желают остаться незамеченными, персОончажк идо плжоекна созваетршеилтеь йпр охваерркау кЭтгое ир сирасвтнииткь. результат с защитой Бдительности каждой цели. При успехе, он чувствует цель. При Фантастическом Успехе, персонаж также может узнать, Проклята цель или Демоническая.","page":116},{"name":"Трансформация","en":"Shape-Shift","flavor":"Персонаж может менять форму.","group":"Основные","prereq":"Маскировка, Ранг 3","action":"Обычное или реакция","trigger":"Персонаж атакован или иным образом подвержен опасности.","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может сменить форму не более, чем на размер больший или меньший от его обычной формы. В выбранной форме, персонаж получает естественные навыки этой формы. Например, если он трансформировался в птицу — он умеет летать. Если трансформировался в рыбу — он может дышать под водой.","page":116},{"name":"Щит 1","en":"Shield","flavor":"Персонаж носит личный щит.","group":"Щитоносец","prereq":"Никаких","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Концентрация","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона По Здоровью 1.","page":117},{"name":"Щит 2","en":"","flavor":"Щит персонажа защищает, как стена.","group":"Щитоносец","prereq":"Щит 1, Ранг 2","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Концентрация","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона По Здоровью 2.","page":117},{"name":"Щит 3","en":"","flavor":"Щит персонажа защищает, как танк.","group":"Щитоносец","prereq":"Щит 2, Ранг 3","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Концентрация","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона По Здоровью 3.","page":117},{"name":"Щит 4","en":"","flavor":"Щит персонажа защищает, как бетонная стена.","group":"Щитоносец","prereq":"Щит 3, Ранг 4","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Концентрация","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона По Здоровью 4.","page":117},{"name":"Удар Щитом","en":"Shield Bash","flavor":"Персонаж ударяет врага щитом.","group":"Щитоносец","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж совершает атаку Силы по врагу в досягаемости. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе, враг получает двойной урон и лежит.","page":117},{"name":"Отражение Щитом","en":"Shield Deflection","flavor":"Персонаж использует щит, чтобы отражать атаки.","group":"Щитоносец","prereq":"Никаких","action":"Реакция","trigger":"Персонаж цель атаки против защиты Ловкости.","duration":"Мгновенная","range":"","cost":"","effect":"У атаки помеха. СПОСОБНОСТИ","page":117},{"name":"Щит Серафима","en":"Shield of the Seraphim","flavor":"Персонаж призывает магический щит.","group":"Магия","prereq":"Чародей, Ранг 3","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж призывает магический щит, который защищает его от физического урона. Любая атака против персонажа, которая наносит 20 урона или меньше — мгновенно поглощается, и защита не рушится. Если атака наносит больше 20 урона — она разрушает защиту. Если атака наносит больше 20 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":117},{"name":"Стена щита","en":"Shield Wall","flavor":"Персонаж стоит как непробиваемая стена.","group":"Щитоносец","prereq":"Приготовиться к Удару, Ранг 3","action":"Движение","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Атаки против персонажа проводятся с помехой. Персонаж теряет концентрацию на этой способности, когда использует действие передвижения.","page":117},{"name":"Сжатие 1","en":"Shrink","flavor":"Персонаж становится меньше.","group":"Смена Размера","prereq":"Никаких","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может уменьшиться до маленького размера. Он может вернуться к обычному размеру по желанию.","page":117},{"name":"Сжатие 2","en":"","flavor":"Персонаж становится ещё меньше!","group":"Смена Размера","prereq":"Сжатие 1","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может уменьшиться до крошечного размера. Он может вернуться к обычному размеру по желанию.","page":117},{"name":"Сжатие 3","en":"","flavor":"Персонаж меньше фигурки.","group":"Смена Размера","prereq":"Сжатие 2","action":"Обычное или реакция","trigger":"Пер ","prereq":"Избиение, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 или более Фокуса.","effect":"Персонаж совершает атаку Силы с преимуществом. Для этой атаки, добавьте 1 к бонусу урона Силы за каждые потраченные 2 очка Фокуса. При успехе, выбранной цели наносится весь этот урон. При Фантастическом Успехе, цель получает двойной урон и оглушается на раунд. СПОСОБНОСТИ. Art by Simone Bianchi","page":118},{"name":"Быстрая Стрельба","en":"Snap Shooting","flavor":"Персонаж стреляет от бедра со смертельной скоростью.","group":"Оружие Дальнего Боя","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж разделяет атаку, чтобы сделать две атаки ловкости по разным целям (Или он может единожды атаковать одну цель). Сделайте одну проверку ловкости и сравните с защитами ловкости целей. При успехе, выбранные цели получают по половине этого урона. При Фантастическом Успехе, каждая цель получает полный урон и кровотечение.","page":120},{"name":"Прицельный Выстрел","en":"Sniping","flavor":"Персонаж прицеливается и стреляет со смертоносной точностью.","group":"Оружие Дальнего Боя","prereq":"Ранг 2","action":"И Обычное И Движение (Персонаж не может двигаться в этот ход)","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Ловкости против врага на расстоянии минимум 20 пространств. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе — врагу наносится тройной урон.","page":120},{"name":"Выстрел Скоростью","en":"Speed Blast","flavor":"Персонаж двигает руками достаточно быстро, чтобы ударить цель воздухом.","group":"Супер-Скорость","prereq":"Скоростное Прохождение 2, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств","cost":"5 Фокуса","effect":"Персонаж совершает атаку Ловкости. При успехе, цель оглушается на раунд. При Фантастическом Успехе, она также падает.","page":120},{"name":"Скоростное Прохождение 1","en":"","flavor":"(Speed Run) Персонаж бежит быстро, как машина!","group":"Супер-Скорость","prereq":"Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Обычная скорость бега персонажа умножается на его ранг. Вне боя — персонаж движется в 3 раза быстрее.","page":120},{"name":"Скоростное Прохождение 2","en":"","flavor":"Персонаж бежит быстро, как ракета!","group":"Супер-Скорость","prereq":"Скоростное Прохождение 1, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Вне боя, персонаж движется в 50 раз быстрее своей увеличенной Скорости Бега.","page":120},{"name":"Быстрое Плавание","en":"Speed Swim","flavor":"Персонаж плавает быстрее дельфина!","group":"Супер-Скорость","prereq":"Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Обычная скорость плавания персонажа умножается на его ранг. Вне боя — персонаж движется в 3 раза быстрее.","page":120},{"name":"Паучье Уклонение","en":"Spider-Dodge","flavor":"Персонаж избегает атаки с паучьей ловкостью.","group":"Паучьи Способности","prereq":"Никаких","action":"Реакция","trigger":"Кто-то совершает атаку Ловкости против персонажа.","duration":"Мгновенная","range":"","cost":"","effect":"У атакующего помеха на атаке. Если атакующий промахивается, персонаж может отскочить в любом направлении на свою скорость прыжка.","page":120},{"name":"Паучьи Феромоны","en":"Spider-Pheromones","flavor":"Персонаж распространяет феромоны, которые воздействуют на тех, кто близко.","group":"Паучьи Способности","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"5 пространств","cost":"","effect":"У персонажа преимущество в проверках Эго (Запугивание.) против целей, которых не привлекает его пол. Также у персонажа преимущество в проверках Эго (Убеждение.) против целей, которых привлекает.","page":120},{"name":"Паучье Чутьё","en":"Spider-Sense","flavor":"У персонажа есть чувство опасности, что подсказывает об угрозе.","group":"Паучьи Способности","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"У персонажа преимущество на проверках Инициативы и на проверках Бдительности, чтобы распознать опасность. У Очки показателей характеристик. врагов помеха на проверках Ловкости против защиты Бдительности персонажа. Персонаж также получает постоянный +2 бонус к защите Ловкости.","page":120},{"name":"Паучий Удар","en":"Spider-Strike","flavor":"Персонаж размывается в атаках руками, ногами и паутиной.","group":"Паучьи Способности","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж разделяет атаку, чтобы сделать две атаки силы по разным целям в пределах досягаемости (Или они могут единожды атаковать одну цель.). Сделайте одну проверку силы и сравните с защитами силы целей. При успехе, задействованная цель получает половину этого урона. При Фантастическом Успехе, задействованная цель получает полный урон и парализована паутиной. Чтобы вырваться из паутины требуется проверка Силы, со сложностью 20. После атаки, персонаж может бежать, прыгнуть или карабкаться на половину скорости.","page":120},{"name":"Раскрутить и Бросить","en":"Spin & Throw","flavor":"Персонаж бросает схваченного врага на землю.","group":"Боевые Искусства","prereq":"Техника Захвата, Ранг 2","action":"Реакция","trigger":"Кто-то схвачен, кого персонаж может поднять.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Силы против схваченного врага. При успехе, врагу наносится обычный урон и он падает. При Фантастическом Успехе, врагу наносится двойной урон, он падает, прижат и оглушён на раунд. В любом случае, персонаж может подвинуть врага в любое свободное пространство в пределах досягаемости.","page":121},{"name":"Статичная Иллюзия","en":"Static Illusion","flavor":"Манипулируя светом, персонаж создаёт реалистичную голограмму.","group":"Иллюзия","prereq":"Освещение","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж создаёт визуальную иллюзию где угодно в радиусе видимости, на расстоянии 50 пространств. Иллюзия может быть чем угодно размером максимум в 3 раза больше персонажа, и должна быть неподвижной. Персонаж нарушает концентрацию, если он отходит на 50 пространств от иллюзии или теряет её из виду. СПОСОБНОСТИ","page":121},{"name":"Украсть Способности","en":"Steal Powers","flavor":"Персонаж удаляет все способности цели и забирает себе!","group":"Контроль Способностей","prereq":"Клонировать Способности, Вырубить Способности, Ранг 4","action":"Обычное или реакция","trigger":"Цель схвачена.","duration":"Концентрация","range":"","cost":"15 или более Фокуса","effect":"Персонаж совершает атаку Эго против схваченной цели. При успехе, он удаляет все способности цели и забирает их себе. Теперь персонаж может их использовать, будто они всегда ему принадлежали. Если у способностей цели есть стоимость, персонаж должен потратить максимальную, или минимум 15 Фокуса. Когда персонаж использует способность, он должен потратить обычную стоимость тоже.","page":121},{"name":"Шаги на Ходулях","en":"Stilt Steps","flavor":"Персонаж может растянуть ноги как увеличивающиеся ходули.","group":"Пластичность","prereq":"Увеличенная досягаемость 1, Ранг 2","action":"Движение","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Скорость бега и Скорость Карабкания персонажа удваивается.","page":121},{"name":"Останавливающая Сила","en":"Stopping Power","flavor":"Персонаж продолжает стрелять в цель.","group":"Оружие Дальнего Боя","prereq":"Двойной Выстрел, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Ловкости по цели. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе, враг получает двойной урон, и персонаж может совершить другую обычную атаку ловкости по этой же цели.","page":121},{"name":"Прочность 1","en":"Sturdy","flavor":"У персонажа защита от физического урона.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона Здоровью 1.","page":122},{"name":"Прочность 2","en":"","flavor":"Персонаж словно защищён сталью.","group":"Основные","prereq":"Прочность 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона Здоровью 2.","page":122},{"name":"Прочность 3","en":"","flavor":"Персонаж защищён как танк.","group":"Основные","prereq":"Прочность 2, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона Здоровью 3.","page":122},{"name":"Прочность 4","en":"","flavor":"Персонаж защищён как боевой корабль.","group":"Основные","prereq":"Прочность 3, Ранг 4","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает Уменьшение Множителя Урона Здоровью 4.","page":122},{"name":"Призвать Портал","en":"Summon Portal","flavor":"Персонаж открывает портал между пространством и измерениями.","group":"Магия","prereq":"Чародей, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж открывает светящийся портал в пространстве рядом, который передвигает всё, что проходит через это пространство, в другой портал, который открывается в другом месте. Другой портал должен быть в любом месте мультивселенной, которое персонаж видел. Что угодно может проходить сквозь портал в любом направлении, пока портал не закроется, что персонаж может сделать по желанию.","page":122},{"name":"Сверхновая","en":"Supernova","flavor":"Персонаж взрывается массивным потоком энергии своего элемента.","group":"Контроль Элементов","prereq":"Элементальный Выстрел, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 или более Фокуса","effect":"Персонаж совершает проверку Эго против защиты Выносливости каждого врага в пределах 10 пространств. Для этих атак добавьте +1 к бонусу урона Эго за каждые 2 очка фокуса, что персонаж тратит. При успехе, выбранные цели получают по половине этого урона. При Фантастическом Успехе, выбранные цели получают полный урон и специальный эффект элемента.","page":123},{"name":"Огонь на Подавление","en":"Suppresive Fire","flavor":"Персонаж заставляет врагов оставаться в укрытии.","group":"Оружие Дальнего Боя","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж совершает атаку Ловкости против защиты Бдительности цели. Если атака успешна, применяется Уменьшение Множителя Урона, как обычно. Любой наносимый урон вместо этого наносится Фокусу цели. При Фантастическом Успехе, урон удваивается, и если цель получает какой-либо урон по Фокусу, она оглушается на один раунд.","page":123},{"name":"Забрать Способность","en":"Swipe Power","flavor":"Персонаж удаляет способность цели и забирает себе!","group":"Контроль Способностей","prereq":"Копировать Способность, Ослабить Способность, Ранг 3","action":"Обычное или реакция","trigger":"Цель схвачена.","duration":"Концентрация","range":"","cost":"10 или более Фокуса","effect":"Персонаж совершает атаку Эго против схваченной цели. При успехе, он удаляет способность цели и забирает её себе. Теперь персонаж может её использовать, будто она всегда ему принадлежала. Если у способности цели есть стоимость, персонаж должен потратить её, или минимум 10 Фокуса. Когда персонаж использует способность, он должен потратить обычную стоимость тоже.","page":123},{"name":"Телекинетическая Атака","en":"Telekinetic Attack","flavor":"Персонаж может ударить или придушить врага своим разумом.","group":"Телекинез","prereq":"Телекинетическая Манипуляция, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"Варьируется","cost":"5 Фокуса","effect":"Персонаж совершает атаку Логики против защиты Силы цели на расстоянии 5 пространств за ранг. Если атака успешна, цели наносится обычный урон. При Фантастическом Успехе, враг получает двойной урон и оглушается на один раунд. СПОСОБНОСТИ","page":123},{"name":"Телекинетический Барьер","en":"Telekinetic Barrier","flavor":"Персонажсоздаёт защитный барьер своим разумом.","group":"Телекинез","prereq":"Телекинетический Захват, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж формирует невидимую стену в зоне видимости на расстоянии до 10 пространств на ранг, покрывая 2 пространства подряд (горизонтально или вертикально.) на ранг. Персонаж совершает проверку Логики и сравнивает с защитой Ловкости каждой цели в задействованных пространствах. При успехе, персонаж выбирает, с какой стороны барьера цель окажется. При провале — выбирает цель. При Фантастическом Успехе, цель также парализуется на раунд. Атаки против барьера равны атакам против защиты Логики персонажа. Любая атака против барьера, которая наносит 10 урона или меньше — мгновенно поглощается и барьер продолжает стоять. Если атака наносит больше 10 урона, она уничтожает барьер. В любом случае, атака не проходит по целям за барьером.","page":123},{"name":"Телекинетическое Крушение","en":"Telekinetic Crush","flavor":"Персонаж ментально сдавливает врага.","group":"Телекинез","prereq":"Телекинетический Захват, Ранг 3","action":"Реакция","trigger":"Цель схвачена.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж совершает атаку Логики против защиты Выносливости схваченной цели. Если атака успешна, цели наносится обычный урон. При Фантастическом Успехе, враг получает двойной урон и он прижат.","page":123},{"name":"Телекинетический Захват","en":"Telekinetic Grab","flavor":"Персонаж может схватить врага своим разумом.","group":"Телекинез","prereq":"Телекинетическая Манипуляция, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"Варьируется","cost":"5 Фокуса","effect":"Персонаж совершает проверку Логики против защиты Силы цели на расстоянии 5 пространств за ранг. Если атака успешна, персонаж хватает цель своим разумом. При Фантастическом Успехе, цель может быть прижата. Чтобы вырваться, нужна проверка силы со сложностью 20.","page":123},{"name":"Телекинетическая Манипуляция","en":"Telekinetic Manipulation","flavor":"Персонаж может держать физические вещи своим разумом.","group":"Телекинез","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"Варьируется","cost":"","effect":"Персонаж может управлять объектами в зоне видимости своими мыслями. Максимальная дистанция этой способности — 5 пространств на ранг персонажа. Если кто-то пытается помешать персонажу взять контроль над объектом, персонаж совершает проверку Логики против защиты Ловкости оппонента.","page":123},{"name":"Телекинетическая Защита 1","en":"","flavor":"(Telekinetic Protection) Персонаж использует силу мысли, чтобы физически себя защитить.","group":"Телекинез","prereq":"Телекинетический Барьер, Ранг 2","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности.","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Телекинетическое личное поле Персонажа защищает его. Любая атака против него, которая наносит 10 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 10 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":124},{"name":"Телекинетическая Защита 2","en":"","flavor":"Персонаж противопоставляет свой разум против физического урона.","group":"Телекинез","prereq":"Телекинетическая Защита 1, Ранг 3","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Телекинетическое личное поле Персонажа защищает его. Любая атака против него, которая наносит 20 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 20 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":124},{"name":"Телекинетическая Защита 3","en":"","flavor":"Разум персонажа защищает его, как танк.","group":"Телекинез","prereq":"Телекинетическая Защита 2, Ранг 4","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Телекинетическое личное поле Персонажа защищает его. Любая атака против него, которая наносит 30 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 30 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":124},{"name":"Телекинетическая Защита 4","en":"","flavor":"Разум персонажа защищает его, как крепость.","group":"Телекинез","prereq":"Телекинетическая Защита 3, Ранг 5","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности.","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Телекинетическое личное поле Персонажа защищает его. Любая атака против него, которая наносит 40 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 40 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":125},{"name":"Телекинетическое Укрепление","en":"Telekinetic Reinforcement","flavor":"Персонаж укрепляет защиту своим разумом.","group":"Телекинез","prereq":"Телекинетическая Защита 1","action":"Реакция","trigger":"Урон проходит сквозь защитную телекинетическую способность (Вроде защиты, сферы или барьера.).","duration":"Мгновенная","range":"","cost":"Варьируется","effect":"Персонаж может перенаправить весь урон выше телекинетической защиты на свой фокус, чтобы сохранить защиту.","page":125},{"name":"Телекинетическая Сфера","en":"Telekinetic Sphere","flavor":"Персонаж создаёт защитную сферу своим разумом.","group":"Телекинез","prereq":"Телекинетическая Защита 1","action":"Обычное или Реакция","trigger":"Персонаж атакован или иначе подвержен опасности.","duration":"Концентрация","range":"","cost":"Равна стоимости Телекинетической Защиты Персонажа","effect":"Персонаж укрывает себя и выбранных людей на 5 пространств от ранга защищающей телекинетической сферой. Когда сфера сформирована, персонаж делает проверку Логики и сравнивает результат с защитой Ловкости тех, кого в сфере держать он не хочет. При успехе, персонаж может их передвинуть за пределы периметра сферы. При Фантастическом Успехе, они также получают полный урон. Атаки против сферы сравниваются с защитой Логики персонажа. Атаки против сферы равны атакам против Телекинетической Защиты. Если атака наносит больше урона, чем может поглотить Телекинетическая Защита персонажа, сфера уничтожается, Никто внутри не получает урон.","page":125},{"name":"Телекинетический Бросок","en":"Telekinetic Toss","flavor":"Персонаж может бросить врага своим разумом.","group":"Телекинез","prereq":"Телекинетический Захват, Ранг 3","action":"Реакция СПОСОБНОСТИ","trigger":"Цель схвачена","duration":"Мгновенная","range":"Варьируется","cost":"10 Фокуса","effect":"Персонаж может силой мысли бросить цель, которая в Телекинетическом захвате, в другую цель. Дистанция — 5 пространств за ранг персонажа. Персонаж совершает проверку Логики против защиты Ловкости цели. Провал наносит обычный урон брошенному, он лежит на расстоянии 1 от цели. При успехе, цели также наносится обычный урон. При Фантастическом Успехе, цель также лежит.","page":125},{"name":"Телепатический Выстрел","en":"Telepathic Blast","flavor":"Персонаж ментально ударяет разум врага.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Логики против цели в зоне видимости. Если атака успешна, цели наносится обычный урон по Фокусу. При Фантастическом Успехе, цели наносится двойной урон и она оглушается на раунд.","page":125},{"name":"Телепатическая Связь","en":"Telepathic Link","flavor":"Персонаж может говорить с другим телепатически.","group":"Телепатия","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж может телепатически общаться с одной целью за раз, и он должен был встретить цель или хотя бы видеть до этого. Общение может проходить вербально, визуально или даже более сложно, вроде передачи информации о локации. На дистанцию общения нет ограничения, до тех пор, пока персонаж и цель находятся в одном измерении. Если цель не хочет говорить с персонажем, цель может автоматически отключиться. Чтобы форсировать телепатическую связь, персонаж совершает проверку Логики против защиты Бдительности цели. При провале, персонаж не может повторять попытки связаться с целью этим способом до конца дня. При успехе, персонаж может общаться с целью, пока держит концентрацию. При Фантастическом Успехе, цель не может заткнуть персонажа до конца дня.","page":125},{"name":"Телепатическая Сеть","en":"Telepathic Network","flavor":"Персонаж может говорить телепатически с группой людей.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж может телепатически общаться с группой желающих, ранее связанных людей, каждого из которых он встречал или видел ранее. Общение может проходить вербально, визуально или даже более сложно, вроде передачи информации о локации. Группа может достигать 5-и человек на ранг. На дистанцию общения нет ограничения, до тех пор, пока персонаж и цели находятся в одном измерении.","page":125},{"name":"Телепатическое Овладение","en":"Telepathic Possession","flavor":"Персонаж ментально захватывает тело кого-то другого.","group":"Телепатия","prereq":"Приказы, Ранг 5","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"20 Фокуса","effect":"Персонаж совершает проверку Логики с помехой против защиты Логики цели, у которой не осталось Фокуса и с которым у Персонажа установлена Телепатическая Связь. При успехе, персонаж полностью захватывает тело цели. Результат проверки Персонажа — сложность для любой проверки, чтобы прекратить овладение. Если персонаж собирается ранить кого-то одержимым телом — цель может сделать проверку Логики, чтобы прекратить овладение. Если у цели есть тег Героический, у неё будет преимущество на проверке. Если персонаж собирается ранить одержимое тело, цель получает преимущество на проверку. Если у цели есть тег Героический, у неё будет двойное преимущество. Также эту способность можно использовать, чтобы переместить разум Персонажа в цель без разума, вроде свежего клона или андроида, на всё время. Это не требует проверок, так как никто в теле действию Персонажа не препятствует.","page":126},{"name":"Телепорт 1","en":"Teleport","flavor":"Персонаж телепортируется куда-то ещё.","group":"Телепортация","prereq":"Скачок","action":"Обычное или движение","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж телепортируется на свободное пространство, которую видит или в котором уже бывал, до 10 пространств на ранг. Вне боя, персонаж может телепортироваться до 100 пространств на ранг.","page":126},{"name":"Телепорт 2","en":"","flavor":"Персонаж телепортируется на огромные дистанции.","group":"Телепортация","prereq":"Телепорт 1","action":"Обычное или движение","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Вне боя, персонаж может телепортироваться на 1000 пространств за ранг.","page":126},{"name":"Телепорт Вслепую","en":"Teleport Blind","flavor":"Персонаж телепортируется в новое для себя место.","group":"Телепортация","prereq":"Телепорт 1, Ранг 3","action":"Обычное или движение","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж телепортируется в какое-то место, где никогда не были и которое никогда не видели, вплоть до 10 пространств на ранг. Вне боя, он может телепортироваться на 100 пространств за ранг. Если цель внутри чего-то, когда телепортация заканчивается, она автоматически выталкивается, но получает урон от разрушения равный стандартной проверке действия. Множитель урона 1 на каждое пространств, которое персонаж должен пройти, чтобы достичь свободной зоны. Если это убивает его — его тело останется в материале, в который он телепортировался.","page":126},{"name":"Телепорт Объекта","en":"Teleport Object","flavor":"Персонаж может телепортировать что-то с собой.","group":"Телепортация","prereq":"Телепорт 1, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж может телепортировать с собой какойнибудь объект в пределах досягаемости так далеко, как позволяет его способность Телепорта. Объект (и вещи с ним соприкасающиеся или находящиеся внутри) могут быть больше размером на количество рангов. Например, если персонаж 4-го Ранга — объект может быть в 4 раза больше персонажа.","page":126},{"name":"Телепорт Другого","en":"Teleport Other","flavor":"Персонаж может телепортировать кого-то с собой.","group":"Телепортация","prereq":"Телепорт 2, Ранг 4","action":"Обычное или реакция","trigger":"Цель схвачена","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает проверку Эго против Бдительности цели в захвате. Если проверка успешна, персонаж может телепортировать цель так далеко, как ему позволяет его способность Телепорта в бою. Если цель внутри чего-то, когда телепортация заканчивается, она автоматически выталкивается, но получает урон от разрушения равный стандартной проверке действия. Множитель урона 1 на каждое пространство, которое цель должна пройти, чтобы достичь свободной зоны. Если это убивает цель — её тело останется в материале, в который её телепортировали.","page":127},{"name":"Телепорт Вместе","en":"Teleport Together","flavor":"Персонаж может телепортировать кого-то, кого касается.","group":"Телепортация","prereq":"Телепорт 1, Ранг 3","action":"Обычное, действие или реакция","trigger":"Цель схвачена","duration":"—","range":"","cost":"10 Фокуса","effect":"Персонаж телепортируется, и берёт с собой любую цель, которой касается, в свободное пространств, которое видит или в котором был, на расстояние до 10 пространств за ранг. Вне боя, персонаж может телепортироваться до 100 пространств за ранг персонажа. Если цель не хочет телепортироваться — персонаж должен перед этим её схватить.","page":127},{"name":"Телепортал","en":"Teleportal","flavor":"Персонаж открывает портал в другое место.","group":"Телепортация","prereq":"Телепорт 1, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж открывает светящийся портал в пространстве рядом, который передвигает всё, что проходит через это пространство, в другой портал, который открывается в другом месте. Другой портал должен быть на свободном пространстве в другом месте, в котором персонаж был, до 10 пространств на ранг. Вне боя портал может телепортировать до 1000 пространств на ранг персонажа. Что угодно может проходить сквозь портал в любом направлении, пока портал не закроется, что персонаж может сделать по желанию.","page":127},{"name":"Гром","en":"Thunder","flavor":"Персонаж вызывает оглушительный треск грома.","group":"Контроль Погоды","prereq":"Никаких","action":"Обычное СПОСОБНОСТИ","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж совершает проверку Эго и сравнивает её с защитой Выносливости каждого персонажа на расстоянии 10 пространств. Каждый персонаж, по которому прошла атака — глухой. При Фантастическом Успехе, задействованные цели также оглушаются на один раунд.","page":127},{"name":"Тайм-Аут","en":"Time-Out","flavor":"Персонаж останавливает время.","group":"Омнивселенские Путешествия","prereq":"Повторный Показ, Ранг 4","action":"Обычное или Реакция","trigger":"Персонажа или союзника атакуют.","duration":"1 раунд на ранг","range":"","cost":"15 Фокуса за раунд","effect":"Персонаж замораживает время для всех, кроме себя. В это время, он может действовать обычно, пока остальные замирают на месте. Персонаж может выбрать, активировать способность на максимальную Продолжительность, или прекратить в любой момент. В любом случае, он должен потратить стоимость Фокуса за каждый раунд. Например, персонаж 6 ранга использует Тайм-Аут в качестве действия и тратит 30 Фокуса на активацию за два раунда. Он может совершать обычное количество действий, реакций и движения, пока другие персонажи не могут совершать действия, реакции или движение, пока не пройдут 2 раунда.","page":127},{"name":"Тайм-Аут в Пузыре","en":"Time-Out Bubble","flavor":"Персонаж и союзники движутся вне времени.","group":"Омнивселенские Путешествия","prereq":"Тайм-Аут, Ранг 4","action":"Обычное или Реакция","trigger":"Персонажа или союзника атакуют.","duration":"1 раунд на ранг","range":"","cost":"15 Фокуса за раунд","effect":"Персонаж создаёт временной пузырь, который действует для него и для выбранных союзников в радиусе одного пространства за ранг. В пузыре, персонаж и эти союзники могут действовать обычно, пока остальные замирают на месте. Персонаж может выбрать, активировать способность на максимальную Продолжительность, или прекратить в любой момент. В любом случае, он должен потратить стоимость Фокуса за каждый раунд.","page":127},{"name":"Тайм-Аут в Касании","en":"Time-Out Tag","flavor":"Персонаж замораживает кого-то или что-то во времени.","group":"Омнивселенские Путешествия","prereq":"Тайм-Аут, Ранг 4","action":"Обычное или Реакция","trigger":"Персонажа или союзника атакуют.","duration":"1 раунд на ранг","range":"","cost":"15 Фокуса за раунд","effect":"Персонаж замораживает время для кого-то или чегото в пределах досягаемости. Все остальные действуют как обычно. Если цель не хочет быть заморожена, персонаж должен предварительно её схватить. Персонаж может выб
