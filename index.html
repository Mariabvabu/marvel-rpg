:"Тёмное Измерение","history":"Изгнанный из мистического царства, известного как Фалтин, Дорммаму вместе со своей семьёй в одиночку покорил коренных обитателей Тёмного Измерения, превратив эту территорию в свою крепость. На протяжении бесчисленных веков Дорммаму постепенно вытеснял других членов своей семьи из власти, в итоге провозгласив себя единственным Лордом Тьмы. Будучи существом практически безграничной силы, Дорммаму стремился покорить всю реальность. Его завоевания были остановлены лишь древней линией Верховных Чародеев. Однако время не охладило амбиции тёмного владыки. При поддержке своего слуги, барона Мордо, попытки Дорммаму по свержению Верховного Чародея в последние десятилетия стали ещё более частыми и опасными.","personality":"Будучи одним из самых умных и долгоживущих завоевателей за всю историю бытия, Дорммаму гордится своими победами и проявляет прагматизм в случае поражений. Он воспринимает каждое поражение лишь как незначительное препятствие на пути к своему вечному владычеству. Будучи настоящим оппортунистом, он всегда находит способ превратить неблагоприятную краткосрочную ситуацию в долгосрочное преимущество.","page":167},{"name":"Д Р А К С","realName":"Артур Сэмпсон Дуглас","rank":5,"karma":"5","hp":"210","hpDr":"-2","fp":"90","fpDr":"—","init":"+3","speeds":["Бег: 6","Лазание: 3","Плавание: 3","Прыжок: 3"],"size":"Средний","stats":{"Сила":{"score":8,"def":17,"nc":"10"},"Ловкость":{"score":4,"def":13,"nc":"+4"},"Выносливость":{"score":7,"def":17,"nc":"+7"},"Бдительность":{"score":3,"def":13,"nc":"+3"},"Эго":{"score":3,"def":13,"nc":"+3"},"Логика":{"score":0,"def":10,"nc":"0"}},"dmg":{"Сила":{"mult":7,"bonus":"8"},"Ловкость":{"mult":5,"bonus":"4"},"Эго":{"mult":5,"bonus":"3"},"Логика":{"mult":5,"bonus":"0"}},"traits":["Жёсткий","Большой (Досягаемость 2)","Боевой Эксперт","Связи: Супергерои","Бесстрашный","Честный","Не-Местный"],"tags":["Инопланетное Наследие","Доступ к Чёрному Рынку","Враг: Танос","Экстремальная Внешность","Героический","Публ инился к «Стражам Галактики». Однажды Дракс был убит, но воскрес в уменьшенной форме с ослабленными способностями. Позже он пожертвовал собой, чтобы спасти остальных членов «Стражей Галактики», однако его место занял клон, сохранивший все его воспоминания.","personality":"Изначально Дракс был мрачным и одержимым жаждой мести человеком. Хотя в миссиях он по-прежнему может быть суровым и серьёзным, с годами он стал гораздо легче относиться к жизни и начал получать удовольствие от сражений — просто ради адреналина. У Дракса своеобразное, тёмное чувство юмора. Оно обусловлено тем, что он имеет лишь поверхностное представление о законах общества, не до конца понимает, как работают шутки, и воспринимает вещи иначе, чем большинство людей — то, что других пугает, для него может казаться обыденным.","page":168},{"name":"Д Ь Я В О Л Ь С К И Й Д И Н О З А В Р","realName":"Дьявол","rank":3,"karma":"3","hp":"180","hpDr":"-1","fp":"60","fpDr":"—","init":"+2","speeds":["Бег: 25","Лазание: 13","Плавание: 13","Прыжок: 13"],"size":"Огромный","stats":{"Сила":{"score":6,"def":14,"nc":"+6"},"Ловкость":{"score":2,"def":10,"nc":"+2"},"Выносливость":{"score":6,"def":16,"nc":"+6"},"Бдительность":{"score":2,"def":12,"nc":"+2"},"Эго":{"score":1,"def":11,"nc":"+1"},"Логика":{"score":1,"def":11,"nc":"+1"}},"dmg":{"Сила":{"mult":5,"bonus":"6"},"Ловкость":{"mult":3,"bonus":"2"},"Эго":{"mult":3,"bonus":"1"},"Логика":{"mult":3,"bonus":"1"}},"traits":["Жёсткий","Берсерк","Связи: Чужаки","Бесстрашный","Свежий Взгляд","Не-Местный"],"tags":["Инопланетное Наследие","Экстремальная Внешность","Героический","Немой (Может только рычать)"],"powers":[{"group":"Основные","name":"Обострённые Чувства 1"},{"group":"Основные","name":"Прочность 1"},{"group":"Супер-Сила","name":"Избиение"},{"group":"Супер-Сила","name":"Разрушительная Хватка"},{"group":"Супер-Сила","name":"Сотрясающий Землю Топот"},{"group":"Супер-Сила","name":"Недвижим"},{"group":"Супер-Сила","name":"Быстрый Бросок"},{"group":"Супер-Сила","name":"Кр нному заключению на планете-тюрьме Халфворлд в Ключевом Квадранте. После того как Ракета покинул свой пост, он отправился в большой космос, где ввязался в сомнительные авантюры. Это привело его в тюрьму кри, где он встретил своего лучшего друга — Грута. Вместе они помогли сформировать команду «Стражи Галактики». Вместе с остальными Стражами Ракета спас галактику от уничтожения флотом инопланетян, известным как Фаланга. После этого они решили объединиться на постоянной основе, став не просто командой, а семьёй. Ракета даже брал на себя роль лидера команды в отсутствие Звёздного Лорда.","personality":"Ракета — хитрый и изворотливый, один из самых умных персонажей, особенно когда дело касается тактики и логистики. В его душе живёт тяга к воровству, и он всегда ищет способ решить любую проблему с максимальной выгодой для себя.","page":171},{"name":"Ж Е Л Е З Н Ы Й К У Л А К ( Д Э Н Н И Р Э Н Д )","realName":"Дэниел Томас «Дэнни» Рэнд","rank":3,"karma":"3","hp":"60","hpDr":"—","fp":"90","fpDr":"—","init":"+3","speeds":["Бег: 5","Лазание: 3","Плавание: 3","Прыжок: 3"],"size":"Средний","stats":{"Сила":{"score":4,"def":14,"nc":"+6"},"Ловкость":{"score":2,"def":12,"nc":"+2"},"Выносливость":{"score":2,"def":12,"nc":"+2"},"Бдительность":{"score":3,"def":13,"nc":"+3"},"Эго":{"score":3,"def":13,"nc":"+3"},"Логика":{"score":1,"def":11,"nc":"+1"}},"dmg":{"Сила":{"mult":5,"bonus":"4"},"Ловкость":{"mult":3,"bonus":"2"},"Эго":{"mult":3,"bonus":"3"},"Логика":{"mult":3,"bonus":"1"}},"traits":["Боевой Эксперт","Боевые Рефлексы","Связи: Супергерои","Решительный","Экстраординарное Происхождение","Бесстрашный","Коронная Атака: Сфокусированный Удар"],"tags":["Доступ к Чёрному Рынку","Героический","Публичная Личность","Сверхъестественный"],"powers":[{"group":"Обычные","name":"Мощь 2"},{"group":"Боевые Искусства","name":"Боевая Стойка"},{"group":"Боевые Искусства","name":"Цепные Удары"},{"group":"Боевые Искусства","name":"Техника Контратаки"},{"group":"Боевые Искусства","name":"Оборонительная  экспериментального космического полёта, который возглавлял Рид Ричардс — парень его старшей сестры Сью. Вскоре после взлёта Шторм и остальной экипаж подверглись воздействию космических лучей, которые наделили каждого из них фантастическими способностями. Вместе они сформировали Фантастическую четвёрку и поклялись использовать свои новые силы на благо всего человечества. В образе Человека-Факела Шторм контролирует силы тепла и пламени. Он способен мгновенно воспламеняться, выпускать пламя из рук, летать и даже принимать сверхгорячую форму «новой звезды» в моменты крайней необходимости.","personality":"Несмотря на добрую сущность, Джонни Шторм всегда был вспыльчивым по натуре. Ситуация не улучшается тем, что, будучи самым молодым членом Фантастической четвёрки, он с трудом воспринимается всерьёз своими товарищамиискателями приключений. Отчасти это может быть связано с тем, что он обожает подшучивать и разыгрывать своего старшего и ворчливого товарища по команде — Существо.","page":253},{"name":"Ч Ё Р Н А Я В Д О В А ( Н А Т А Ш А Р О М А Н О В А )","realName":"Наташа Романова","rank":3,"karma":"3","hp":"60","hpDr":"—","fp":"90","fpDr":"—","init":"+3","speeds":["Бег: 5","Лазание: 3","Плавание: 3","Прыжок: 3"],"size":"Средний","stats":{"Сила":{"score":2,"def":12,"nc":"+2"},"Ловкость":{"score":4,"def":14,"nc":"+4"},"Выносливость":{"score":2,"def":12,"nc":"+2"},"Бдительность":{"score":3,"def":13,"nc":"+3"},"Эго":{"score":4,"def":14,"nc":"+4"},"Логика":{"score":1,"def":11,"nc":"+1"}},"dmg":{"Сила":{"mult":3,"bonus":"2"},"Ловкость":{"mult":3,"bonus":"4"},"Эго":{"mult":3,"bonus":"4"},"Логика":{"mult":3,"bonus":"1"}},"traits":["Привлекательный","Связи: Шпионаж","Решительный","Акробат","Наседающий","Пронырливый"],"tags":["Доступ к Чёрному Рынку","Героический","Публичная Личность","Лингвист: Китайский Английский Французский Немецкий Японский Русский"],"powers":[{"group":"Основные","name":"Воодушевление"},{"group":"Основные","name":"В Замедлении Уклонение"},{"group":"Боевые Иск превращаться в кристаллическую форму. Эта форма даёт ей способности Мощь 1 и Прочность 2. В этой форме она не может использовать способности Гениальность 1 , Телепатия и Контроль Способностей. Способность Поразительный 2 доступна ей в обеих формах. Числа перед косой чертой относятся к её обычной человеческой форме, а числа после косой черты — к кристаллической форме.","page":262},{"name":"Э Х О","realName":"Майя Лопес","rank":2,"karma":"2","hp":"30","hpDr":"—","fp":"60","fpDr":"—","init":"+2","speeds":["Бег: 5","Лазание: 3","Плавание: 3","Прыжок: 3"],"size":"Средний","stats":{"Сила":{"score":2,"def":12,"nc":"+2"},"Ловкость":{"score":3,"def":13,"nc":"+3"},"Выносливость":{"score":1,"def":11,"nc":"+1"},"Бдительность":{"score":2,"def":12,"nc":"+2"},"Эго":{"score":1,"def":11,"nc":"+1"},"Логика":{"score":1,"def":11,"nc":"+1"}},"dmg":{"Сила":{"mult":2,"bonus":"2"},"Ловкость":{"mult":2,"bonus":"3"},"Эго":{"mult":2,"bonus":"1"},"Логика":{"mult":2,"bonus":"1"}},"traits":["Боевые Рефлексы","Решительный","Знаменитый","Умеющий Привлечь Внимание","Оратор","Неожиданная Способность: Клонировать Движения"],"tags":["Нехватка Слуха","Героический","Публичная Личность"],"powers":[{"group":"Основные Боевы","name":"Боевая Хитрость ● Боев"},{"group":"Основные Боевы","name":"Цепн"},{"group":"Основные Боевы","name":"Техн"},{"group":"Основные Боевы","name":"Обор"},{"group":"Основные Боевы","name":"Быст"},{"group":"Основные Боевы","name":"Подс"}],"occupation":"Артист","origin":"Специальная Подготовка","teams":"Мстители, Дочери Свободы","location":"Гора Мстителей","history":"Когда Майя Лопес была ребёнком, её отца застрелил его собственный босс — Уилсон Фиск (Кингпин). Заметив потенциал юной девушки, Фиск взял её под своё крыло, провёл специальную подготовку и в итоге убедил её, что убийцей её отца был Сорвиголова. После нескольких сражений с Человеком Без Страха Майя раскрыла обман Кингпина и повернула оружие против него. Отомстив, она стала неутомимым борцом за справедливость по всему миру.","personality":"Майя — глухая женщина и представительница народа чейеннов, и на её долю выпало немало испытаний. Тем не менее ей обычно удаётся сохранять оптимизм. У Майи особая любовь к театральному искусству: она стала концертирующей пианисткой и опытной танцовщицей.","page":263}],"powers":[{"name":"Точность 1","en":"Accuracy","flavor":"Персонаж ас атак дальнего боя.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет 1 к множителю урона по Ловкости и 1 к небоевым проверкам ловкости.","page":81},{"name":"Точность 2","en":"","flavor":"Персонаж великолепный стрелок.","group":"Основные","prereq":"Точность 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет 2 к множителю урона по Ловкости и 2 к небоевым проверкам ловкости.","page":81},{"name":"Точность 3","en":"","flavor":"Персонаж может сбить муху с сотни метров.","group":"Основные","prereq":"Точность 2, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет 3 к множителю урона по Ловкости и 3 к небоевым проверкам ловкости.","page":82},{"name":"Точность 4","en":"","flavor":"Персонаж превосходит почти любого","group":"Основные","prereq":"Точность 3, Ранг 4","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет 4 к множителю урона по Ловкости и 4 к небоевым проверкам ловкости.","page":82},{"name":"Дополнительные Конечности","en":"Additional Limbs","flavor":"У персонажа есть дополнительные конечности, которыми он может хватать объекты и атаковать врагов.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"У персонажа есть дополнительная хватательная конечность (вроде хвоста.) или их симметричная пара (например, рук), которые можно использовать, чтобы поднимать предметы или инструменты, которые обычно требуют использование руки. Даёт преимущество в проверках Силы и Ловкости. У персонажа может быть дополнительных конечностей сколько пожелает — обоснованно, но дополнительных преимуществ они не получат.","page":82},{"name":"Наступление","en":"Advance","flavor":"Персонаж может дать команду Наступать союзникам на поле боя.","group":"Тактика","prereq":"Сплотиться, Врассыпную, Ранг 4","action":"Реакция","trigger":"Персонаж (или союзник в зоне видимости.) оглушает или побеждает врага.","duration":"Один раунд","range":"","cost":"15 Фокуса","effect":"Все союзники в радиусе слышимости могут быть задействованы, до числа равному защите Эго персонажа. Каждый задействованный союзник может немедленно использовать бесплатно действие передвижения, чтобы приблизиться к врагу, который вызвал эту реакцию.","page":82},{"name":"Всегда Готов","en":"Always Ready","flavor":"Персонаж подготовлен к бою.","group":"Боевые Искусства","prereq":"Да Я Весь День Так Могу, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает дополнительную реакцию в раунде, которую можно использовать Только для способностей группы Боевые Искусства.","page":82},{"name":"Гнев","en":"Anger","flavor":"Тебе не понравится он в гневе.","group":"Основные","prereq":"Мощь 3, Ранг 4.","action":"Обычное или реакция","trigger":"Персонаж ранен атакой.","duration":"Концентрация","range":"","cost":"10 или более Фокуса","effect":"Персонажа охватывает гнев, и он использует его, чтобы увеличить силу. За каждые 10 очков Фокуса, которые персонаж потратит, он получает +15 к бонусу урона Силы и теряет 2 от логики, включая защиту по логике. При использовании этой способности, он не может использовать никакую другую, что требует концентрации.","page":82},{"name":"Связь с Животным","en":"Animal bond","flavor":"Персонаж может общаться с дружественным животным.","group":"Телепатия","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж может телепатически общаться с одним животным на выбор, и они должны быть друзьями. Он не может поменять животное, если только оно не умрёт, Но он может выбрать эту способность несколько раз, если есть такое желание. Общение может проходить вербально, визуально или даже более сложно, вроде передачи информации о локации. На дистанцию общения нет ограничения, до тех пор, пока персонаж и зверь находятся в одном измерении. Животные с телепатической связью, обычно, хотят общаться, даже если настроены недружелюбно. Связанные животные, обычно, делают всё, что персонаж попросит, даже если это для них опасно.","page":82},{"name":"Общение с Животными","en":"Animal Communication","flavor":"Персонаж может общаться с конкретным типом животных.","group":"Телепатия","prereq":"Никаких","action":"Обычное Очки показателей характеристик.","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж может общаться с одним порядком животных, вроде Птиц, Млекопитающих, Рыб, Амфибий и так далее. Персонаж может позвать их группу вплоть на расстоянии 500 пространств за ранг, и он может общаться с конкретными особями, которых встречали или хотя бы видели. Персонаж не может сменить порядок животных, но может выбрать эту способность несколько раз, если захочет. Общение может проходить вербально, визуально или даже более сложно, вроде передачи информации о локации. На дистанцию общения нет ограничения, до тех пор, пока персонаж и зверь находятся в одном измерении. Дружественные животные, обычно, делают всё, что попросит персонаж, до тех пор, пока это для них не опасно — но они могут рисковать, если считают персонажа другом. Враждебные животные попросту игнорируют подобные просьбы, что делает их не лучшим выбором для общения.","page":82},{"name":"Двигающаяся Иллюзия","en":"Animated Illusion","flavor":"Управляя видимым светом, персонаж создаёт двигающуюся голограмму.","group":"Иллюзия","prereq":"Статичная Иллюзия, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж создаёт визуальную иллюзию где угодно в радиусе видимости, на расстоянии 50 пространств. Иллюзия может быть чем угодно размером максимум в 4 раза больше персонажа, и может двигаться свободно в рамках ограничений. Персонаж нарушает концентрацию, если он отходит на 50 пространств от иллюзии или теряет её из виду.","page":83},{"name":"Астральная Форма","en":"Astral Form","flavor":"Персонаж может войти в Астральный План.","group":"Магия, Телепатия","prereq":"Чародей, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж может проецировать аватар в Астральный план, оставляя своё физическое тело в глубоком трансе, в реальном мире, где оно уязвимо к атакам. Пока персонаж в Астральном Плане, он может взаимодействовать с другими персонажами Астрального Плана, но в реальном мире они неосязамы, невидимы и обычно незаметны в реальном мире. Впрочем, персонаж может ощущать реальный мир. Если ранг персонажа 4 и выше, он также может принять прозрачную форму, чтобы его видели в реальном мире. В астральном плане персонаж может летать, в бою его скорость полёта равна рангу, умноженному на скорость бега. Вне боя он движется в 10 раз быстрее.","page":83},{"name":"Боевая Стойка","en":"Attack Stance","flavor":"Персонаж принимает агрессивную боевую стойку, готовый атаковать в любом направлении.","group":"Боевые Искусства","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж удваивает бонус урона Силы.","page":83},{"name":"Удар Головами","en":"Banging Heads","flavor":"Персонаж хватает двух ближайших врагов и ударяет их головами друг о друга.","group":"Боевые Искусства, Супер-Сила","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж делает проверку Силы против защиты Силы двух врагов в досягаемости. Если атака проваливается против любого из врагов — она проваливается в общем. Если атака успешна против обоих врагов, каждому из них наносится полный урон. При Фантастическом успехе, каждый из них Лежит.","page":83},{"name":"План Боя","en":"Battle Plan","flavor":"У персонажа всегда есть план","group":"Тактика","prereq":"Воодушевление, Ранг 2","action":"Обычное","trigger":"","duration":"1 раунд","range":"","cost":"10 Фокуса","effect":"Персонаж вдохновляет одного или более союзников на выбор, до Бдительности персонажа. Вдохновлённые союзники получают преимущество к проверкам действий вплоть до следующего хода персонажа.","page":84},{"name":"Сверкающе-Быстрые Кулаки","en":"Blazing-Fast Fists","flavor":"Персонаж может атаковать очень быстро.","group":"Супер-Скорость","prereq":"Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"У персонажа преимущество на всех атаках Силы.","page":84},{"name":"Скачок","en":"Blink","flavor":"Персонаж телепортируется на короткую дистанцию.","group":"Телепортация","prereq":"Никаких","action":"Обычное, движение или реакция","trigger":"Персонаж атакован.","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж телепортируется на свободное пространство, которое он может видеть или в которой был, на расстояние их ранга. Если кто-то собирался атаковать персонажа, но он вышел из зоны видимости — атака автоматически проваливается. Если персонаж всё ещё в зоне видимости, у атаки помеха.","page":84},{"name":"Скачок Заградительный","en":"Blink Barrage","flavor":"Персонаж быстро телепортируется вокруг противника.","group":"Телепортация","prereq":"Скачок, Ранг 2","action":"Обычное или Движение","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж быстро телепортируется несколько раз в свободное пространство, которое он видит или в котором был, на расстояние их ранга. Любая атака против него идёт с помехой на один раунд.","page":84},{"name":"Скачок Оборонительный","en":"Blink Defense","flavor":"Персонаж телепортируется на короткую дистанцию.","group":"Телепортация","prereq":"Скачок, Ранг 3","action":"Реакция","trigger":"Персонаж или союзник в досягаемости — цель дальней атаки.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж исчезает в момент, когда атака его достигает и возвращается в ту же точку, оставляя снаряд позади. Персонаж делает проверку Эго с преимуществом против результата проверки ловкости атакующего. В случае успеха, снаряд атаки телепортирован в безопасное место. При Фантастическом Успехе, атака оборачивается против атакующего, используя проверку Эго персонажа, как если бы он атаковал.","page":84},{"name":"Размытие","en":"Blur","flavor":"Персонаж движется так быстро, что кажется размытым.","group":"Супер-Скорость","prereq":"Скоростное Прохождение 2, Ранг 2","action":"Обычное или реакция","trigger":"Персонаж атакован.","duration":"1 раунд","range":"","cost":"5 Фокуса","effect":"Любая атака против персонажа идёт с помехой.","page":84},{"name":"Тело-Лист","en":"Body Sheet","flavor":"Персонаж может стать тонким как лист.","group":"Пластичность","prereq":"Гибкие Кости 2, Увеличенная Досягаемость 2, Ранг 4","action":"Обычное или реакция","trigger":"Персонаж падает или цель атаки. Очки показателей характеристик.","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж получает Уменьшение Множителя Урона Здоровью 3, но не может атаковать. Также они получают Скорость Планирования равное удвоенной Скорости Бега.","page":84},{"name":"Тело-Сфера","en":"Body Sphere","flavor":"Персонаж может принять форму сферы для защиты.","group":"Пластичность","prereq":"Тело-лист, Ранг 4","action":"Обычное или реакция","trigger":"Персонаж или союзник — цель атаки.","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж принимает форму сферы, защищая одного союзника за ранг, сжатого в это же пространство. Союзники внутри сферы получают Уменьшение Множителя Урона Здоровью 3 против атак снаружи, но не могут двигаться, пока персонаж их не отпустит. Другой вариант, если атакующий в досягаемости персонажа, персонаж может совершить проверку Ловкости против Защиты ловкости цели. В случае успеха, персонаж захватывает противника. При Фантастическом Успехе, персонаж достаточно сжимает сферу, чтобы противник был Прижат.","page":85},{"name":"Молнии Балтакка","en":"Bolts of Balthakk","flavor":"Персонаж выпускает заряженное электричество из пальцев.","group":"Магия","prereq":"Чародей, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"20 пространств","cost":"5 или более Фокуса","effect":"Персонаж делает проверку Эго с преимуществом против защиты Ловкости цели в зоне видимости. Для этой атаки, добавьте +1 к бонусу урона Эго персонажа за каждые 2 очка Фокуса, которые он потратил. В случае успеха, цель получает весь этот урон. При Фантастическом Успехе — урон удваивается и цель Оглушается на раунд.","page":85},{"name":"Усилить Способности","en":"Boost Powers","flavor":"Персонаж заряжает все способности другого персонажа!","group":"Контроль Способностей","prereq":"Прокачка Способности, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 или больше Фокуса","effect":"Персонаж выбирает персонажа на расстоянии 5 пространств и усиливает все его способности. Если у способности есть дистанция, зона поражения или продолжительность — они удвоены. Если способность влияет на множитель урона — добавьте 1 к эффекту. Все эффекты, которые обычно происходят при Фантастическом Успехе — автоматически происходят при любом успехе. Если у способностей цели есть стоимость, персонаж должен потратить максимальную, или минимум 15 фокуса. СПОСОБНОСТИ","page":85},{"name":"Заимствовать Ощущения","en":"Borrow Senses","flavor":"Персонаж может чувствовать, что чувствует другой.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж может полностью перенять ощущения кого-то, с кем у него есть телепатическая связь. Также сохраняются свои ощущения.","page":85},{"name":"Отскок Назад","en":"Bounce Back","flavor":"Персонаж отскакивает даже от жесточайшего падения.","group":"Пластичность","prereq":"Гибкие Кости 1, Выскользнуть, Ранг 2","action":"Реакция","trigger":"Персонаж получает урон от падения или его опрокинули.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Падение не наносит урон персонажу, если он упал — он встаёт. Если персонаж хочет, он также может прыгнуть на число пространств, равное скорости бега.","page":85},{"name":"Приготовиться к Удару","en":"Brace for Impact","flavor":"Персонаж морально готовится к бою.","group":"Боевые Искусства, Щитоносец","prereq":"Да Я Весь День Так Могу, Ранг 2","action":"Реакция","trigger":"Враг наносит физический урон персонажу.","duration":"Мгновенная","range":"","cost":"5 или более Фокуса","effect":"За каждое потраченное очко фокуса, персонаж может игнорировать одно очко урона, полученное от атаки.","page":85},{"name":"Утечка Мозгов","en":"Brain Drain","flavor":"Персонаж поглощает энергию другого.","group":"Магия","prereq":"Ранг 2","action":"Реакция","trigger":"Цель в захвате.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж делает атаку Эго против защиты Бдительности цели. При успехе, цель получает урон по Фокусу, и персонаж восстанавливает Фокус на половину этого значения. При Фантастическом Успехе, персонаж восстанавливает всё значение урона по Фокусу.","page":85},{"name":"Боец","en":"Brawling","flavor":"Персонаж умеет двигаться в бою и его сложно ударить.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может использовать защиту Силы против атак Ловкости тоже.","page":85},{"name":"Гениальность 1","en":"Brilliance","flavor":"Персонаж вкладывает мозги в работу.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет +1 к множителю урона логикой и получает +1 к небоевым проверкам логики.","page":86},{"name":"Гениальность 2","en":"","flavor":"Персонаж лучше всё понимает.","group":"Основные","prereq":"Гениальность 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет +2 к множителю урона логикой и получает +2 к небоевым проверкам логики.","page":86},{"name":"Гениальность 3","en":"","flavor":"Очень немногое может остановить разум персонажа.","group":"Основные","prereq":"Гениальность 2, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет +3 к множителю урона логикой и получает +3 к небоевым проверкам логики.","page":86},{"name":"Гениальность 4","en":"","flavor":"Интеллект персонажа не поддаётся сравнению.","group":"Основные","prereq":"Гениальность 3, Ранг 4","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж добавляет +4 к множителю урона логикой и получает +4 к небоевым проверкам логики. Прокачка Способности","page":86},{"name":"Очки показателей характеристик.","en":"Bump Power","flavor":"Персонаж прокачивает способность другого персонажа.","group":"Контроль Способностей","prereq":"Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 или больше Фокуса","effect":"Персонаж выбирает способность другого персонажа на расстоянии 5 пространств и усиливает её. Если у способности есть дистанция, зона поражения или продолжительности — они удвоены. Если способность влияет на множитель урона — добавьте 1 к эффекту. Все эффекты, которые обычно происходят при Фантастическом Успехе — автоматически происходят при любом успехе. Если у способности цели есть стоимость, персонаж должен её потратить или минимум 5 фокуса.","page":86},{"name":"Ловля Пуль","en":"Catch Bullets","flavor":"Персонаж достаточно быстрый, чтобы безопасно ловить пули.","group":"Супер-Скорость","prereq":"Скоростное Прохождение 2, Ранг 3","action":"Реакция","trigger":"Атака ловкости, которая использует физические снаряды (Стрелы, пули и так далее.), направленная против персонажа или другого персонажа в зоне досягаемости.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж делает проверку ловкости, используя результат атакующего как Сложность. Если проверка персонажа успешна, атака аннулируется. При Фантастическом Успехе, персонаж получает реакцию обратно.","page":87},{"name":"Цепные Удары","en":"Chain Strikes","flavor":"Персонаж обрушивает шквал ударов.","group":"Боевые Искусства","prereq":"Быстрые Удары, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Силы с преимуществом. Если атака успешна, враг получает обычный урон. При Фантастическом Успехе, персонаж может сделать дополнительный Цепной Удар (Фокус тратится каждый удар).","page":87},{"name":"Смена Планов","en":"Change of Plans","flavor":"Персонаж находит лучшее решение.","group":"Тактика","prereq":"Воодушевление, Ранг 2","action":"Реакция","trigger":"У союзника Помеха на проверке действия.","duration":"1 раунд","range":"","cost":"5 Фокуса","effect":"Союзник получает преимущество на эту проверку. .","page":87},{"name":"Завеса","en":"Cloak","flavor":"Персонаж заставляет людей верить, что его здесь нет.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж скрывает своё присутствие из разумов людей на расстоянии 20 пространств за ранг. Камеры, например, всё ещё могут его записать, но когда люди смотрят в направлении персонажа, они ничего не видят. Сложность для любого, кто пытается увидеть персонажа — защита Логики персонажа.","page":87},{"name":"Групповая Завеса","en":"Cloak Group","flavor":"Персонаж ментально прячет себя и друзей.","group":"Телепатия","prereq":"Завеса, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация Цена: 10 Фокуса","range":"","cost":"","effect":"Персонаж скрывает своё присутствие и присутствие другого персонажа, по одному за ранг, на расстоянии 10 пространств, от разумов людей на расстоянии 20 пространств за ранг. Камеры, например, всё ещё могут их записать, но когда люди смотрят в направлении персонажей, они ничего не видят. Сложность для любого, кто пытается увидеть персонажа или других защищённых — защита Логики персонажа.","page":87},{"name":"Избиение","en":"Clobber","flavor":"Персонаж бьёт врага с достаточной силой, чтобы его уронить.","group":"Супер-Сила","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж делает атаку Силы против врага. Если атака успешна, враг получает обычный урон. При Фантастическом Успехе, враг получает двойной урон и падает.","page":87},{"name":"Клонировать Движения","en":"Clone Moves","flavor":"Персонаж повторяет боевые движения другого персонажа.","group":"Контроль Способностей","prereq":"Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 или больше Фокуса","effect":"Персонаж выбирает другого персонажа на расстоянии 10 пространств в зоне видимости и повторяет их способности, которые можно выбрать с происхождением Специальная Подготовка. Он может использовать эти силы, как будто они всегда были его. Если у скопированных способностей есть стоимость, персонаж должен потратить наибольшую, или минимум 5 фокуса. Когда персонаж использует скопированную способность, он должен потратить обычную стоимость тоже.","page":87},{"name":"Клонировать Способности","en":"Clone Powers","flavor":"Персонаж повторяет все способности другого персонажа.","group":"Контроль Способностей","prereq":"Копировать Способность, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 или более Фокуса","effect":"Персонаж выбирает другого персонажа на расстоянии 10 пространств и копирует все его способности. Теперь он может использовать эти способности, как будто они всегда были его. Если у способностей цели есть цена, персонаж должен потратить наибольшую, или минимум 15 фокуса. Когда персонаж использует скопированную способность, он должен потратить обычную стоимость тоже.","page":87},{"name":"Спиральное Раздавливание","en":"Coiling Crush","flavor":"Персонаж оборачивается вокруг цели и давит её.","group":"Пластичность","prereq":"Увеличенная Досягаемость 1, Обратный Удар, Ранг 3","action":"Реакция СПОСОБНОСТИ Очки показателей характеристик.","trigger":"Персонаж хватает врага","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж совершает Атаку Силы. При успехе, враг парализован. При Фантастическом Успехе, враг также получает обычный урон. Во время следующих ходов, персонаж может потратить действие передвижения, чтобы сделать проверку Силы против вражеской Выносливости. При успехе, персонаж наносит обычный урон здоровью. При Фантастическом Успехе — двойной. Во время хода парализованного врага, он может сделать проверку Силы против защиты Силы персонажа, чтобы вырваться.","page":87},{"name":"Боевая Поддержка","en":"Combat Support","flavor":"Персонаж помогает другу.","group":"Тактика","prereq":"Смена Планов, Ранг 3","action":"Обычное","trigger":"","duration":"1 раунд","range":"","cost":"10 Фокуса","effect":"Раз за бой, персонаж выбирает союзника на расстоянии слышимости. Если союзник делает действие до начала следующего хода персонажа, союзник автоматически выбрасывает 1(Marvel) на своей кости Marvel, и на эту кость не влияют помехи.","page":89},{"name":"Боевая Хитрость","en":"Combat Trickery","flavor":"А персонаж хитрый.","group":"Основные","prereq":"Ранг 2","action":"Реакция","trigger":"Персонаж атакует.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Раз за бой, когда персонаж атакует цели равного или превосходящего ранга, персонаж автоматически пробрасывает 1(Marvel) на своей кости Marvel, и на эту кость не могут повлиять помехи. Если персонаж атакует несколько целей — все цели должны быть равного или превосходящего ранга. .","page":89},{"name":"Команда","en":"Command","flavor":"Персонаж заставляет кого-то следовать приказу.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"1 раунд","range":"","cost":"5 Фокуса","effect":"Персонаж отдаёт приказ цели, с которым у них есть Телепатическая Связь. Персонаж делает проверку логики против защиты логики цели. При успехе, цель выполняет приказ. При Фантастическом Успехе, у персонажа будет преимущество в следующий раз, когда он использует эту способность против этой же цели. Приказ должен быть чем-то, что можно выполнить за одно действие. Если он подразумевает вред кому-то, у персонажа на проверку помеха. Если подразумевает вред цели, у персонажа двойная помеха. СПОСОБНОСТИ","page":89},{"name":"Контроль Тумана","en":"Control Fog","flavor":"Персонаж может создать или убрать густой туман.","group":"Контроль Погоды","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж создаёт густой туман на 50 пространств за ранг вокруг себя, который блокирует зону видимости до десяти пространств. Также персонаж может отменить любой туман в схожей области.","page":89},{"name":"Контроль Погоды 1","en":"Control Weather","flavor":"Персонаж может вызвать дождь","group":"Контроль Погоды","prereq":"Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Начинает идти дождь в зоне до пяти миль на ранг персонажа, с центром от персонажа. Все дистанции сокращены вдвое, на передвижение влияния нет.","page":89},{"name":"Контроль Погоды 2","en":"","flavor":"Персонаж вызывает грозу.","group":"Контроль Погоды","prereq":"Контроль Погоды 1, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса.","effect":"Начинается гроза в области до пяти миль на ранг персонажа, с центром от персонажа. Все дистанции и скорости сокращены вдвое.","page":89},{"name":"Контроль Погоды 3","en":"","flavor":"Персонаж вызывает грозовой шторм.","group":"Контроль Погоды","prereq":"Контроль Погоды 2, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Начинается гроза в области до пяти миль на ранг персонажа, с центром от персонажа. Все дистанции и скорости сокращены вдвое. Если у персонажа также есть способность Элементальный выстрел (Электричество), он может использовать её как реакцию, когда его атакуют во время действия способности.","page":89},{"name":"Контроль Погоды 4","en":"","flavor":"Персонаж вызывает ураган.","group":"Контроль Погоды","prereq":"Контроль Погоды 3, Ранг 5","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"20 Фокуса","effect":"Начинается гроза в области до пяти миль на ранг персонажа, с центром от персонажа. Все дистанции и скорости сокращены вчетверо, а летать становится невозможно. Если у персонажа также есть способность Элементальный выстрел (Электричество), он может использовать её как реакцию, когда его атакуют во время действия способности.","page":89},{"name":"Копировать Характеристику","en":"Copy Ability","flavor":"Персонаж копирует характеристику другого персонажа","group":"Контроль Способностей","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж выбирает одну характеристику другого персонажа на расстоянии 10 пространств и копирует её. Теперь он использует её, как будто она была его.","page":90},{"name":"Копировать Способность","en":"Copy Power","flavor":"Персонаж дублирует способность другого персонажа.","group":"Контроль Способностей","prereq":"Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж выбирает одну способность цели на расстоянии 10 пространств и копирует её. Теперь он использует её, как будто она всегда была его. Когда персонаж использует эту способность, он должен потратить обычную стоимость тоже.","page":90},{"name":"Копировать Черту","en":"Copy Trait","flavor":"Персонаж дублирует черту другого персонажа.","group":"Контроль Способностей","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж выбирает одну черту цели на расстоянии 10 пространств и копирует её. Теперь он использует её, как будто она всегда была его.","page":90},{"name":"Техника Контратаки","en":"Counterstrike Technique","flavor":"Персонаж отвечает на вражескую атаку своей.","group":"Боевые Искусства","prereq":"Боевая Стойка, Ранг 2","action":"Реакция","trigger":"Пока активна Боевая Стойка, персонаж получает урон.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж наносит половину урона атакующего обратно атакующему.","page":90},{"name":"Огневое Прикрытие","en":"Covering Fire","flavor":"Персонаж прикрывает атаку союзника.","group":"Оружие Дальнего Боя","prereq":"Ответный Огонь, Ранг 3","action":"Реакция","trigger":"Союзник в зоне видимости начинает ход.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж делает атаку Ловкости против защиты Бдительности цели. Если атака успешна, добавьте цели -1 Уменьшение Множителя Урона По Здоровью. К урону по фокусу это не относится. При Фантастическом Успехе, урон удваивается, а если цель получает урон по Фокусу — она оглушена на один раунд.","page":90},{"name":"Багряные Ленты Цитторака","en":"Crimson Bands of Cyttorak","flavor":"Персонаж выпускает красные ленты магии, которые захватывают цель.","group":"Магия","prereq":"Чародей, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"20 пространств","cost":"10 Фокуса","effect":"Персонаж делает проверку Эго с преимуществом против защиты Силы цели в зоне видимости. При успехе, багряные ленты парализуют цель. При Фантастическом Успехе, она прижата. Чтобы вырваться, цель должна совершить проверку Силы на Сложность 20.","page":90},{"name":"Разрушительная Хватка","en":"Crushing Grip","flavor":"Персонаж хватает врага и сильно сжимает.","group":"Боевые Искусства, Супер-Сила","prereq":"Ранг 2","action":"Реакция","trigger":"Цель захвачена.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Силы против защиты Выносливости схваченной цели. При успехе, цель получает обычный урон. При Фантастическом Успехе, цель получает двойной урон и становится прижата.","page":90},{"name":"Ослабить Способность","en":"Dampen Power","flavor":"Персонаж ослабляет способность другого персонажа. Очки показателей характеристик.","group":"Контроль Способностей","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"Варьируется","effect":"Персонаж выбирает способность другого персонажа на расстоянии 20 пространств и делает атаку Эго против него. При успехе, персонаж ослабляет способность цели. Если у способности есть дистанция, зона действия или Продолжительность, они уменьшаются вдвое. Если способность влияет на множитель урона, эффект ослабляется на 1. Способность не может получать Фантастический Успех. Если у способности есть стоимость Фокуса, персонаж должен её потратить для ухудшения.","page":90},{"name":"Танец Смерти","en":"Dance of Death","flavor":"Персонаж вращается и стреляет в каждого врага вокруг.","group":"Оружие Дальнего Боя","prereq":"В Замедлении Стрельба-Уклонение, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж делает проверку Ловкости и сравнивает с защитой Ловкости каждого врага на расстоянии 5 пространств и в зоне видимости. Каждый успех наносит половину обычного урона. При Фантастическом Успехе, каждая цель получает полный урон и кровотечение.","page":90},{"name":"Тьма","en":"Darkness","flavor":"Цель окружается неестественной тьмой.","group":"Иллюзия","prereq":"Освещение, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Область до пяти пространств в диаметре на ранг персонажа, с центром где персонаж пожелает, на расстоянии 50 пространств — покрыта непроглядной тьмой. Те, кто внутри, ничего не могут видеть, и источники света не работают, за исключением способностей. Персонаж должен оставаться в пределах 50 пространств от зоны действия, чтобы не прерывать концентрацию.","page":91},{"name":"Слепота","en":"Dazzle","flavor":"Персонаж выпускает ослепительный свет в лицо своему врагу.","group":"Иллюзия","prereq":"Освещение, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"20 пространств","cost":"5 фокуса СПОСОБНОСТИ","effect":"Персонаж делает проверку Эго против врага в зоне видимости и сравнивает её с защитой Бдительности цели. Если атака успешна, цель ослеплена на 1 ход. При Фантастическом Успехе, она также получает обычный урон. Альтернативно, персонаж может ослепить жертву тьмой.","page":91},{"name":"Глухота","en":"Deafen","flavor":"Цель персонажа ничего не слышит.","group":"Иллюзия","prereq":"Освещение, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"20 пространств","cost":"5 Фокуса","effect":"Персонаж делает проверку Эго против врага в зоне видимости и сравнивает её с защитой Бдительности цели. Если атака успешна, на цель накладывается глухота на один ход. При Фантастическом Успехе, она также получает обычный урон.","page":91},{"name":"Оборонительная Стойка","en":"Defense Stance","flavor":"Персонаж принимает защитную стойку, руки готовы парировать и атаковать.","group":"Боевые Искусства","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Все атаки против персонажа проходят с помехой, до первого успеха в бою.","page":91},{"name":"Межизмеренческий Портал","en":"Dimensional Portal","flavor":"Персонаж открывает портал в другое место.","group":"Омнивселенские Путешествия","prereq":"Межизмеренческое Перемещение Вместе, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж открывает светящийся портал в пространстве рядом, который передвигает всё, что проходит через это пространство, в другой портал, который открывается в другом месте. Другой портал должен быть на свободном пространстве в другом измерении, в котором персонаж был. Что угодно может проходить сквозь портал в любом направлении, пока портал не закроется, что персонаж может сделать по желанию.","page":92},{"name":"Межизмеренческое Перемещение","en":"Dimensional Travel","flavor":"Персонаж перемещается из одного измерения в другое.","group":"Омнивселенские Путешествия","prereq":"Ранг 3","action":"Обычное или движение","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж мгновенно перемещается из текущего измерения в другое, в этой же вселенной. Например: Из Земли в Асгард, Лимбо или К'унь-Лунь. Когда персонаж движется в другое измерение, он может появиться в любом месте, где уже бывал. В ином случае, он появляется в наиболее распространённом входе в это измерение. Межизмеренческое Перемещение","page":92},{"name":"Другого","en":"Dimensional Travel Other","flavor":"Персонаж отправляет кого-нибудь в другое измерение.","group":"Омнивселенские Путешествия","prereq":"Межизмеренческое Перемещение, Ранг 4","action":"Обычное, движение или реакция","trigger":"Цель захвачена.","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж делает проверку Эго против защиты Бдительности цели, которую взял в захват. Если проверка успешна, персонаж может отправить цель в другое измерение. В пределах другого измерения, цель может быть отправлена в любое место, в котором персонаж уже был. В ином случае, он появляется в наиболее распространённом входе в это измерение. Межизмеренческое Перемещение","page":92},{"name":"Вместе","en":"Dimensional Travel Together","flavor":"Персонаж берёт кого-нибудь с собой в другое измерение.","group":"Омнивселенские Путешествия","prereq":"Межизмеренческое Перемещение, Ранг 3","action":"Обычное, движение или реакция","trigger":"Цель в захвате.","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж перемещается в другое измерение, и берёт с собой кого-то, с кем они соприкасаются. Если цель не хочет идти в другое измерение — персонаж должен перед этим её схватить. Когда они перемещаются в другое измерение, они могут появиться в любом месте, где персонаж бывал. В ином случае, они появляются в наиболее распространённом входе в это измерение.","page":92},{"name":"Дисциплина 1","en":"Discipline","flavor":"Персонаж отточил свою силу.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"—","range":"","cost":"","effect":"Персонаж добавляет +1 к множителю урона Эго и +1 к небоевым проверкам Эго.","page":92},{"name":"Дисциплина 2","en":"","flavor":"Персонаж лучше чувствует свою силу.","group":"Основные","prereq":"Дисциплина 1, Ранг 2","action":"Постоянная","trigger":"","duration":"—","range":"","cost":"","effect":"Персонаж добавляет +2 к множителю урона Эго и +2 к небоевым проверкам Эго.","page":92},{"name":"Дисциплина 3","en":"","flavor":"Немногие могут превзойти владение его силой.","group":"Основные","prereq":"Дисциплина 2, Ранг 3","action":"Постоянная","trigger":"","duration":"—","range":"","cost":"","effect":"Персонаж добавляет +3 к множителю урона Эго и +3 к небоевым проверкам Эго.","page":92},{"name":"Дисциплина 4","en":"","flavor":"Персонаж идеально освоил свою силу.","group":"Основные","prereq":"Дисциплина 3, Ранг 4","action":"Постоянная","trigger":"","duration":"—","range":"","cost":"","effect":"Персонаж добавляет +4 к множителю урона Эго и +4 к небоевым проверкам Эго.","page":92},{"name":"Маскировка","en":"Disguise","flavor":"Персонаж притворяется кем-то другим.","group":"Основные","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж мгновенно меняет внешность, чтобы выглядеть как кто-то другой. Сложность для любого, кто пытается увидеть сквозь маскировку — защита Эго персонажа. Если персонаж принимает форму кого-то знакомого другому — у другого будет преимущество.","page":92},{"name":"Отмена Заклинания","en":"Dispel Spell","flavor":"Персонаж заканчивает заклинание врага.","group":"Магия","prereq":"Чародей, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж совершает проверку Эго против защиты Эго цели, которая использует заклинание, требующее концентрации. При успехе, концентрация на способности цели заканчивается. При Фантастическом Успехе — концентрация на всех способностях. //77// ССППООССООББННООССТТИИ","page":92},{"name":"Деактивация Электроники","en":"Disrupt Electronics","flavor":"Персонаж может сломать электронику, пока движется сквозь.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Пока персонаж проходит сквозь электроприборы, персонаж может нарушить их работу, отчего они или выключатся, или сломаются. В случае, способностей, которые Опираются на Технику (и связаны с этой электроникой.), эти способности не могут использоваться ход, пока их не перезапустят.","page":94},{"name":"Деактивация Нервов","en":"Disrupt Nerves","flavor":"Персонаж может потревожить чью-то нервную систему.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Когда проходит сквозь кого-то, персонаж может нарушить работу их нервной системы. Персонаж делает проверку Эго против защиты Выносливости цели. При успехе, цель оглушена на один раунд. При Фантастическом Успехе — падают.","page":94},{"name":"Деактивация Человека","en":"Disrupt person","flavor":"Персонаж может кого-то ранить своими способностями фазирования.","group":"Фазирование","prereq":"Фазирование Себя, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж становится немного более осязаемым, пока проходит сквозь себя или проносит оружие сквозь кого-то. Персонаж совершает атаку силы. При успехе, атака наносит обычный урон, игнорируя любое уменьшение множителя урона по здоровью. При Фантастическом Успехе, атака наносит двойной урон, всё ещё игнорирует любое уменьшение множителя урона по здоровью, и цель оглушена на один раунд.","page":94},{"name":"Да Я Весь День Так Могу","en":"Do This All Day","flavor":"Персонаж обращается к своей внутренней силе, чтобы исцелиться.","group":"Боевые Искусства, Щитоносец","prereq":"Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 или более Фокуса","effect":"Персонаж восполняет 2 очка здоровья за каждое потраченное очко фокуса.","page":94},{"name":"Доминирование","en":"Domination","flavor":"Персонаж заставляет кого-то следовать своим приказам — Постоянно. Очки показателей характеристик.","group":"Телепатия","prereq":"Приказы, Ранг 5","action":"Обычное","trigger":"","duration":"—","range":"","cost":"20 Фокуса","effect":"Персонаж доминирует над тем, с кем установил Телепатическую Связь и у которого не осталось фокуса. Персонаж делает проверку логики с помехой против защиты логики цели. При успехе, цель полностью подавлена и будет следовать приказам персонажа. При Фантастическом Успехе, персонаж получает преимущество каждый раз, когда применяет эту способность против этой же цели. Результат проверки персонажа — сложность для любого количества попыток цели вырваться из контроля. Если приказы подразумевают вред кому-то, цель должна сделать проверку логики, чтобы прекратить Доминирование. Если у цели есть тег Героический, они получают преимущество на эту проверку. Если приказ подразумевает вред себе, цель получает преимущество. При теге Героический — двойное преимущество.","page":94},{"name":"Двойной Выстрел","en":"Double Tap","flavor":"Для двойной уверенности.","group":"Оружие Дальнего Боя","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж совершает атаку Ловкости против врага на расстоянии двух пространств. Если атака успешна, врагу наносится обычный урон. При Фантастическом Успехе — двойной урон и кровотечение.","page":95},{"name":"Редактировать Воспоминания","en":"Edit Memory","flavor":"Персонаж изменяет чью-то память.","group":"Телепатия","prereq":"Провал в Памяти, Ранг 4","action":"Обычное","trigger":"","duration":"Постоянная","range":"","cost":"15 Фокуса","effect":"Персонаж вмешивается в память цели, с которой у него есть Телепатическая Связь. Вмешательство может быть простым, вроде стирания куска памяти цели, или комплексным, вроде внедрения совершенно новых воспоминаний. Рассказчик определяет Сложность, основываясь на том, насколько сложное новое воспоминание и как трудно будет внедрить подобное в другие воспоминания персонажа. Персонаж совершает проверку Логики против защиты Логики цели. При успехе — воспоминания изменены. При Фантастическом Успехе, у цели будет помеха на проверках опровергнуть эти воспоминания в будущем. Каждый раз, когда у цели есть хорошая причина усомниться в своих воспоминаниях, она может сделать проверку Логики, чтобы опровергнуть новую версию своих воспоминаний и восстановить оригинальную. При успехе, цель помнит обе версии. При Фантастическом Успехе — она точно знает, кто редактировал их воспоминания.","page":95},{"name":"Элементальное Заграждение","en":"Elemental Barrage","flavor":"Персонаж обрушивает на своих врагов заградительный огонь своего элемента.","group":"Контроль Элементов","prereq":"Элементальный Выстрел, Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж выбирает пространство в зоне видимости. Персонаж может воздействовать на каждого врага в расстоянии 10 пространств от неё. Персонаж делает проверку Эго и сравнивает результат с защитой Выносливости каждой цели. Задействованные враги получают половину обычного урона. При Фантастическом Успехе — весь урон и специальный эффект элемента.","page":95},{"name":"Элементальный Барьер","en":"Elemental Barrier","flavor":"Персонаж формирует стену из своего элемента.","group":"Контроль Элементов","prereq":"Элементальный Выстрел, Ранг 2","action":"Обычное СПОСОБНОСТИ","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж формирует стену своего элемента в зоне видимости на расстоянии 10 пространств на ранг, покрывая 2 пространства подряд (горизонтально или вертикально.) на ранг. Персонаж совершает проверку Ловкости и сравнивает с защитой Ловкости каждой цели в задействованных пространствах. При успехе, персонаж выбирает, с какой стороны барьера цель окажется. При провале — выбирает цель. При Фантастическом Успехе, на цель также действует специальный эффект элемента. Атаки против барьера равны атакам против защиты Эго персонажа. Любая атака против барьера, которая наносит 10 урона или меньше — мгновенно поглощается и барьер продолжает стоять. Если атака наносит больше 10 урона, она уничтожает барьер. В любом случае, атака не проходит по целям за барьером.","page":95},{"name":"Элементальный Выстрел","en":"Elemental Blast","flavor":"Персонаж фокусирует во врага огонь из своих элементов.","group":"Контроль Элементов","prereq":"Элементальный Снаряд, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств","cost":"5 или более Фокуса","effect":"Персонаж совершает атаку Ловкости с преимуществом во врага в зоне видимости. Для этой атаки, добавьте +1 к бонусу урона по ловкости персонажа за каждые 2 очка фокуса, которые он тратит. При успехе, цель получает весь этот урон. При Фантастическом Успехе — двойной урон и специальный эффект элемента.","page":95},{"name":"Элементальный Снаряд","en":"Elemental Burst","flavor":"Персонаж стреляет своим элементом.","group":"Контроль Элементов","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств","cost":"","effect":"Персонаж совершает атаку ловкости против врага в зоне видимости. При успехе, цели наносится обычный урон. При Фантастическом Успехе, враг получает двойной урон и специальный эффект элемента.","page":95},{"name":"Элементальная Форма","en":"Elemental Form","flavor":"Тело персонажа сделано из его элемента.","group":"Контроль Элементов","prereq":"Элементальное Укрепление, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Тело персонажа сделано полностью из его элемента, что даёт им хороший контроль и делает его практически неубиваемым. Когда персонаж теряет всё здоровье, форма теряет связь и разваливается. Когда у персонажа есть хотя бы 1 очко здоровья — которое он может вернуть со временем, обычно, персонаж может пересобраться. Если персонаж хочет использовать свою форму элементов необычно, ему стоит взять способности группы Пластичность. Если персонаж хочет принимать человеческую форму, ему стоит взять способность Смена Формы.","page":95},{"name":"Элементальный Захват","en":"Elemental Grab","flavor":"Персонаж использует свой элемент, чтобы поймать персонажа в ловушку.","group":"Контроль Элементов","prereq":"Элементальный Снаряд, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"Варьируется","cost":"5 Фокуса","effect":"Персонаж совершает проверку Эго против защиты Силы цели на расстоянии 5 пространств за ранг. Если атака успешна, персонаж хватает цель своим элементом. При Фантастическом Успехе, цель может быть прижата и к ней применяется специальный эффект элемента. Чтобы вырваться, нужна проверка силы со сложностью 20.","page":96},{"name":"Элементальное Питание","en":"Elemental infusion","flavor":"Персонаж заряжает оружие своим элементом.","group":"Контроль Элементов","prereq":"Элементальный Снаряд, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж направляет свою энергию в оружие, которое держит. При Фантастическом Успехе, когда он атакует этим оружием — к цели применяется специальный эффект элемента.","page":96},{"name":"Элементальная Тюрьма","en":"Elemental Prison","flavor":"Персонаж может создать клетку из своего элемента.","group":"Контроль Элементов","prereq":"Элементальная Защита 1","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"равна стоимости Элементальной Защиты персонажа","effect":"Персонаж выбирает точку в зоне видимости и ловит любые выбранные цели на расстоянии 5 пространств за ранг, в тюрьму из своего элемента. Когда Элементальная Тюрьма сформирована, персонаж делает проверку Эго и сравнивает результат с защитой Ловкости целей внутри задействованных пространств. На каждый успех, персонаж запирает цель в периметре тюрьмы. При Фантастическом Успехе, цели также получают полный урон и специальный эффект элемента. Атаки против тюрьмы равны атакам против Элементальной Защиты. Если атака наносит больше урона, чем может поглотить Элементальная Защита персонажа, тюрьма уничтожается, Никто внутри не получает урон.","page":96},{"name":"Элементальная Защита 1","en":"","flavor":"(Elemental Protection) Персонаж защищает себя своим элементом.","group":"Контроль Элементов","prereq":"Ранг 2","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности.","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж защищает себя своим элементом. Любая атака против него, которая наносит 10 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 10 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":96},{"name":"Элементальная Защита 2","en":"","flavor":"Элементальная защита персонажа как броня.","group":"Контроль Элементов","prereq":"Элементальная Защита 1, Ранг 3","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности.","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж защищает себя своим элементом. Любая атака против него, которая наносит 20 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 20 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":96},{"name":"Элементальная Защита 3","en":"","flavor":"Элементальная защита персонажа как танк.","group":"Контроль Элементов","prereq":"Элементальная Защита 2, Ранг 4","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности.","duration":"Концентрация","range":"","cost":"15 Фокуса","effect":"Персонаж защищает себя своим элементом. Любая атака против него, которая наносит 30 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 30 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":96},{"name":"Элементальная Защита 4","en":"","flavor":"Элементальная защита персонажа как крепость.","group":"Контроль Элементов","prereq":"Элементальная Защита 3, Ранг 5","action":"Обычное или реакция","trigger":"Персонаж атакован или иначе подвержен опасности.","duration":"Концентрация Очки показателей характеристик.","range":"","cost":"20 Фокуса","effect":"Персонаж защищает себя своим элементом. Любая атака против него, которая наносит 40 урона или меньше — мгновенно поглощается и защита продолжается. Если атака наносит больше 40 урона, она разрушает защиту и оставшийся урон наносится персонажу.","page":96},{"name":"Элементальный Толчок","en":"Elemental Push","flavor":"Персонаж может подвинуть цель своим элементом.","group":"Контроль Элементов","prereq":"Элементальный Снаряд, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 или более Фокуса","effect":"Персонаж делает атаку Эго против защиты Ловкости цели. При успехе, персонаж может подвинуть цель в любом направлении, на одно пространство за ранг. При Фантастическом Успехе, цель также получает обычный урон, лежит и получает специальный эффект элемента.","page":96},{"name":"Элементальное Укрепление","en":"Elemental Reinforcement","flavor":"Персонаж усиливает способности своим элементом.","group":"Контроль Элементов","prereq":"Элементальная Защита 1","action":"Реакция","trigger":"Урон проходит сквозь защитную элементальную способность (Вроде защиты, сферы или барьера.).","duration":"Мгновенная","range":"","cost":"Варьируется","effect":"Персонаж может перенаправить весь урон выше Элементальной защиты на свой Фокус, чтобы сохранить защиту.","page":97},{"name":"Элементальный Рикошет","en":"Elemental Ricochet","flavor":"Персонаж заставляет отскочить снаряд от одного врага в другого.","group":"Контроль Элементов","prereq":"Элементальный Снаряд, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"10 пространств на ранг персонажа","cost":"10 Фокуса","effect":"Персонаж совершает атаку ловкости против цели в зоне видимости. При успехе, атака наносит обычный урон. При Фантастическом Успехе, энергия также отскакивает от первой цели к другой в зоне видимости, и персонаж может совершить новую атаку против этой цели, добавляя новую дистанцию к предыдущей. Это можно повторять, пока атака не будет не-фантастической.","page":97},{"name":"Элементальная Сфера","en":"Elemental Sphere","flavor":"Персонаж может создать защитную сферу своего элемента.","group":"Контроль Элементов","prereq":"Элементальная Защита 1","action":"Обычное или реакция","trigger":"","duration":"Концентрация","range":"","cost":"Равна стоимости Элементальной Защиты персонажа","effect":"Персонаж укрывает себя и выбранных людей на 5 пространств от ранга — в защитную сферу из их элемента. Когда сфера сформирована, персонаж делает проверку Эго и сравнивает результат с защитой Ловкости тех, кого в сфере держать он не хочет. При успехе, персонаж может их передвинуть за пределы периметра сферы. При Фантастическом Успехе, они также получают полный урон и специальный эффект элемента. СПОСОБНОСТИ. Атаки против сферы сравниваются с защитой Эго персонажа. Любые атаки против сферы поглощаются как атаки против Элементальной Защиты. Если атака наносит больше урона, чем может поглотить Элементальная Защита персонажа, сфера уничтожается, Никто внутри не получает урон.","page":97},{"name":"Элементальное Удушье","en":"Elemental Suffocation","flavor":"Персонаж обволакивает голову цели своим элементом.","group":"Контроль Элементов","prereq":"Элементальный Захват, Ранг 4","action":"Обычное или реакция","trigger":"Цель схвачена Элементальным Захватом.","duration":"Мгновенная","range":"Варьируется","cost":"15 Фокуса","effect":"Персонаж совершает атаку Эго против защиты Выносливости захваченной цели. Если атака успешная, цель получает обычный урон. При Фантастическом Успехе, цель прижата и получает специальный эффект элемента. При использовании элемента, непригодного для ограничения кислорода, сила вместо этого душит цель.","page":97},{"name":"Поглощение Энергии","en":"Energy Absorption","flavor":"Персонаж оборачивает урон в силу.","group":"Основные","prereq":"Ранг 4","action":"Реакция","trigger":"Персонаж получает урон по здоровью.","duration":"Мгновенная","range":"","cost":"15 Фокуса","effect":"Персонаж может весь нанесённый ему урон (после применения всех уменьшений урона) проигнорировать и добавить к своему фокусу. Таким образом он может увеличить фокус вплоть до двойного значения своего максимального фокуса. Когда бой завершается, весь дополнительный фокус выше обычного максимума персонажа — исчезает. Эту способность нельзя использовать снова, пока весь полученный таким образом Фокус не будет потрачен.","page":97},{"name":"Защита от Внешней Среды","en":"Environmental Protection","flavor":"Эффекты внешней среды не тревожат персонажа.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонажа не ранит сильный холод или жар, давление глубоких морей или пустота космоса. Персонаж может выбрать защиту от любого этого эффекта или от всех, если это соответствует концепту персонажа.","page":98},{"name":"Экстрасенсорное Восприятие)","en":"ESP (Extrasensory Perception","flavor":"Персонаж чувствует присутствие других.","group":"Телепатия","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"","effect":"Персонаж может дотянуться своим разумом, чтобы ощутить присутствие других, до 100 пространств на ранг. Способность говорит ему, где конкретно находятся цели и их общее состояние. Также она определяет, есть ли у них суперспособности. Если цель или цели хотят остаться незамеченными, персонаж должен сделать проверку логики против защиты Бдительности каждой цели. При Фантастическом Успехе, персонаж также определяет источник сил цели.","page":98},{"name":"Уворотливость","en":"Evasion","flavor":"Персонаж может быстро уклоняться от ударов.","group":"Основные","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может использовать защиту Ловкости против атак Силы.","page":98},{"name":"Экзорцизм","en":"Exorcism","flavor":"Персонаж изгоняет вторгнувшегося в чужое тело.","group":"Магия","prereq":"Ранг 4","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"15 Фокуса.","effect":"Персонаж пытается убрать овладевшего из одержимой цели. Персонаж делает проверку Эго против защиты Эго овладевшего. При успехе, концентрация на этой способности у овладевшего разрушается, и владение заканчивается. При Фантастическом Успехе, концентрация на всех способностях разрушается и овладевший оглушается на раунд.","page":98},{"name":"Эксплуатация","en":"Exploit","flavor":"Персонаж находит слабую точку врага и использует это.","group":"Оружие Ближнего Боя","prereq":"Жестокая Атака, Ранг 2","action":"Реакция","trigger":"Фантастический Успех на атаке с оружием, которая нанесла хотя бы 1 урон.","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку Силы против защиты Выносливости цели. Если атака успешна, урон игнорирует Уменьшение множителя урона по здоровью. При Фантастическом Успехе, цель получает двойной урон и специальный эффект оружия. Art by Andrea Di Vito & Laura Villari","page":98},{"name":"Передача Невидимости","en":"Extend Invisibility","flavor":"Персонаж делает невидимым что-то ещё.","group":"Иллюзия","prereq":"Невидимость","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса.","effect":"Персонаж делает что-то или кого-то в пределах досягаемости — невидимым. Кто-то или что-то может быть на один размер больше персонажа на каждый ранг, который у него есть.","page":99},{"name":"Увеличенная Досягаемость 1","en":"","flavor":"(Extended Reach) Досягаемость персонажа увеличивается.","group":"Пластичность","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Досягаемость персонажа увеличивается в 4 раза.","page":99},{"name":"Увеличенная Досягаемость 2","en":"","flavor":"Персонаж может дотянуться ооооченьдалеко.","group":"Пластичность","prereq":"Увеличенная Досягаемость 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Досягаемость персонажа увеличивается в 10 раз.","page":99},{"name":"Быстрые Атаки","en":"Fast Attacks","flavor":"Персонаж набрасывается с атаками оружием!","group":"Оружие Ближнего Боя","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"","effect":"Персонаж разделяет атаку, чтобы сделать две атаки силы по разным целям в пределах досягаемости (Или он может единожды атаковать одну цель). Сделайте одну проверку силы и сравните с защитами силы целей. При успехе, выбранные цели получают половину урона. При Фантастическом Успехе, выбранные цели получают полный урон, и персонаж может совершить дополнительную атаку этой способностью против любой цели в досягаемости, с таким же эффектом.","page":99},{"name":"Быстрые Руки","en":"Fast Hands","flavor":"Персонаж может стрелять так быстро, что моргнуть не успеешь.","group":"Оружие Дальнего Боя","prereq":"Парирование в Упор, Ранг 3","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает дополнительную реакцию. Реакцию можно использовать только для способностей Оружия дальнего боя.","page":99},{"name":"Быстрые Удары","en":"Fast Strikes","flavor":"Персонаж обрушивает шквал ударов.","group":"Боевые Искусства","prereq":"Никаких","action":"Обычное","trigger":"","duration":"Мгновенная СПОСОБНОСТИ","range":"","cost":"","effect":"Персонаж разделяет атаку, чтобы сделать две атаки силы по разным целям в пределах досягаемости (Или они могут единожды атаковать одну цель.). Сделайте одну проверку силы и сравните с защитами силы целей. При успехе, выбранные цели получают половину урона. При Фантастическом Успехе, выбранные цели получают полный урон.","page":99},{"name":"Пламя Фалтина","en":"Flames of the Faltine","flavor":"Персонаж выпускает струи зачарованного пламени из рук.","group":"Магия","prereq":"Чародей, Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает проверку Эго против защиты Ловкости цели в зоне видимости. Если атака успешна, она наносит обычный урон. При Фантастическом Успехе, цель получает двойной урон и затем получает 5 урона в конце каждого раунда, пока кто-нибудь не потратит действие, чтобы прекратить огонь.","page":99},{"name":"Вспышка","en":"Flare","flavor":"Персонаж создаёт ослепляющую вспышку света.","group":"Иллюзия","prereq":"Освещение, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж совершает проверку Эго и сравнивает её с защитой Бдительности каждого врага в пределах пяти пространств. Каждый враг, по которому прошла атака ослепляется на ход. При Фантастическом Успехе, Вспышка также наносит обычный урон.","page":99},{"name":"Гибкие Кости 1","en":"Flexible Bones","flavor":"У персонажа резиновый скелет.","group":"Пластичность","prereq":"Никаких","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает 1 уменьшения множителя урона по здоровью. Также он получает преимущество на проверки ловкости для выворачивания и освобождения.","page":99},{"name":"Гибкие Кости 2","en":"","flavor":"Скелет персонажа гибкий и пластичный.","group":"Пластичность","prereq":"Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж получает 2 уменьшения множителя урона по здоровью. Также он получает 2 преимуществ на проверки ловкости для выворачивания и освобождения.","page":99},{"name":"Гибкие Пальцы","en":"Flexible Fingers","flavor":"Персонаж может согнуть пальцы и ладони в любой необходимый инструмент.","group":"Пластичность","prereq":"Никакие","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Обычным действием, персонаж может автоматически взломать любой замок, который требует ключа. Также его руки могут принять форму практически любого другого вида простого инструмента.","page":99},{"name":"Полёт 1","en":"Flight","flavor":"Персонаж может подняться в небеса.","group":"Основные","prereq":"Ранг 1","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Персонаж может летать. Боевая скорость полёта равна Скорости Бега на ранг. Вне боя, персонаж движется в три раза быстрее боевой скорости полёта.","page":100},{"name":"Полёт 2","en":"","flavor":"Персонаж может пролететь сквозь небеса.","group":"Основные","prereq":"Полёт 1, Ранг 2","action":"Постоянная","trigger":"","duration":"Постоянная","range":"","cost":"","effect":"Вне боя, персонаж летит в 50 раз быстрее своей боевой скорости полёта.","page":100},{"name":"Двойной Удар Ногой в Прыжке","en":"Flying Double Kick","flavor":"Персонаж поднимается в воздух и ударяет ногами двух врагов одновременно.","group":"Боевые Искусства","prereq":"Подсечка, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж совершает атаку силы против двух врагов в досягаемости. Если атака успешна, врагам наносится обычный урон. При Фантастическом Успехе врагам наносится двойной урон и они падают.","page":100},{"name":"Сфокусировать Огонь","en":"Focus Fire","flavor":"Персонаж называет цель.","group":"Тактика","prereq":"План Боя, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж называет врага в зоне видимости и вдохновляет одного или более союзников на их выбор в зоне слышимости, в количестве Бдительности персонажа. Они получают преимущество ко всем проверкам действий против этого врага.","page":100},{"name":"Сфокусированный Гнев","en":"Focused Fury","flavor":"Персонаж направляет свою ярость в разрушительный удар.","group":"Оружие Ближнего Боя","prereq":"Эксплуатация, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 или более Фокуса.","effect":"Персонаж совершает атаку Силы с преимуществом. Для этой атаки, добавьте 1 к бонусу урона Силы за каждые потраченные 2 очка Фокуса. При успехе, выбранной цели наносится весь этот урон. При Фантастическом Успехе, цель получает двойной урон и специальный эффект оружия.","page":100},{"name":"Сфокусированный Удар","en":"Focused Strike","flavor":". Персонаж находит идеальную точку для атаки.","group":"Боевые Искусства","prereq":"Цепные Удары, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 или более Фокуса","effect":"Персонаж совершает атаку Силы с преимуществом. Для этой атаки, добавьте 1 к бонусу урона Силы за каждые потраченные 2 очка Фокуса. При успехе, выбранной цели наносится весь этот урон. При Фантастическом Успехе, цель получает двойной урон и оглушается на раунд.","page":100},{"name":"Одурачить","en":"Fool","flavor":"Персонаж заставляет других поверить, что он кто-то другой.","group":"Телепатия","prereq":"Телепатическая Связь, Ранг 2","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"5 Фокуса","effect":"Персонаж меняет свою внешность в разумах всех на расстоянии 20 пространств за ранг. Камеры, например, всё ещё записывают персонажа как обычно, но когда люди смотрят в направлении персонажа, они видят кого-то другого. Сложность для любого, кто пытается увидеть персонажа — защита логики персонажа. Если персонаж притворяется кем-то знакомым другому, у другого будет преимущество.","page":101},{"name":"Яростные Атаки","en":"Furious Attacks","flavor":"Оружие персонажа врезается во врага.","group":"Оружие Ближнего Боя","prereq":"Вихревое Безумие, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 или более Фокуса","effect":"Персонаж разделяет атаку, чтобы сделать две атаки силы по разным целям в пределах досягаемости (Или они могут единожды атаковать одну цель.). Сделайте одну проверку силы и сравните с защитами силы целей. Для этих атак добавьте +1 к бонусу урона силы за каждые 2 очка фокуса, что персонаж тратит. При успехе, выбранные цели получают по половине этого урона. При Фантастическом Успехе, выбранные цели получают полный урон и специальный эффект оружия.","page":101},{"name":"Масштабный Мираж","en":"Grand Mirage","flavor":"Персонаж заставляет появиться что-то в разуме других.","group":"Телепатия","prereq":"Мираж, Ранг 4","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж создаёт полностью ощущаемый образ, который действует на всех в Телепатической Сети и кто находится в одной локации. Образ может быть каким персонаж пожелает, и может свободно двигаться.","page":101},{"name":"Масштабно Одурачить","en":"Grand Fool","flavor":"Персонаж заставляет других поверить, что он и его группа —кто-то другой.","group":"Телепатия","prereq":"Одурачить, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж меняет свою и своей группы внешность в разумах всех на расстоянии 20 пространств за ранг. Камеры, например, всё ещё записывают персонажей как обычно, но когда люди смотрят в направлении персонажей, они видят кого-то другого. Сложность для любого, кто пытается увидеть сквозь обман — защита логики персонажа. Если персонажи притворяются кем-то знакомым другому, у другого будет преимущество. СПОСОБНОСТИ","page":101},{"name":"Великая Иллюзия","en":"Grand Illusion","flavor":"Манипулируя светом и звуком, персонаж создаёт невероятно реалистичную голограмму.","group":"Иллюзия","prereq":"Двигающаяся Иллюзия, Ранг 3","action":"Обычное","trigger":"","duration":"Концентрация","range":"","cost":"10 Фокуса","effect":"Персонаж создаёт звуковую и визуальную иллюзию в любом месте зоны видимости, на расстоянии 50 пространств. Иллюзия может быть чем угодно, превышать размер персонажа до пяти раз, и свободно передвигаться в рамках ограничений. Персонаж теряет концентрацию, если отойдёт на 50 пространств от иллюзии или потеряет её из виду.","page":101},{"name":"Техника Захвата","en":"Grappling Technique","flavor":"Персонаж хватает врага.","group":"Боевые Искусства","prereq":"Ранг 2","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"5 Фокуса","effect":"Персонаж совершает атаку силы. Если атака успешна, враг получает обычный урон и захвачен. При Фантастическом Успехе, урон двойной и цель прижата.","page":101},{"name":"Сотрясающий Землю Топот","en":"Ground-Shaking Stomp","flavor":"Персонаж так сильно ударяет по земле, что она дрожит.","group":"Супер-Сила","prereq":"Крушить, Ранг 3","action":"Обычное","trigger":"","duration":"Мгновенная","range":"","cost":"10 Фокуса","effect":"Персонаж совершает атаку Силы против защиты Ловкости каждой цели в радиусе досягаемости + рангом персонажа. Все цели, по которым атака успешно прошла, получают половину урона. При Фантастическом Успехе, целям наносится полный урон и они падают.","page":101
