function getFilteredIndices(route) {
  const f = STATE.filters[route];
  const q = (f.q || '').trim().toLowerCase();
  const arr = DB[route];
  const res = [];
  arr.forEach((item, idx) => {
    if (route === 'characters') {
      if (f.rank !== 'all' && String(item.rank) !== String(f.rank)) return;
      if (f.origin && !(item.origin || '').toLowerCase().includes(f.origin.toLowerCase())) return;
      if (q && !(item.name + ' ' + item.realName + ' ' + item.teams + ' ' + item.origin + ' ' + item.occupation).toLowerCase().includes(q)) return;
    } else if (route === 'powers') {
      if (f.group !== 'all' && item.group !== f.group) return;
      if (f.action !== 'all' && !(item.action || '').toLowerCase().includes(f.action.toLowerCase())) return;
      if (f.rank && f.rank !== 'all' && String(getPowerMinRank(item)) !== String(f.rank)) return;
      if (q && !(item.name + ' ' + item.en + ' ' + item.group + ' ' + item.effect + ' ' + item.prereq).toLowerCase().includes(q)) return;
    } else if (route === 'traits' || route === 'tags') {
      if (f.restricted === 'yes' && !item.restriction) return;
      if (f.restricted === 'no' && item.restriction) return;
      if (q && !(item.name + ' ' + item.en + ' ' + item.desc).toLowerCase().includes(q)) return;
    } else if (route === 'glossary') {
      if (q && !(item.term + ' ' + item.desc).toLowerCase().includes(q)) return;
    } else {
      if (q && !(item.name + ' ' + (item.en||'') + ' ' + (item.desc||'') + ' ' + (item.examples||'')).toLowerCase().includes(q)) return;
    }
    res.push(idx);
  });
  if (route === 'powers' && f.sort && f.sort !== 'name') {
    res.sort((ia, ib) => {
      const a = DB.powers[ia], b = DB.powers[ib];
      if (f.sort === 'rank_asc') return (getPowerMinRank(a) - getPowerMinRank(b)) || a.name.localeCompare(b.name, 'ru');
      if (f.sort === 'rank_desc') return (getPowerMinRank(b) - getPowerMinRank(a)) || a.name.localeCompare(b.name, 'ru');
      if (f.sort === 'group') return a.group.localeCompare(b.group, 'ru') || a.name.localeCompare(b.name, 'ru');
      return 0;
    });
  } else if (route === 'powers') {
    res.sort((ia, ib) => DB.powers[ia].name.localeCompare(DB.powers[ib].name, 'ru'));
  }
  return res;
}

function setFilter(route, key, val, keepFocus) {
  STATE.filters[route][key] = val;
  if (keepFocus) {
    // Re-render only list + count without destroying input focus
    const indices = getFilteredIndices(route);
    if (indices.length && !indices.includes(STATE.selectedIdx)) STATE.selectedIdx = indices[0];
    renderSplitCatalogPreserveInput(route, indices);
  } else {
    renderContent();
  }
}

function renderSplitCatalogPreserveInput(route, indices) {
  const input = document.querySelector('.filter-input');
  const pos = input ? input.selectionStart : null;
  renderContent();
  const newInput = document.querySelector('.filter-input');
  if (newInput && pos !== null) {
    newInput.focus();
    newInput.setSelectionRange(pos, pos);
  }
}

function selectItem(idx) {
  STATE.selectedIdx = idx;
  STATE.mobileDetailOpen = true;
  // Update active class & detail panel without losing scroll position in masterList
  document.querySelectorAll('.master-list .list-row').forEach(r => r.classList.remove('active'));
  const detailCol = document.getElementById('detailCol');
  if (detailCol) {
    detailCol.innerHTML = `<div class="detail-back-bar"><button class="btn-sm" onclick="STATE.mobileDetailOpen=false;document.getElementById('detailCol').classList.remove('mobile-open');">← Назад к списку</button></div>` + renderDetailCard(STATE.route, idx);
    detailCol.classList.add('mobile-open');
    detailCol.scrollTop = 0;
  }
  // Highlight clicked row
  const indices = getFilteredIndices(STATE.route);
  const pos = indices.indexOf(idx);
  const rows = document.querySelectorAll('.master-list .list-row');
  if (pos >= 0 && rows[pos]) rows[pos].classList.add('active');
}

  calcDamage();
}

function rollDie() { return Math.floor(Math.random() * 6) + 1; }
function rollD616() {
  let d1 = rollDie(), dm = rollDie(), d3 = rollDie();
  const mod = Number(document.getElementById('dMod').value) || 0;
  const tn = Number(document.getElementById('dTN').value) || 12;
  const adv = Number(document.getElementById('dAdv').value) || 0;

  let mVal = dm === 1 ? 6 : dm;
  let note = '';
  if (adv === 1) {
    // Re-roll lowest value among d1, mVal, d3
    const arr = [{k:'d1',v:d1},{k:'dm',v:mVal},{k:'d3',v:d3}].sort((a,b)=>a.v-b.v);
    const rr = rollDie();
    if (arr[0].k === 'd1' && rr > d1) { note = `Переброс d6: ${d1}→${rr}`; d1 = rr; }
    else if (arr[0].k === 'd3' && rr > d3) { note = `Переброс d6: ${d3}→${rr}`; d3 = rr; }
    else if (arr[0].k === 'dm') {
      const rrM = rr === 1 ? 6 : rr;
      if (rrM > mVal || rr === 1) { note = `Переброс кMarvel: ${mVal}→${rr===1?'M(6)':rr}`; dm = rr; mVal = rrM; }
    }
    if (!note) note = 'Преимущество: переброс не улучшил результат';
  } else if (adv === -1) {
    const arr = [{k:'d1',v:d1},{k:'dm',v:mVal},{k:'d3',v:d3}].sort((a,b)=>b.v-a.v);
    const rr = rollDie();
    if (arr[0].k === 'd1' && rr < d1) { note = `Помеха d6: ${d1}→${rr}`; d1 = rr; }
    else if (arr[0].k === 'd3' && rr < d3) { note = `Помеха d6: ${d3}→${rr}`; d3 = rr; }
    else if (arr[0].k === 'dm') {
      const rrM = rr === 1 ? 6 : rr;
      if (rrM < mVal) { note = `Помеха кMarvel: ${dm===1?'M(6)':mVal}→${rrM}`; dm = rr; mVal = rrM; }
    }
    if (!note) note = 'Помеха: переброс не ухудшил результат';
  }

  const total = d1 + mVal + d3 + mod;
  const isMarvel = dm === 1;
  const isBotch = (d1 === 1 && dm === 1 && d3 === 1);
  const success = !isBotch && (total >= tn || isMarvel);
  const fantastic = success && isMarvel;

  document.getElementById('diceStage').innerHTML = `
    <div class="die-box"><span>${d1}</span><span class="die-sub">d6</span></div>
    <div class="die-box marvel"><span>${isMarvel ? 'M' : dm}</span><span class="die-sub">${isMarvel ? 'кMarvel (6)' : 'кMarvel'}</span></div>
    <div class="die-box"><span>${d3}</span><span class="die-sub">d6</span></div>`;

  let verdict = isBotch ? 'КРИТИЧЕСКИЙ ПРОВАЛ (1-M-1)!' : fantastic ? 'ФАНТАСТИЧЕСКИЙ УСПЕХ!' : success ? 'УСПЕХ' : 'ПРОВАЛ';
  let color = fantastic ? 'var(--yellow)' : success ? '#7ef0a6' : '#ff8c8f';
  document.getElementById('rollResult').innerHTML = `
    <div class="roll-total" style="color:${color};">${total} <span style="font-size:15px;font-weight:700;">vs Сл ${tn}</span></div>
    <div style="font-weight:800;font-size:14px;color:${color};margin-top:2px;">${verdict}</div>
    <div style="font-size:12px;color:var(--muted);margin-top:4px;">(${d1} + ${isMarvel?'M(6)':mVal} + ${d3}) ${mod>=0?'+ '+mod:mod}${note ? ' • ' + note : ''}</div>`;

  // Sync marvel die into damage calculator automatically
  const cm = document.getElementById('cMarvel');
  const cf = document.getElementById('cFant');
  if (cm) cm.value = mVal;
  if (cf) cf.checked = fantastic;
  calcDamage();

  STATE.diceHistory.unshift(`${total} vs ${tn} (${verdict})`);
  if (STATE.diceHistory.length > 6) STATE.diceHistory.pop();
  document.getElementById('diceHistory').innerHTML = '<strong>История:</strong> ' + STATE.diceHistory.join(' • ');
}

function calcDamage() {
  const m = Math.max(1, Math.min(6, Number(document.getElementById('cMarvel')?.value) || 1));
  const mult = Math.max(1, Number(document.getElementById('cMult')?.value) || 1);
  const dr = Math.max(0, Number(document.getElementById('cDR')?.value) || 0);
  const bonus = Number(document.getElementById('cBonus')?.value) || 0;
  const fant = !!document.getElementById('cFant')?.checked;

  const effMult = mult - dr;
  let dmg = 0;
  if (effMult >= 1) {
    dmg = (m * effMult + bonus) * (fant ? 2 : 1);
  }
  const knockback = effMult >= 1 ? effMult * 5 : 0;
  const out = document.getElementById('dmgOut');
  if (!out) return;
  out.innerHTML = `
    <div class="roll-total">${dmg} <span style="font-size:16px;">урона</span></div>
    <div style="font-size:12px;color:#dce6f2;margin-top:4px;">
      ${effMult < 1 ? 'Броня/Прочность полностью поглотила удар (множитель < 1)' : `Эфф. множитель: ×${effMult} (${mult} − ${dr} DR)${fant ? ' • Фантастический ×2' : ''}`}
    </div>
    <div style="font-size:12px;color:var(--yellow);margin-top:4px;">Отбрасывание (при Мощи + Фант. успехе): <strong>${knockback} пространств</strong></div>`;
}

  const initMod = parseInt(String(ch.init).replace(/[^\d\-+]/g,''), 10) || 0;
  STATE.combat.list.push({
    id: Date.now() + Math.random(),

    rank: ch.rank,

function addCustomCombatant() {
  STATE.combat.list.push({
    id: Date.now(), name: 'Боец #' + (STATE.combat.list.length + 1), rank: 2,

  safeSet('mmrpg_combat_v2', STATE.combat);
  renderContent();

function adjCombat(idx, field, delta) {
  const u = STATE.combat.list[idx];
  if (!u) return;
  u[field] += delta;
  safeSet('mmrpg_combat_v2', STATE.combat);
  renderContent();
}
function toggleCombatCond(idx, cond) {
  const u = STATE.combat.list[idx];
  if (!u) return;
  const p = u.conditions.indexOf(cond);
  if (p >= 0) u.conditions.splice(p, 1); else u.conditions.push(cond);
  safeSet('mmrpg_combat_v2', STATE.combat);
  renderContent();
}
function removeCombat(idx) {
  STATE.combat.list.splice(idx, 1);
  if (STATE.combat.turn >= STATE.combat.list.length) STATE.combat.turn = 0;
  safeSet('mmrpg_combat_v2', STATE.combat);
  renderContent();
}
function sortCombatInit() {
  STATE.combat.list.sort((a,b) => b.initRoll - a.initRoll);
  STATE.combat.turn = 0;
  safeSet('mmrpg_combat_v2', STATE.combat);
  renderContent();
}
function nextTurn() {
  if (!STATE.combat.list.length) return;
  STATE.combat.turn++;
  if (STATE.combat.turn >= STATE.combat.list.length) {
    STATE.combat.turn = 0;
    STATE.combat.round++;
  }
  safeSet('mmrpg_combat_v2', STATE.combat);
  renderContent();
}
function clearCombat() {
  STATE.combat = { round: 1, turn: 0, list: [] };
  safeSet('mmrpg_combat_v2', STATE.combat);
  renderContent();
}

function shuffleArr(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function parsePowerPrereq(prereqStr) {

  if (!prereqStr) return res;
  const clean = String(prereqStr).trim();
  if (!clean || /^никак/i.test(clean) || /^нет$/i.test(clean)) return res;

  // Extract Rank requirement
  const rm = clean.match(/Ранг\s*(\d+)/i);
  if (rm) res.minRank = Number(rm[1]);

  // Remove rank clause & split remaining by comma/semicolon
  const withoutRank = clean.replace(/Ранг\s*\d+\.?/gi, '').trim();
  const parts = withoutRank.split(/[,;]+/).map(x => x.trim()).filter(Boolean);
  for (const part of parts) {
    // Handle "A или B"
    const alts = part.split(/\s+или\s+/i).map(x => normName(x)).filter(Boolean);
    // Keep clauses that refer to actual powers in DB (or numbered chains like "мощь 1")
    const powerAlts = alts.filter(a => POWER_NAME_SET.has(a) || /\s[1-4]$/.test(a));
    if (powerAlts.length) {
      res.reqClauses.push(powerAlts);
    }
  }
  return res;
}

const PARSED_PREREQS = new Map();
DB.powers.forEach(p => PARSED_PREREQS.set(p.name, parsePowerPrereq(p.prereq)));

function parseFocusCost(costStr) {
  if (!costStr) return 0;
  const m = String(costStr).match(/(\d+)/);
  return m ? Number(m[1]) : 0;
}

function getHeroDerivedBonuses(b) {
  const dmgBonus = { 'Сила': 0, 'Ловкость': 0, 'Эго': 0, 'Логика': 0 };
  let dr = 0;
  (b.powers || []).forEach(p => {
    const nm = normName(p.name);
    const m = nm.match(/^(мощь|точность|дисциплина|гениальность|прочность)\s*(\d)$/);
    if (m) {
      const val = Number(m[2]);
      if (m[1] === 'мощь') dmgBonus['Сила'] = Math.max(dmgBonus['Сила'], val);
      else if (m[1] === 'точность') dmgBonus['Ловкость'] = Math.max(dmgBonus['Ловкость'], val);
      else if (m[1] === 'дисциплина') dmgBonus['Эго'] = Math.max(dmgBonus['Эго'], val);
      else if (m[1] === 'гениальность') dmgBonus['Логика'] = Math.max(dmgBonus['Логика'], val);
      else if (m[1] === 'прочность') dr = Math.max(dr, val);
    }
  });
  return { dmgBonus, dr };
}

function canTakePower(power, ownedNormSet, rank, maxFocus, originName, stats) {
  const pr = PARSED_PREREQS.get(power.name) || parsePowerPrereq(power.prereq);
  if (pr.minRank > rank) return false;
  // Focus cost check
  const cost = parseFocusCost(power.cost);
  if (cost > 0 && cost > maxFocus) return false;
  // Origin restriction: Специальная Подготовка cannot take magic/psionic/supernatural groups
  if (originName && /специальная подготовка/i.test(originName)) {
    const pGroups = power.group.split(',').map(x => x.trim());
    if (!pGroups.every(g => MUNDANE_ALLOWED_GROUPS.has(g))) return false;
  }
  // Check ALL prerequisite power clauses
  for (const clause of pr.reqClauses) {
    const satisfied = clause.some(alt => ownedNormSet.has(alt));
    if (!satisfied) return false;
  }
  // Stat-coherence check for numbered Basic stat passives (don't give Мощь to 0-Сила, etc.)
  if (stats) {
    const nm = normName(power.name);
    for (const [pfx, statKey] of Object.entries(PASSIVE_STAT_MAP)) {
      if (nm.startsWith(pfx + ' ') && (stats[statKey] || 0) < 1) {
        return false;
      }
    }
  }
  return true;
}

function getPowerMinRank(power) {
  const pr = PARSED_PREREQS.get(power.name) || parsePowerPrereq(power.prereq);
  return pr.minRank || 1;
}

function getPowerBlockReason(power, ownedNormSet, rank, maxFocus, originName, limitCount, currentCount) {
  const pr = PARSED_PREREQS.get(power.name) || parsePowerPrereq(power.prereq);
  if (pr.minRank > rank) return `Нужен Ранг ${pr.minRank} (сейчас Ранг ${rank})`;
  if (originName && /специальная подготовка/i.test(originName)) {
    const pGroups = power.group.split(',').map(x => x.trim());
    if (!pGroups.every(g => MUNDANE_ALLOWED_GROUPS.has(g))) return 'Недоступно для «Специальная Подготовка»';
  }
  const cost = parseFocusCost(power.cost);
  if (cost > 0 && cost > maxFocus) return `Нужно ${cost} Фокуса (у героя ${maxFocus})`;
  for (const clause of pr.reqClauses) {
    const satisfied = clause.some(alt => ownedNormSet.has(alt));
    if (!satisfied) {
      const niceNames = clause.map(alt => {
        const fp = DB.powers.find(x => normName(x.name) === alt);
        return fp ? fp.name : alt;
      });
      return `Сначала возьмите: ${niceNames.join(' или ')}`;
    }
  }
  if (typeof limitCount === 'number' && typeof currentCount === 'number' && currentCount >= limitCount) {
    return `Достигнут лимит способностей ранга (${currentCount}/${limitCount})`;
  }
  return null;
}

function chooseGroupsForHero(rank, archObj, originName) {
  const allGroups = [...new Set(DB.powers.map(p => p.group).filter(g => g !== 'Основные' && !g.includes(',')))];
  const isMundane = originName && /специальная подготовка/i.test(originName);
  const pool = isMundane ? allGroups.filter(g => MUNDANE_ALLOWED_GROUPS.has(g)) : allGroups;

  let matched = [];
  if (archObj && archObj.groups && archObj.groups.length) {
    matched = pool.filter(g => archObj.groups.some(ag => normName(g).includes(normName(ag)) || normName(ag).includes(normName(g))));
  }
  const src = matched.length ? matched : pool;
  const maxGroups = rank >= 4 ? 2 : 1;
  return shuffleArr(src).slice(0, maxGroups);
}

function rollStatsForArchetype(rank, archObj, chosenGroups) {
  const rkInfo = DB.tables.rankResources[rank - 1];
  const statNames = ['Сила','Ловкость','Выносливость','Бдительность','Эго','Логика'];
  const stats = { 'Сила': 0, 'Ловкость': 0, 'Выносливость': 1, 'Бдительность': 1, 'Эго': 0, 'Логика': 0 };

  // Combine archetype primaries + chosen power-group primaries for tight synergy
  const primSet = new Set();
  if (archObj && archObj.primaries) archObj.primaries.forEach(s => primSet.add(s));
  if (chosenGroups && chosenGroups.length) {
    chosenGroups.forEach(g => {
      const gs = GROUP_STAT_MAP[g];
      if (gs) gs.forEach(s => primSet.add(s));
    });
  }
  let primaries = [...primSet];
  if (!primaries.length) primaries = shuffleArr(statNames).slice(0, 2);

  // Casters/psionics/tacticians at Rank 2+ benefit from at least 2 Vigilance (60 Focus)
  const needsFocus = (chosenGroups || []).some(g => ['Магия','Телепатия','Телекинез','Тактика','Иллюзия','Контроль Погоды','Контроль Элементов'].includes(g));
  let left = rkInfo.abilityPts - 2;
  if (needsFocus && rank >= 2 && left > 0 && stats['Бдительность'] < rkInfo.cap) {
    stats['Бдительность']++;
    left--;
  }

  let guard = 0;
  while (left > 0 && guard < 400) {
    guard++;
    const target = Math.random() < 0.72 ? pickRand(primaries) : pickRand(statNames);
    if (stats[target] < rkInfo.cap) {
      stats[target]++;
      left--;
    }
  }
  return stats;
}

function rollPowersForArchetype(rank, archObj, stats, originName, chosenGroupsOpt) {
  const rkInfo = DB.tables.rankResources[rank - 1];
  const maxFocus = Math.max(10, ((stats && stats['Бдительность']) || 1) * 30);
  const chosenGroups = (chosenGroupsOpt && chosenGroupsOpt.length)
    ? chosenGroupsOpt
    : chooseGroupsForHero(rank, archObj, originName);

  // Determine top 2 stats of this character to weight matching Basic passives
  const sortedStats = stats
    ? Object.entries(stats).sort((a, b) => b[1] - a[1]).map(x => x[0])
    : ['Сила', 'Ловкость'];
  const topStats = new Set(sortedStats.slice(0, 2));

  const picked = [];
  const ownedNorm = new Set();
  const targetCount = rkInfo.powers;

  // Step-by-step bottom-up selection: EVERY picked power MUST satisfy canTakePower()!
  for (let step = 0; step < targetCount; step++) {
    const candidates = DB.powers.filter(p => {
      if (ownedNorm.has(normName(p.name))) return false;
      return canTakePower(p, ownedNorm, rank, maxFocus, originName, stats);
    });
    if (!candidates.length) break;

    // Score candidates for synergy:
    // +10 if in chosenGroups
    // +7 if it unlocks a deeper tier of a chain we already started (has reqClauses > 0!)
    // +5 if it's a Basic passive matching our top 2 MARVEL stats (e.g. Мощь for Сила)
    // +2 if Основные
    const weighted = [];
    for (const p of candidates) {
      const pGroups = p.group.split(',').map(x => x.trim());
      const inChosen = pGroups.some(g => chosenGroups.includes(g));
      const isBasic = p.group === 'Основные';
      const pr = PARSED_PREREQS.get(p.name);
      const isChainUpgrade = pr && pr.reqClauses.length > 0;
      const nm = normName(p.name);
      let matchesTopStat = false;
      for (const [pfx, sk] of Object.entries(PASSIVE_STAT_MAP)) {
        if (nm.startsWith(pfx + ' ') && topStats.has(sk)) matchesTopStat = true;
      }

      let w = 0;
      if (inChosen) w += 12 + (isChainUpgrade ? 8 : 0);
      else if (isBasic && matchesTopStat) w += 9 + (isChainUpgrade ? 6 : 0);
      else if (isBasic) w += 3;
      else continue; // Keep builds focused on 1-2 thematic groups + Основные!

      weighted.push({ p, w });
    }

    // Fallback: if chosen groups + Основные exhausted, allow any valid prerequisite-satisfied power
    let pool = weighted;
    if (!pool.length) {
      pool = candidates.map(p => ({ p, w: 1 }));
    }

    const totalW = pool.reduce((acc, x) => acc + x.w, 0);
    let r = Math.random() * totalW;
    let chosen = pool[0].p;
    for (const item of pool) {
      r -= item.w;
      if (r <= 0) { chosen = item.p; break; }
    }
    picked.push({ name: chosen.name, group: chosen.group });
    ownedNorm.add(normName(chosen.name));
  }

  return picked;
}

function validateHeroBuild(b) {
  const rkInfo = DB.tables.rankResources[b.rank - 1];
  const maxFocus = Math.max(10, (b.stats['Бдительность'] || 1) * 30);
  const orig = DB.origins[b.originIdx] || { name: '' };
  const owned = new Set();
  const issues = [];
  for (const pObj of (b.powers || [])) {
    const full = DB.powers.find(x => x.name === pObj.name);
    if (!full) continue;
    const pr = PARSED_PREREQS.get(full.name) || parsePowerPrereq(full.prereq);
    if (pr.minRank > b.rank) issues.push(`${full.name}: нужен Ранг ${pr.minRank}`);
    for (const clause of pr.reqClauses) {
      if (!clause.some(alt => owned.has(alt))) {
        issues.push(`${full.name}: не выполнено требование (${full.prereq})`);
      }
    }
    const cost = parseFocusCost(full.cost);
    if (cost > maxFocus) issues.push(`${full.name}: стоимость ${cost} > Фокус ${maxFocus}`);
    owned.add(normName(full.name));
  }
  return issues;
}

function rollTraitsAndTags(rank, alignOpt) {
  const rkInfo = DB.tables.rankResources[rank - 1];
  const traits = shuffleArr(DB.traits).slice(0, rkInfo.traits).map(t => t.name);
  let alignTag = 'Героический';
  if (alignOpt === 'villain') alignTag = 'Злодейский';
  else if (alignOpt === 'antihero') alignTag = 'Охотник';
  else if (alignOpt === 'any') {
    const r = Math.random();
    alignTag = r < 0.65 ? 'Героический' : (r < 0.85 ? 'Злодейский' : 'Уличный');
  }
  const idTag = Math.random() < 0.6 ? 'Тайна Личности' : 'Публичная Личность';
  const extraTag = pickRand(DB.tags).name;
  return { traits, tags: [...new Set([alignTag, idTag, extraTag])], alignLabel: alignTag };
}

function syncHeroVitals() {
  const b = STATE.builder;
  b.curHp = Math.max(10, (b.stats['Выносливость'] || 0) * 30);
  b.curFp = Math.max(10, (b.stats['Бдительность'] || 0) * 30);
  b.curKarma = b.rank;
}

function randomizeHero(fullRandom, openSheet) {
  const b = STATE.builder;
  const opts = fullRandom
    ? { rank: 'any', archetype: 'any', align: 'any', origin: 'any', occ: 'any' }
    : (b.genOpts || { rank: 'any', archetype: 'any', align: 'any', origin: 'any', occ: 'any' });

  b.id = null;
  b.rank = opts.rank === 'any' ? (Math.floor(Math.random() * 6) + 1) : Number(opts.rank);
  const archObj = opts.archetype === 'any'
    ? pickRand(HERO_ARCHETYPES.slice(1))
    : (HERO_ARCHETYPES.find(a => a.id === opts.archetype) || HERO_ARCHETYPES[1]);
  b.archetype = archObj.id;

  b.name = pickRand(HERO_ADJ) + ' ' + pickRand(HERO_NOUN);
  b.realName = '';
  b.originIdx = opts.origin === 'any' ? Math.floor(Math.random() * DB.origins.length) : Number(opts.origin);
  b.occIdx = opts.occ === 'any' ? Math.floor(Math.random() * DB.occupations.length) : Number(opts.occ);

  const origName = (DB.origins[b.originIdx] && DB.origins[b.originIdx].name) || '';
  const chosenGroups = chooseGroupsForHero(b.rank, archObj, origName);
  b.stats = rollStatsForArchetype(b.rank, archObj, chosenGroups);
  const tt = rollTraitsAndTags(b.rank, opts.align);
  b.traits = tt.traits;
  b.tags = tt.tags;
  b.alignment = tt.alignLabel;
  b.powers = rollPowersForArchetype(b.rank, archObj, b.stats, origName, chosenGroups);
  b.conditions = [];
  b.lastRoll = null;
  syncHeroVitals();
  if (openSheet) b.step = 'sheet';

  showToast(`Создан: ${b.name} (Ранг ${b.rank} • ${archObj.label})`);
  if (STATE.route === 'builder') renderContent();
}

function rerollPart(part) {
  const b = STATE.builder;
  const archObj = HERO_ARCHETYPES.find(a => a.id === b.archetype) || HERO_ARCHETYPES[0];
  const origName = (DB.origins[b.originIdx] && DB.origins[b.originIdx].name) || '';
  if (part === 'name') {
    b.name = pickRand(HERO_ADJ) + ' ' + pickRand(HERO_NOUN);
    showToast('Новое имя: ' + b.name);
  } else if (part === 'stats') {
    const cg = chooseGroupsForHero(b.rank, archObj, origName);
    b.stats = rollStatsForArchetype(b.rank, archObj, cg);
    syncHeroVitals();
    showToast('Характеристики переброшены под Ранг ' + b.rank);
  } else if (part === 'powers') {
    b.powers = rollPowersForArchetype(b.rank, archObj, b.stats, origName);
    showToast('Способности переброшены по правилам (' + b.powers.length + ')');
  } else if (part === 'traits') {
    const tt = rollTraitsAndTags(b.rank, (b.genOpts && b.genOpts.align) || 'any');
    b.traits = tt.traits;
    b.tags = tt.tags;
    b.alignment = tt.alignLabel;
    showToast('Черты и теги обновлены');
  }
  renderContent();
}

// Toggle individual Powers, Traits, Tags in Step 4
function toggleBuilderPower(pwName, pwGroup) {
  const b = STATE.builder;
  const idx = b.powers.findIndex(p => p.name === pwName);
  if (idx >= 0) {
    b.powers.splice(idx, 1);
    // Cascade-remove any dependent powers whose prerequisites are no longer satisfied!
    const removedDeps = [];
    let changed = true;
    while (changed) {
      changed = false;
      const ownedNow = new Set(b.powers.map(p => normName(p.name)));
      for (let i = b.powers.length - 1; i >= 0; i--) {
        const full = DB.powers.find(x => x.name === b.powers[i].name);
        if (!full) continue;
        const pr = PARSED_PREREQS.get(full.name) || parsePowerPrereq(full.prereq);
        const ok = pr.reqClauses.every(clause => clause.some(alt => ownedNow.has(alt)));
        if (!ok) {
          removedDeps.push(b.powers[i].name);
          b.powers.splice(i, 1);
          changed = true;
        }
      }
    }
    if (removedDeps.length) {
      showToast(`Снято «${pwName}» и зависимые: ${removedDeps.join(', ')}`);
    }
  } else {
    const full = DB.powers.find(x => x.name === pwName);
    const rkInfo = DB.tables.rankResources[b.rank - 1];
    const maxFocus = Math.max(10, (b.stats['Бдительность'] || 1) * 30);
    const origName = (DB.origins[b.originIdx] && DB.origins[b.originIdx].name) || '';
    const ownedNorm = new Set(b.powers.map(p => normName(p.name)));
    if (full) {
      const reason = getPowerBlockReason(full, ownedNorm, b.rank, maxFocus, origName, rkInfo.powers, b.powers.length);
      if (reason) {
        showToast('Нельзя добавить: ' + reason);
        return;
      }
    }
    b.powers.push({ name: pwName, group: pwGroup });
  }
  renderContent();
}
function toggleBuilderTrait(trName) {
  const b = STATE.builder;
  const idx = b.traits.indexOf(trName);
  if (idx >= 0) b.traits.splice(idx, 1);
  else b.traits.push(trName);
  renderContent();
}
function toggleBuilderTag(tgName) {
  const b = STATE.builder;

  else b.tags.push(tgName);

}

// Interactive Sheet Rolls (D&D Beyond click-to-roll!)
function sheetRollCheck(label, mod, isDamage, mult) {
  const d1 = rollDie(), dm = rollDie(), d3 = rollDie();
  const isMarvel = dm === 1;
  const mVal = isMarvel ? 6 : dm;
  const total = d1 + mVal + d3 + mod;
  const isBotch = (d1 === 1 && dm === 1 && d3 === 1);
  let dmgText = '';
  if (isDamage) {
    const rawDmg = (mVal * mult + mod) * (isMarvel ? 2 : 1);
    dmgText = ` • Урон: ${rawDmg}${isMarvel ? ' (×2 Фантастический!)' : ''}`;
  }
  STATE.builder.lastRoll = {
    label,
    total,
    dice: `${d1} + ${isMarvel ? 'M(6)' : mVal} + ${d3} ${mod >= 0 ? '+ ' + mod : mod}`,
    fantastic: isMarvel && !isBotch,
    botch: isBotch,
    extra: dmgText
  };
  renderContent();
}

function adjSheetVital(field, delta) {
  const b = STATE.builder;
  const maxHp = Math.max(10, (b.stats['Выносливость'] || 0) * 30);
  const maxFp = Math.max(10, (b.stats['Бдительность'] || 0) * 30);
  if (field === 'hp') b.curHp = Math.min(maxHp, b.curHp + delta);
  if (field === 'fp') b.curFp = Math.min(maxFp, b.curFp + delta);
  if (field === 'karma') b.curKarma = Math.max(0, (b.curKarma || 0) + delta);
  if (b.id) saveCurrentHeroSilent();
  renderContent();
}

    STATE.savedHeroes[idx].curHp = b.curHp;
    STATE.savedHeroes[idx].curFp = b.curFp;
    STATE.savedHeroes[idx].curKarma = b.curKarma;
    STATE.savedHeroes[idx].conditions = b.conditions;
    safeSet('mmrpg_saved_heroes_v1', STATE.savedHeroes);
  }
}

function stepBuilderStat(sn, d) {
  const b = STATE.builder;
  const cap = DB.tables.rankResources[b.rank - 1].cap;
  const nv = b.stats[sn] + d;
  if (nv < -3 || nv > cap) return;
  b.stats[sn] = nv;
  syncHeroVitals();
  renderContent();
}
function sendBuilderToCombat() {
  const b = STATE.builder;
  const maxHp = Math.max(10, b.stats['Выносливость'] * 30);
  const maxFp = Math.max(10, b.stats['Бдительность'] * 30);
  STATE.combat.list.push({
    id: Date.now(), name: b.name || 'Новый Герой', rank: b.rank,
    hp: b.curHp || maxHp, maxHp, hpDr: (() => { const dr = getHeroDerivedBonuses(b).dr; return dr ? ('-' + dr) : '—'; })(), fp: b.curFp || maxFp, maxFp,
    initMod: b.stats['Бдительность'],
    initRoll: rollDie() + rollDie() + rollDie() + b.stats['Бдительность'],
    conditions: (b.conditions || []).slice()
  });
  safeSet('mmrpg_combat_v2', STATE.combat);
  showToast('Персонаж добавлен в трекер боя');
}
function copyBuilderSheet() {
  const b = STATE.builder;
  const orig = DB.origins[b.originIdx];
  const occ = DB.occupations[b.occIdx];
  const curArch = HERO_ARCHETYPES.find(a => a.id === b.archetype);
  const hp = Math.max(10, b.stats['Выносливость'] * 30);
  const fp = Math.max(10, b.stats['Бдительность'] * 30);
  let txt = `${b.name} — Ранг ${b.rank}${curArch && curArch.id!=='any' ? ' (' + curArch.label + ')' : ''}\nПроисхождение: ${orig.name} | Род деятельности: ${occ.name}\nЗдоровье: ${hp} | Фокус: ${fp} | Карма: ${b.rank} | Инициатива: +${b.stats['Бдительность']}\n` +
    Object.entries(b.stats).map(([k,v]) => `${k}: ${v} (Защ ${10+v})`).join(' | ');
  if (b.traits && b.traits.length) txt += `\nЧерты: ${b.traits.join(', ')}`;
  if (b.tags && b.tags.length) txt += `\nТеги: ${b.tags.join(', ')}`;
  if (b.powers && b.powers.length) txt += `\nСпособности: ${b.powers.map(p => p.name).join(', ')}`;
  copyText(txt, 'Лист персонажа скопирован');
}

function isHeroBookmarked(heroId) {
  return !!heroId && STATE.bookmarks.some(b => b.route === 'custom_hero' && b.heroId === heroId);
}
function toggleCurrentHeroBookmark() {
  const b = STATE.builder;
  if (!b.id) saveCurrentHero();
  toggleCustomHeroBookmark(b.id);
}
function toggleCustomHeroBookmark(heroId, ev) {
  if (ev) ev.stopPropagation();
  const pos = STATE.bookmarks.findIndex(x => x.route === 'custom_hero' && x.heroId === heroId);
  if (pos >= 0) {
    STATE.bookmarks.splice(pos, 1);
    showToast('Герой удалён из Избранного');
  } else {
    const h = STATE.savedHeroes.find(x => x.id === heroId) || STATE.builder;
    STATE.bookmarks.unshift({ route: 'custom_hero', heroId, title: h.name || 'Мой герой', sub: 'Ранг ' + h.rank });
    showToast('Герой «' + (h.name || 'Мой герой') + '» добавлен в Избранное ★');
  }
  safeSet('mmrpg_bookmarks_v2', STATE.bookmarks);
  updateBookmarkUI();
  renderContent();
}
function openCustomHeroFromBookmark(heroId) {
  const h = STATE.savedHeroes.find(x => x.id === heroId);
  if (!h) { showToast('Персонаж не найден в списке сохранённых'); return; }
  loadSavedHero(heroId);
  navigate('builder');
}

function closeQuickPreview() {
  const el = document.getElementById('previewBackdrop');
  if (el) el.classList.remove('open');
}

function openQuickPreview(route, nameQuery) {
  const arr = DB[route];
  if (!arr) return;
  const q = normName(String(nameQuery || '').replace(/\s*\([^)]*\)/g, ''));
  let idx = arr.findIndex(x => normName(x.name || x.term) === q);
  if (idx < 0) idx = arr.findIndex(x => normName(x.name || x.term).includes(q) || q.includes(normName(x.name || x.term)));
  if (idx < 0) {
    showToast('Подробное описание для «' + nameQuery + '» не найдено');
    return;
  }
  const it = arr[idx];
  const titleEl = document.getElementById('previewTitle');
  const bodyEl = document.getElementById('previewBody');
  const footEl = document.getElementById('previewFoot');

  if (route === 'powers') {
    titleEl.textContent = '⚡ ' + it.name;
    // Make prerequisite power names clickable inside the preview too!
    const pr = PARSED_PREREQS.get(it.name) || { reqClauses: [] };
    const prereqChips = pr.reqClauses.flat().map(n => {
      const found = DB.powers.find(p => normName(p.name) === n);
      return found ? `<span class="chip link" onclick="openQuickPreview('powers','${esc(found.name).replace(/'/g,"\\'")}')">⚡ ${esc(found.name)}</span>` : '';
    }).filter(Boolean).join('');

    bodyEl.innerHTML = `
      ${it.flavor ? `<div class="flavor-quote">${esc(it.flavor)}</div>` : ''}
      <div class="meta-grid">
        <div class="meta-box"><div class="meta-lbl">Группа</div><div class="meta-val">${esc(it.group)}</div></div>
        <div class="meta-box"><div class="meta-lbl">Требования</div><div class="meta-val">${esc(it.prereq)}</div></div>
        <div class="meta-box"><div class="meta-lbl">Действие</div><div class="meta-val">${esc(it.action)}</div></div>
        <div class="meta-box"><div class="meta-lbl">Длительность</div><div class="meta-val">${esc(it.duration)}</div></div>
        ${it.cost ? `<div class="meta-box"><div class="meta-lbl">Стоимость</div><div class="meta-val" style="color:var(--red);">${esc(it.cost)}</div></div>` : ''}
        ${it.range ? `<div class="meta-box"><div class="meta-lbl">Дистанция</div><div class="meta-val">${esc(it.range)}</div></div>` : ''}
      </div>
      ${prereqChips ? `<div class="sub-h" style="margin-top:4px;">Требуемые способности</div><div class="chip-list">${prereqChips}</div>` : ''}
      ${it.trigger ? `<div class="callout"><strong>Триггер:</strong> ${esc(it.trigger)}</div>` : ''}
      <div class="sub-h">Эффект</div>
      <p class="prose">${esc(it.effect)}</p>`;
  } else if (route === 'traits' || route === 'tags') {
    titleEl.textContent = (route === 'traits' ? '★ ' : '🏷️ ') + it.name;

      <div style="font-size:12px;color:#5a6978;margin-bottom:10px;">${esc(it.en)} • стр. ${it.page}</div>
      <p class="prose">${esc(it.desc)}</p>
      ${it.restriction ? `<div class="callout warn"><strong>Ограничение:</strong> ${esc(it.restriction)}</div>` : ''}`;
  } else if (route === 'origins') {
    titleEl.textContent = '🧬 ' + it.name;
    bodyEl.innerHTML = `
      <p class="prose">${esc(it.desc)}</p>
      <div class="meta-grid">
        ${it.traits ? `<div class="meta-box"><div class="meta-lbl">Черты</div><div class="meta-val">${esc(it.traits)}</div></div>` : ''}
        ${it.tags ? `<div class="meta-box"><div class="meta-lbl">Теги</div><div class="meta-val">${esc(it.tags)}</div></div>` : ''}
        ${it.powers ? `<div class="meta-box"><div class="meta-lbl">Способности</div><div class="meta-val">${esc(it.powers)}</div></div>` : ''}
      </div>
      ${it.restriction ? `<div class="callout warn"><strong>Ограничение:</strong> ${esc(it.restriction)}</div>` : ''}
      ${it.examples ? `<div class="callout"><strong>Примеры:</strong> ${esc(it.examples)}</div>` : ''}`;
  } else if (route === 'occupations') {
    titleEl.textContent = '💼 ' + it.name;
    bodyEl.innerHTML = `
      <p class="prose">${esc(it.desc)}</p>
      <div class="meta-grid">
        <div class="meta-box"><div class="meta-lbl">Бесплатные Черты</div><div class="meta-val">${esc(it.traits || '—')}</div></div>
        <div class="meta-box"><div class="meta-lbl">Бесплатные Теги</div><div class="meta-val">${esc(it.tags || '—')}</div></div>
      </div>
      ${it.examples ? `<div class="callout"><strong>Примеры:</strong> ${esc(it.examples)}</div>` : ''}`;
  } else if (route === 'conditions') {

    bodyEl.innerHTML = `
      <div class="callout warn"><strong>Кратко:</strong> ${esc(it.summary)}</div>

  footEl.innerHTML = `
    <button class="btn-sm" onclick="closeQuickPreview();navigate('${route}', ${idx})">Открыть в справочнике →</button>
    <button class="btn-sm primary" onclick="closeQuickPreview()">Готово (вернуться к листу)</button>`;

  document.getElementById('previewBackdrop').classList.add('open');

// =========================================================================
// LEVEL UP MODAL (1 -> 6 WITHOUT LOSING EXISTING BUILD!)
// =========================================================================
function openLevelUpModal() {
  const b = STATE.builder;
  const rkInfo = DB.tables.rankResources[b.rank - 1];
  const statNames = ['Сила','Ловкость','Выносливость','Бдительность','Эго','Логика'];
  const spent = statNames.reduce((acc, s) => acc + (b.stats[s] || 0), 0);
  const remainPts = rkInfo.abilityPts - spent;
  const remainPw = rkInfo.powers - (b.powers || []).length;
  const remainTr = rkInfo.traits - (b.traits || []).length;
  const maxFocus = Math.max(10, (b.stats['Бдительность'] || 1) * 30);
  const origName = (DB.origins[b.originIdx] && DB.origins[b.originIdx].name) || '';
  const ownedNorm = new Set((b.powers || []).map(p => normName(p.name)));

  // Eligible new powers matching current prerequisites & new rank!
  const eligibleNew = DB.powers.filter(p => !ownedNorm.has(normName(p.name)) && canTakePower(p, ownedNorm, b.rank, maxFocus, origName, b.stats));
  const pq = (b.lvlPwSearch || '').toLowerCase();
  const shownPw = eligibleNew.filter(p => !pq || (p.name + ' ' + p.group).toLowerCase().includes(pq)).slice(0, 35);

  document.getElementById('previewTitle').textContent = `⬆ Прокачка героя: ${b.name} (Ранг ${b.rank})`;
  document.getElementById('previewBody').innerHTML = `
    <div class="callout" style="margin-top:0;">
      <strong>Изменить Ранг (без сброса героя):</strong>
      <div class="pill-bar" style="margin-top:8px;">
        ${[1,2,3,4,5,6].map(r => `<button class="pill-btn ${b.rank===r?'active':''}" onclick="setHeroRankLive(${r})">Ранг ${r}</button>`).join('')}
      </div>
      <div style="font-size:12px;margin-top:8px;">
        Бюджет Ранга ${b.rank}: Очки <strong>${spent}/${rkInfo.abilityPts}</strong> (потолок ${rkInfo.cap}) • Способности <strong>${(b.powers||[]).length}/${rkInfo.powers}</strong> • Черты <strong>${(b.traits||[]).length}/${rkInfo.traits}</strong> • Карма <strong>${rkInfo.karma}</strong>
      </div>
    </div>

    <div class="sub-h">1. Дораспределить характеристики (осталось: ${remainPts})</div>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:6px;margin-bottom:12px;">
      ${statNames.map(sn => `
        <div class="meta-box" style="display:flex;justify-content:space-between;align-items:center;">
          <div><div class="meta-lbl">${sn}</div><div class="meta-val">${b.stats[sn]}</div></div>
          <div style="display:flex;gap:4px;">
            <button class="btn-sm" onclick="stepRankStat('${sn}',-1)">−</button>
            <button class="btn-sm" onclick="stepRankStat('${sn}',1)">+</button>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="sub-h">2. Добрать новые способности (свободно слотов: ${remainPw} • доступно по требованиям: ${eligibleNew.length})</div>
    <input type="text" class="filter-input" style="margin-bottom:8px;" value="${esc(b.lvlPwSearch||'')}" placeholder="Поиск доступной способности..." oninput="STATE.builder.lvlPwSearch=this.value;openLevelUpModal();">
    <div class="picker-list" style="max-height:200px;margin-bottom:10px;">
      ${shownPw.map(p => `
        <div class="picker-item">
          <div><strong>⚡ ${esc(p.name)}</strong> <span class="tag-mini">${esc(p.group)}</span><div style="font-size:11px;color:#5a6878;">Треб: ${esc(p.prereq)}</div></div>
          <button class="btn-sm primary" onclick="addPowerInLevelUp('${esc(p.name).replace(/'/g,"\\'")}','${esc(p.group).replace(/'/g,"\\'")}')">+ Взять</button>
        </div>
      `).join('') || '<div style="padding:12px;font-size:12px;color:#667585;">Нет подходящих способностей по поиску.</div>'}
    </div>
    <div style="font-size:12px;color:#5a6878;">Свободных черт на Ранге ${b.rank}: <strong>${remainTr}</strong> — добрать их можно на шаге «4. Способности».</div>
  `;
  document.getElementById('previewFoot').innerHTML = `
    <button class="btn-sm" onclick="closeQuickPreview();setBuilderStep('powers')">Открыть все способности и черты</button>
    <button class="btn-sm primary" onclick="saveCurrentHero();closeQuickPreview();renderContent();">✓ Сохранить прокачку</button>`;
  document.getElementById('previewBackdrop').classList.add('open');
}

function setHeroRankLive(newRank) {
  const b = STATE.builder;
  b.rank = newRank;
  b.curKarma = newRank;
  if (b.genOpts) b.genOpts.rank = String(newRank);
  showToast(`Ранг персонажа изменён на ${newRank} — можно добрать очки и способности!`);
  openLevelUpModal();
  renderContent();
}
function stepRankStat(sn, d) {
  const b = STATE.builder;
  const cap = DB.tables.rankResources[b.rank - 1].cap;
  const nv = b.stats[sn] + d;
  if (nv < -3 || nv > cap) return;
  b.stats[sn] = nv;
  syncHeroVitals();
  openLevelUpModal();
  renderContent();
}
function addPowerInLevelUp(name, group) {
  const b = STATE.builder;
  const rkInfo = DB.tables.rankResources[b.rank - 1];
  const maxFocus = Math.max(10, (b.stats['Бдительность'] || 1) * 30);
  const origName = (DB.origins[b.originIdx] && DB.origins[b.originIdx].name) || '';
  const ownedNorm = new Set((b.powers || []).map(p => normName(p.name)));
  const full = DB.powers.find(x => x.name === name);
  if (full) {
    const reason = getPowerBlockReason(full, ownedNorm, b.rank, maxFocus, origName, rkInfo.powers, b.powers.length);
    if (reason) { showToast('Нельзя добавить: ' + reason); return; }
  }
  b.powers.push({ name, group });
  showToast('Добавлена способность: ' + name);
  openLevelUpModal();
  renderContent();
}

// =========================================================================
// ACCOUNT & BACKUP MODAL (JSON EXPORT/IMPORT + SYNC CODE + CLOUD CONFIG)
// =========================================================================
const FIREBASE_CONFIG = null; // Вставьте объект конфигурации Firebase для облачной синхронизации

function openAccountModal() {
  const profileName = safeGet('mmrpg_user_profile_v1', { name: 'Игрок D616' }).name;
  document.getElementById('previewTitle').textContent = '👤 Профиль и Сохранение персонажей';
  document.getElementById('previewBody').innerHTML = `
    <div class="field" style="margin-bottom:12px;">
      <label>Имя игрока (локальный профиль)</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="profNameInput" value="${esc(profileName)}" placeholder="Ваше имя или ник">
        <button class="btn-sm primary" onclick="saveLocalProfile()">Сохранить</button>
      </div>
    </div>

    <div class="meta-grid">
      <div class="meta-box"><div class="meta-lbl">Мои персонажи</div><div class="meta-val">${STATE.savedHeroes.length}</div></div>
      <div class="meta-box"><div class="meta-lbl">В Избранном</div><div class="meta-val">${STATE.bookmarks.length}</div></div>
      <div class="meta-box"><div class="meta-lbl">В Трекере боя</div><div class="meta-val">${STATE.combat.list.length}</div></div>
    </div>

    <div class="sub-h">Резервная копия и перенос на другой телефон / ПК</div>
    <p class="prose" style="font-size:13px;">Все герои автоматически сохраняются в браузере. Чтобы перенести их на другой телефон или не потерять при очистке кэша, скачайте файл резервной копии или скопируйте код переноса:</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;">
      <button class="btn-sm primary" onclick="exportAllBackupJson()">⬇ Скачать бэкап (.json)</button>
      <button class="btn-sm blue" onclick="document.getElementById('importJsonInput').click()">⬆ Загрузить бэкап (.json)</button>
      <button class="btn-sm" onclick="copySyncCode()">📋 Копировать код переноса</button>
    </div>

    <div class="field" style="margin-bottom:12px;">
      <label>Вставить код переноса с другого устройства</label>
      <div style="display:flex;gap:6px;">
        <input type="text" id="syncCodeInput" placeholder="Вставьте сюда скопированный код...">
        <button class="btn-sm" onclick="applySyncCode()">Восстановить</button>
      </div>
    </div>

    <div class="callout" style="margin-bottom:0;font-size:12px;">
      <strong>Облачный аккаунт (Firebase):</strong> ${FIREBASE_CONFIG ? 'Подключён' : 'Не настроен (работает локальное сохранение + бэкап JSON). Чтобы включить вход по Email/Google между устройствами на GitHub Pages, создайте бесплатный проект в Firebase и вставьте конфиг в константу <code>FIREBASE_CONFIG</code>.'}
    </div>
  `;
  document.getElementById('previewFoot').innerHTML = `
    <span style="font-size:11.5px;color:#5a6978;">Автосохранение активно</span>
    <button class="btn-sm primary" onclick="closeQuickPreview()">Готово</button>`;
  document.getElementById('previewBackdrop').classList.add('open');
}

function saveLocalProfile() {
  const v = (document.getElementById('profNameInput')?.value || '').trim() || 'Игрок D616';
  safeSet('mmrpg_user_profile_v1', { name: v });
  showToast('Профиль «' + v + '» сохранён');
}
function buildBackupPayload() {
  return {
    version: 2,
    exportedAt: new Date().toISOString(),
    savedHeroes: STATE.savedHeroes,
    bookmarks: STATE.bookmarks,
    combat: STATE.combat
  };
}
function exportAllBackupJson() {
  const blob = new Blob([JSON.stringify(buildBackupPayload(), null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'marvel_rpg_backup.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Файл резервной копии скачан');
}
function handleImportJsonFile(ev) {
  const file = ev.target.files && ev.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      applyBackupData(data);
    } catch (e) {
      showToast('Ошибка чтения файла резервной копии');
    }
    ev.target.value = '';
  };
  reader.readAsText(file);
}
function copySyncCode() {
  const jsonStr = JSON.stringify(buildBackupPayload());
  const b64 = btoa(unescape(encodeURIComponent(jsonStr)));
  copyText(b64, 'Код переноса скопирован — отправьте его себе на другой телефон');
}
function applySyncCode() {
  const raw = (document.getElementById('syncCodeInput')?.value || '').trim();
  if (!raw) { showToast('Вставьте код переноса'); return; }
  try {
    const jsonStr = decodeURIComponent(escape(atob(raw)));
    applyBackupData(JSON.parse(jsonStr));
  } catch (e) {
    showToast('Некорректный код переноса');
  }
}
function applyBackupData(data) {
  if (!data || typeof data !== 'object') { showToast('Неверный формат данных'); return; }
  if (Array.isArray(data.savedHeroes)) {
    STATE.savedHeroes = data.savedHeroes;
    safeSet('mmrpg_saved_heroes_v1', STATE.savedHeroes);
  }
  if (Array.isArray(data.bookmarks)) {
    STATE.bookmarks = data.bookmarks;
    safeSet('mmrpg_bookmarks_v2', STATE.bookmarks);
    updateBookmarkUI();
  }
  if (data.combat && Array.isArray(data.combat.list)) {
    STATE.combat = data.combat;
    safeSet('mmrpg_combat_v2', STATE.combat);
  }
  showToast(`Восстановлено героев: ${STATE.savedHeroes.length}, закладок: ${STATE.bookmarks.length}`);
  openAccountModal();
  renderContent();
}
